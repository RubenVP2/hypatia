[package]
name = "hypatia"
version = "0.4.0"
edition = "2021"
description = "Local, read-only League of Legends companion"

[dependencies]
hypatia-core = { path = "../core" }
hypatia-shared = { path = "../shared" }
slint = "1.18"
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
