      return `<span class="obj ${b.mine ? "blue" : "red"}" style="border-color:var(--gold-bright)">${objectiveSvg(b.label)}<span>${esc(b.label)} ${m}:${sec} · ${b.holders_alive}/5</span></span>`;
    }).join("");

    return `
      <section class="hud">
        <div class="hud-side blue"><span class="score">${lg.my_kills}</span><span class="towers">${TOWER_SVG}${lg.my_towers}</span></div>
        <div class="hud-clock">
          ${clockSec != null ? clockHtml(clockSec, { cls: "inline" }) : `<span class="clock inline">${esc(lg.clock)}</span>`}
          <span class="hud-mode">${esc(gameModeLabel(lg.game_mode))}</span>
        </div>
        <div class="hud-side red"><span class="towers">${lg.enemy_towers}${TOWER_SVG}</span><span class="score">${lg.enemy_kills}</span></div>
      </section>
      ${livePitsHtml(lg)}
      ${heroCard}
      <section class="panel board">${list.map(p => liveRow(p, ui.liveTab === "allies")).join("")}</section>
      ${(buffs || (lg.objectives || []).length) ? `<section class="panel">
        <div class="eyebrow" style="margin-bottom:8px">${esc(t("objectives"))}</div>
        <div class="obj-strip">${buffs}${(lg.objectives || []).map(o => `<span class="obj ${o.mine ? "blue" : "red"}">${objectiveSvg(o.label)}<span>${esc(o.label)}</span></span>`).join("")}</div>
      </section>` : ""}
      ${(lg.feed || []).length ? `<section class="panel">
        <div class="eyebrow" style="margin-bottom:6px">${esc(t("recentEvents"))}</div>
        ${lg.feed.map(f => {
          const color = f.side === 0 ? "var(--red)" : (f.side === 1 ? "var(--blue)" : "var(--muted)");
          return `<div class="feed-item"><span class="feed-t">${esc(f.time)}</span><span style="display:inline-flex;color:${color}">${objectiveSvg(f.text, 15)}</span><span class="grow" style="font-weight:600${f.side === 0 ? ";color:var(--red)" : ""}">${esc(f.text)}</span></div>`;
        }).join("")}
      </section>` : ""}`;
  }

  // ---- Results --------------------------------------------------------------------------------
  function isDefeat(e) {
    const r = String(e.result || "").toLowerCase();
    if (r.includes("defeat") || r.includes("lose") || r.includes("loss")) return true;
    if (r.includes("victory") || r.includes("win")) return false;
    const mine = (e.teams || []).find(tm => tm.is_player_team);
    return mine ? !mine.won : false;
  }
  const CREST_SVG = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true">
      <path d="M50 6l36 20v48L50 94 14 74V26z"/><path d="M50 20l24 13v34L50 80 26 67V33z" opacity="0.55"/>
      <path d="M50 34l12 16-12 16-12-16z" fill="currentColor" fill-opacity="0.25"/></svg>`;
  function renderEnd(s) {
    const e = s.end_of_game;
    renderDock(`<button class="btn btn-plate btn-block" data-action="play-again">${esc(t("playAgain"))}</button>`);
    if (!e || !(e.champion_id > 0 || (e.teams || []).length)) {
      return `<section class="panel hero-center">
          <div class="crest" style="color:var(--gold-bright)">${CREST_SVG}</div>
          <h2 class="title">${esc(t("matchCompleted"))}</h2>
          <div class="meta">${esc(t("eogDetail"))}</div>
        </section>`;
    }
    const lost = isDefeat(e);
    const mins = Math.max(1, (e.game_length_sec || 0) / 60);
    const ratio = e.deaths > 0 ? ((e.kills + e.assists) / e.deaths).toFixed(2) : t("perfect");
    const tile = (val, label) => `<div class="tile"><b>${val}</b><span>${esc(label)}</span></div>`;
    const allPlayers = (e.teams || []).flatMap(tm => tm.players || []);
    const maxDmg = Math.max(1, ...allPlayers.map(p => Number(p.damage_to_champions || 0)));
    const dmgMode = ui.eogTab === "dmg";
    const teamBlock = (tm) => {
      const totals = (tm.total_kills || tm.total_gold)
        ? `<span class="meta mono" style="font-size:11px">${tm.total_kills} · ${fmtNum(tm.total_gold)} ${esc(t("gold"))} · ${fmtNum(tm.total_damage)}</span>`
        : "";
      return `
      <section class="panel board">
        <div class="team-head">
          <span class="eyebrow">${esc(tm.is_player_team ? t("yourTeam") : t("enemyTeam"))}</span>
          <span class="row" style="gap:6px">${totals}<span class="tag ${tm.won ? "gold" : ""}">${esc(tm.won ? t("victory") : t("defeat"))}</span></span>
        </div>
        ${(tm.players || []).map((p, i) => {
          const badge = p.is_mvp
            ? `<span class="tag gold">MVP</span>`
            : (p.is_ace ? `<span class="tag online">ACE</span>` : "");
          const score = p.performance_score > 0 ? `<span class="meta mono" style="font-size:11px">${p.performance_score}</span>` : "";
          const kp = p.kill_participation > 0 ? ` · ${Math.round(p.kill_participation * 100)}% KP` : "";
          const pct = Math.max(4, Math.round((Number(p.damage_to_champions || 0) / maxDmg) * 100));
          const sub = dmgMode
            ? `<div class="dmg-bar" style="height:6px;border-radius:3px;overflow:hidden;background:var(--raised);margin:4px 0 2px"><span style="display:block;height:100%;width:${pct}%;background:${tm.is_player_team ? "var(--blue)" : "var(--red)"}"></span></div>
               <div class="ally-sub mono">${fmtNum(p.damage_to_champions || 0)} (${Math.round((p.damage_share || 0) * 100)}%) · ${fmtNum(p.gold_earned || 0)} ${esc(t("gold"))}</div>`
            : `<div class="ally-sub">${esc(t("lvl", p.level))} · ${p.creep_score} ${esc(t("cs"))}${esc(kp)}</div>`;
          return `
          <div class="ally locked ${p.is_self ? "self" : ""}" data-key="eog-${tm.is_player_team ? "a" : "e"}-${i}">
            ${bannerHtml(p.skin_id, p.champion_id)}
            ${roundel(p.position)}
            ${champPt(p.champion_id, p.champion_name, 38, (p.is_self ? "self " : "") + (tm.is_player_team ? "" : "enemy"))}
            <div class="grow">
              <div class="row" style="gap:6px"><span class="ally-name ellipsis">${esc(p.champion_name)}</span>${badge}${score}</div>
              ${sub}
            </div>
            <span class="side"><span class="kda-txt">${p.kills}/${p.deaths}/${p.assists}</span></span>
          </div>`;
        }).join("")}
      </section>`;
    };
    const switcher = (e.teams || []).length ? `<div class="st-seg two" style="margin:0 0 8px" role="radiogroup">
        <button class="${!dmgMode ? "active" : ""}" data-action="eog-tab" data-tab="board">${esc(t("eogScoreboard"))}</button>
        <button class="${dmgMode ? "active" : ""}" data-action="eog-tab" data-tab="dmg">${esc(t("eogDmgGold"))}</button>
      </div>` : "";
    return `
      <section class="panel result ${lost ? "defeat" : "victory"}">
        <div class="crest">${imgTag("art", lost ? ART.defeat : ART.victory, "art")}${CREST_SVG}</div>
        <div class="result-title">${esc(lost ? t("defeat") : t("victory"))}</div>
        <div class="meta">${esc(e.champion_name)} · <span class="mono">${fmtSec(e.game_length_sec)}</span></div>
      </section>
      <div class="tiles">
        <div class="tile wide"><b>${e.kills} / ${e.deaths} / ${e.assists}</b><span>${esc(t("kdaRatio"))} ${esc(ratio)}</span></div>
        ${tile((e.creep_score / mins).toFixed(1), t("csMin"))}
        ${tile(fmtNum(e.total_gold), t("gold"))}
        ${tile(fmtNum(e.damage_to_champions), t("damage"))}
      </div>
      ${switcher}
      ${(e.teams || []).map(teamBlock).join("")}`;
  }

  function renderIdle(s) {
    renderDock("");
    const queues = (s && s.available_queues) || [];
    return `<section class="panel hero-center">
        <div class="crest" style="color:var(--gold-bright)">${CREST_SVG}</div>
        <h2 class="title">${esc(t("standingBy"))}</h2>
        <div class="meta">${esc(t("idleDetail"))}</div>
      </section>
      ${queues.length ? `<section class="panel" data-key="idle-queues">
        <div class="eyebrow">${esc(t("startLobby"))}</div>
        ${queueGridHtml(queues, 0)}
      </section>` : ""}`;
  }

  // ---- Stats tab: Champion Stats, read-only ---------------------------------------------------
  // Views come from `GET /api/stats/{view}`; nothing on this tab sends a command or changes a
  // setting. A view still loading is read again when a pushed state brings a new stats_revision.
  const STATS_VIEW = { build: "build", tiers: "tiers", matchups: "matchups", mine: "profile" };
  const ROLE_KEYS = ["TOP", "JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"];
  const POS_KEY = { Top: "TOP", Jungle: "JUNGLE", Mid: "MIDDLE", Bot: "BOTTOM", Support: "UTILITY" };
  const EXT_SVG = `<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`;
  const INFO_SVG = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>`;
  const CHEV_SVG = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;

  function statsKey(tab) {
    const lang = activeLang();
    if (tab === "tiers") return `tiers|${ui.tierQueue}|${ui.tierBracket}|${ui.tierRole}|${ui.tierSort}|${ui.tierDir}|${ui.tierOffMeta ? 1 : 0}|${lang}`;
    if (tab === "mine") return `profile|${ui.myQueue}|${ui.myRole}|${lang}`;
    if (tab === "build") return `build|${ui.statsChamp}|${ui.statsPos}|${ui.buildQueue}|${ui.buildBracket}|${lang}`;
    if (tab === "matchups") return `matchups|${ui.statsChamp}|${ui.statsPos}|${ui.muAll ? 1 : 0}|${lang}`;
    return `${tab}|${ui.statsChamp}|${ui.statsPos}|${lang}`;
  }
  function statsUrl(tab) {
    const p = new URLSearchParams();
    if (URL_TOKEN) p.set("token", URL_TOKEN);
    p.set("lang", activeLang());
    if (tab === "build" || tab === "matchups") {
      if (ui.statsChamp > 0) p.set("champion", String(ui.statsChamp));
      if (ui.statsPos) p.set("position", ui.statsPos);
      if (tab === "build") {
        p.set("queue", ui.buildQueue);
        p.set("bracket", ui.buildBracket);
      } else if (ui.muAll) {
        p.set("all", "true");
      }
    } else if (tab === "tiers") {
      p.set("queue", ui.tierQueue);
      p.set("bracket", ui.tierBracket);
      if (ui.tierRole !== "ALL") p.set("role", ui.tierRole);
      p.set("sort", ui.tierSort);
      p.set("dir", ui.tierDir);
      if (ui.tierOffMeta) p.set("off_meta", "true");
    } else if (tab === "mine") {
      if (ui.myQueue !== "all") p.set("queue", ui.myQueue);
      if (ui.myRole !== "ALL") p.set("role", ui.myRole);
    }
    return `/api/stats/${STATS_VIEW[tab]}?${p}`;
  }
  function authHeaders() {
    const h = {};
    if (URL_TOKEN) h["X-Hypatia-Token"] = URL_TOKEN;
    return h;
  }
  /** Reads the open sub-tab's view unless the one held already answers it (`force`: read again). */
  async function loadStats(force) {
    const tab = ui.statsTab;
    const key = statsKey(tab);
    const have = ui.statsData[tab];
    if (!force && ((have && have.key === key) || ui.statsPending === key)) return;
    const seq = ++ui.statsSeq;
    ui.statsPending = key;
    let ok = false;
    try {
      const res = await fetch(statsUrl(tab), { headers: authHeaders() });
      if (res.ok) {
        const json = await res.json();
        if (seq === ui.statsSeq) {
          // The server picked the champion and role (the game's, else the most played): keep them
          // so Build and Matchups follow the same champion.
          if ((tab === "build" || tab === "matchups") && json.champion) {
            ui.statsChamp = json.champion.id;
            ui.statsPos = POS_KEY[json.position] || "";
          }
          ui.statsData[tab] = { key: statsKey(tab), json };
        }
        ok = true;
      }
    } catch (_) {}
    if (seq !== ui.statsSeq) return;
    ui.statsPending = "";
    ui.statsErr = !ok;
    if (ui.mode === "stats" && ui.state) renderState(ui.state);
  }
  /** The champion roster for the search field, read once per language. */
  async function loadRoster() {
    const lang = activeLang();
    if ((ui.roster && ui.rosterLang === lang) || ui.rosterPending === lang) return;
    ui.rosterPending = lang;
    try {
      const p = new URLSearchParams({ lang });
      if (URL_TOKEN) p.set("token", URL_TOKEN);
      const res = await fetch(`/api/stats/champions?${p}`, { headers: authHeaders() });
      if (res.ok) { ui.roster = await res.json(); ui.rosterLang = lang; }
    } catch (_) {}
    ui.rosterPending = "";
    if (ui.mode === "stats" && ui.state) renderState(ui.state);
  }
  function foldKey(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }
  function searchRoster(q) {
    const key = foldKey(q);
    if (!key || !ui.roster || ui.rosterLang !== activeLang()) return [];
    const starts = [];
    const contains = [];
    for (const c of ui.roster) {
      const n = foldKey(c.name);
      if (n.startsWith(key)) starts.push(c);
      else if (n.includes(key)) contains.push(c);
    }
    return starts.concat(contains).slice(0, 8);
  }

  function fmtDec(n) {
    return Number(n || 0).toLocaleString(activeLang() === "fr" ? "fr-FR" : "en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }
  function kdaRatio(k, d, a) { return (Number(k) + Number(a)) / Math.max(1, Number(d)); }
  function rateLine(r) { return r ? t("stRateLine", fmtPct(r.pick_rate), fmtPct(r.win_rate)) : ""; }
  function laneOf(pos) { return POS_KEY[pos] || ""; }
  function extLink(url, label) {
    return url ? `<a class="hl-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}${EXT_SVG}</a>` : "";
  }
  /** The provider credit, carried only by Online blocks (the server drops it for any other). */
  function creditLink(b) {
    return b && b.attribution ? extLink(b.attribution.url, t("dataFrom", b.attribution.provider)) : "";
  }
  function skeleton() {
    return `<div aria-label="${esc(t("stLoading"))}" role="status"><i class="skel"></i><i class="skel w70"></i><i class="skel w40"></i></div>`;
  }
  /** A block that is not ready: still bars while loading, else one plain sentence. */
  function blockState(b) {
    if (!b || b.state === "Ready") return "";
    if (b.state === "Loading") return skeleton();
    if (b.state === "OnlineDisabled") {
      return `<div class="st-state">${INFO_SVG}<div><b>${esc(t("stOffTitle"))}</b>${esc(t("stOffBody"))}</div></div>`;
    }
    const msg = b.state === "ClientOffline" ? t("stOffline")
      : b.state === "NoData" ? t("stNoData")
      : (b.message || t("stFailed"));
    return `<div class="st-state">${INFO_SVG}<span>${esc(msg)}</span></div>`;
  }
  function blockHead(title, origin, extra = "") {
    return `<div class="section-head"><span class="eyebrow">${esc(title)}</span><span class="row" style="gap:6px">${extra}${originTag(origin)}</span></div>`;
  }
  function itemPt(n, size) { return pt("item", n.id, esc(initials(n.name)), size); }
  function perkRow(n, size) {
    return `<span class="perk">${pt("perk", n.id, esc(initials(n.name)), size, "round")}<span>${esc(n.name)}</span></span>`;
  }

  // Build and Matchups share the champion picker: portrait, search, most played, roles.
  function pickerPanel(v) {
    const c = v && v.champion;
    const q = ui.statsSearch;
    const searching = q.trim().length > 0;
    const list = searching ? searchRoster(q) : ((v && v.picks) || []);
    const chips = list.length
      ? `<div class="chip-grid">${list.map(ch => `<button class="chip ${c && ch.id === c.id ? "active" : ""}" data-action="st-champ" data-id="${ch.id}">${champPt(ch.id, ch.name, 28, "round")}<span>${esc(ch.name)}</span></button>`).join("")}</div>`
      : (searching ? `<div class="meta" style="margin-top:8px">${esc(ui.roster ? t("stNoChamp") : t("stLoading"))}</div>` : "");
    const pos = v && laneOf(v.position);
    const roles = c ? `<div class="st-roles" role="radiogroup" aria-label="${esc(t("roles"))}">${ROLE_KEYS.map(k => {
        const on = pos === k;
        const l = laneInfo(k);
        return `<button class="st-role ${on ? "active" : ""}" role="radio" aria-checked="${on}" data-action="st-role" data-role="${k}">${laneSvg(k, 17, l.color)}<span>${esc(l.label)}</span></button>`;
      }).join("")}</div>` : "";
    const rates = ui.statsTab === "build" && v && v.rates ? `<div class="st-rates">
        <div class="st-rate"><b>${esc(fmtPct(v.rates.win_rate))}</b><span>${esc(t("stWin"))}</span></div>
        <div class="st-rate"><b>${esc(fmtPct(v.rates.pick_rate))}</b><span>${esc(t("stPick"))}</span></div>
        <div class="st-rate"><b>${esc(fmtPct(v.rates.ban_rate))}</b><span>${esc(t("stBan"))}</span></div>
        <div class="st-rate"><b>${esc(fmtNum(v.rates.games))}</b><span>${esc(t("stGames"))}</span></div>
      </div>` : "";
    const head = c
      ? `<div class="st-hero" data-key="st-hero-${c.id}">
          ${champPt(c.id, c.name, 56, "self")}
          <div class="grow">
            <div class="eyebrow">${esc(ui.statsTab === "build" ? t("stChampBuild") : t("stTabMatchups"))}</div>
            <div class="st-name ellipsis">${esc(c.name)}</div>
            <div class="st-links">${extLink(v.dpm_url, t("stOpenDpm"))}</div>
          </div>
        </div>`
      : `<div><div class="eyebrow">${esc(t("stChoose"))}</div><div class="meta" style="margin-top:4px">${esc(t("stChooseHint"))}</div></div>`;
    return `<section class="panel" data-key="st-picker">
        ${head}
        ${rates}
        <input id="stats-search" class="search" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" style="margin-top:12px" value="${esc(q)}" placeholder="${esc(t("stSearch"))}" aria-label="${esc(t("stSearch"))}">
        ${list.length ? `<div class="sub-k">${esc(searching ? t("stMatches") : t("stMostPlayed"))}</div>` : ""}
        ${chips}
        ${roles}
      </section>`;
  }

  function runePageHtml(p) {
    const shard = n => SHARD_NAMES[n.id] ? shardName(n.id) : n.name;
    const hasGrid = p.primary_rows && p.primary_rows.length > 0;
    const renderNode = (n, sz, isKey) => {
      const cls = n.active ? (isKey ? "rp-node key-on" : "rp-node on") : "rp-node dim";
      return `<span class="${cls}" title="${esc(n.name)}">${pt("perk", n.id, esc(initials(n.name)), sz, "round")}</span>`;
    };
    const body = hasGrid
      ? `<div class="rp-grid">
          <div class="rp-col">
            <span class="rp-style">${pt("style", p.primary.id, "", 16, "round no-rim")}<span>${esc(styleName(p.primary.id, p.primary.name))}</span></span>
            ${p.primary_rows.map((row, ri) => `<div class="rp-row">${row.map(n => renderNode(n, ri === 0 ? 32 : 24, ri === 0)).join("")}</div>`).join("")}
            ${p.keystone ? `<b class="ellipsis" style="font-size:12px">${esc(p.keystone.name)}</b>` : ""}
          </div>
          <div class="rp-col">
            <span class="rp-style">${pt("style", p.secondary.id, "", 16, "round no-rim")}<span>${esc(styleName(p.secondary.id, p.secondary.name))}</span></span>
            ${(p.secondary_rows || []).map(row => `<div class="rp-row">${row.map(n => renderNode(n, 22, false)).join("")}</div>`).join("")}
            ${(p.shard_rows && p.shard_rows.length) ? `<div class="sub-k" style="margin-top:4px">${esc(t("stShards"))}</div>${p.shard_rows.map(row => `<div class="rp-row">${row.map(n => renderNode({ id: n.id, name: shard(n), active: n.active }, 18, false)).join("")}</div>`).join("")}` : ""}
          </div>
        </div>`
      : `${p.keystone ? `<div class="rp-key">
          ${pt("perk", p.keystone.id, esc(initials(p.keystone.name)), 40, "round")}
          <div class="grow"><b class="ellipsis" style="display:block">${esc(p.keystone.name)}</b>
            <span class="meta">${esc(styleName(p.primary.id, p.primary.name))} + ${esc(styleName(p.secondary.id, p.secondary.name))}</span></div>
        </div>` : ""}
        <div class="rp-cols">
          <div class="stack"><span class="rp-style">${pt("style", p.primary.id, "", 16, "round no-rim")}<span>${esc(styleName(p.primary.id, p.primary.name))}</span></span>${p.primary_perks.map(n => perkRow(n, 26)).join("")}</div>
          <div class="stack"><span class="rp-style">${pt("style", p.secondary.id, "", 16, "round no-rim")}<span>${esc(styleName(p.secondary.id, p.secondary.name))}</span></span>${p.secondary_perks.map(n => perkRow(n, 26)).join("")}</div>
        </div>
        ${p.shards.length ? `<div class="sub-k" style="margin-top:10px">${esc(t("stShards"))}</div><div class="shards" style="margin-top:0">${p.shards.map(n => `<span class="tag">${esc(shard(n))}</span>`).join("")}</div>` : ""}`;
    return `<div class="rp">
        <div class="rp-head"><b class="grow">${esc(tk("stPage_", p.kind))}</b>${originTag(p.origin)}</div>
        ${p.rates ? `<div class="meta mono" style="margin-top:2px">${esc(rateLine(p.rates))}</div>` : ""}
        ${p.matches_client ? `<div class="meta" style="margin-top:2px">${esc(t("stSameAsClient"))}</div>` : ""}
        ${body}
      </div>`;
  }

  function buildBody(v) {
    if (!v.champion) return pickerPanel(v);
    const online = v.build.origin === "Online";
    const credit = online ? creditLink(v.build) : "";
    const out = [pickerPanel(v)];
    const queues = [["ranked_solo", t("stQueueSolo")], ["aram", "ARAM"], ["arena", t("stQueueArena")]];
    const brackets = [["all", t("stAllRanks")], ["emerald_plus", t("stEmeraldPlus")], ["diamond_plus", t("stDiamondPlus")], ["master_plus", t("stMasterPlus")]];
    out.push(`<section class="panel" data-key="st-build-controls">
        <div class="st-seg" role="radiogroup">${queues.map(([k, l]) => `<button class="${ui.buildQueue === k ? "active" : ""}" role="radio" aria-checked="${ui.buildQueue === k}" data-action="st-build-queue" data-queue="${k}">${esc(l)}</button>`).join("")}</div>
        ${ui.buildQueue === "ranked_solo" ? `<div class="st-seg four" style="margin-top:8px" role="radiogroup">${brackets.map(([k, l]) => `<button class="${ui.buildBracket === k ? "active" : ""}" role="radio" aria-checked="${ui.buildBracket === k}" data-action="st-build-bracket" data-bracket="${k}">${esc(l)}</button>`).join("")}</div>` : ""}
        ${v.tier_rank ? `<div class="row" style="gap:8px;margin-top:8px"><span class="tier-badge ${esc(v.tier_rank[0])}">${esc(v.tier_rank[0] === "SPlus" ? "S+" : v.tier_rank[0])}</span><span class="meta mono">${esc(t("stRankPos", v.tier_rank[1], v.tier_rank[2]))}</span></div>` : ""}
      </section>`);
    if (v.local_build) {
      const lb = v.local_build;
      const wr = lb.wins / Math.max(1, lb.games);
      out.push(`<section class="panel">
          ${blockHead(t("stYourGames"), lb.origin)}
          <div class="meta mono" style="margin-top:-4px">${esc(t("stGamesN", lb.games))} · ${esc(t("stRecord", lb.wins, lb.games - lb.wins))} · ${esc(fmtPct(wr))} · ${esc(fmtDec(kdaRatio(lb.kills, lb.deaths, lb.assists)))} ${esc(t("kdaRatio"))}</div>
          <div class="kit" style="margin-top:8px">${lb.keystone ? pt("perk", lb.keystone.id, esc(initials(lb.keystone.name)), 26, "round") : ""}${lb.spells ? lb.spells.map(s => pt("spell", s.id, spellFallbackGlyph(s.id, spellName(s.id, s.name)), 24)).join("") : ""}${lb.items.map(n => itemPt(n, 26)).join("")}</div>
        </section>`);
    }
    if (v.build.state !== "Ready") {
      out.push(`<section class="panel">${blockHead(t("stGlobalBuild"), null)}${blockState(v.build)}</section>`);
    }
    if (v.rune_pages.length) {
      out.push(`<section class="panel">${blockHead(t("runes"), null)}${v.rune_pages.map(runePageHtml).join("")}${v.rune_pages.some(p => p.origin === "Online") ? `<div class="st-links">${credit}</div>` : ""}</section>`);
    } else if (v.client.state !== "Ready" && v.client.state !== "NoData") {
      out.push(`<section class="panel">${blockHead(t("runes"), null)}${blockState(v.client)}</section>`);
    }
    if (v.spells.length) {
      out.push(`<section class="panel">${blockHead(t("sumSpells"), null)}${v.spells.map(r => `
          <div class="hl-row">
            ${pt("spell", r.first.id, spellFallbackGlyph(r.first.id, spellName(r.first.id, r.first.name)), 36)}
            ${pt("spell", r.second.id, spellFallbackGlyph(r.second.id, spellName(r.second.id, r.second.name)), 36)}
            <span class="grow"><b class="ellipsis" style="display:block">${esc(spellName(r.first.id, r.first.name))} + ${esc(spellName(r.second.id, r.second.name))}</b>
              ${r.rates ? `<span class="meta mono">${esc(rateLine(r.rates))}</span>` : ""}</span>
            ${originTag(r.origin)}
          </div>`).join("")}</section>`);
    }
    if (v.items.length) {
      const isSlot = st => st.stage && st.stage.startsWith("Slot");
      const stageItems = v.items.filter(st => !isSlot(st));
      const slotItems = v.items.filter(isSlot);
      const shownItems = (ui.itemView === "slot" && slotItems.length) ? slotItems : stageItems;
      const toggle = slotItems.length ? `<div class="st-seg two" style="margin-bottom:8px" role="radiogroup"><button class="${ui.itemView !== "slot" ? "active" : ""}" data-action="st-item-view" data-view="stage">${esc(t("stByStage"))}</button><button class="${ui.itemView === "slot" ? "active" : ""}" data-action="st-item-view" data-view="slot">${esc(t("stBySlot"))}</button></div>` : "";
      const itemOrig = v.items_origin || v.build.origin;
      out.push(`<section class="panel">${blockHead(t("stItemPath"), itemOrig)}${toggle}${shownItems.map(st => {
          const core = st.stage === "Core";
          const items = st.items.map(n => `<span class="it">${itemPt(n, 40)}<span class="meta">${esc(n.name)}</span></span>`);
          return `<div class="stage">
              <div class="stage-head"><span class="slot-k">${esc(tk("stage_", (st.stage || "Items")).toUpperCase())}</span>${st.rates ? `<span class="meta mono">${esc(rateLine(st.rates))}</span>` : ""}</div>
              <div class="stage-items">${core ? items.join(`<span class="chev">${CHEV_SVG}</span>`) : items.join("")}</div>
            </div>`;
        }).join("")}${itemOrig === "Online" ? `<div class="st-links">${credit}</div>` : ""}</section>`);
    }
    if (v.skills) {
      const sk = v.skills;
      const letters = ["Q", "W", "E", "R"];
      const grid = letters.map(L => `<span class="sk-k">${L}</span>${Array.from({ length: 15 }, (_, i) => {
          const on = sk.levels[i] === L;
          return `<span class="sk ${on ? "on" : ""} ${on && L === "R" ? "r" : ""}">${on ? i + 1 : ""}</span>`;
        }).join("")}`).join("");
      const prio = sk.priority.length ? `<div class="prio" aria-label="${esc(t("stMaxFirst"))}">${sk.priority.map(L => `<span class="${L === "R" ? "r" : ""}">${L}</span>`).join(`<span class="chev">${CHEV_SVG}</span>`)}<span class="meta" style="font:600 12px var(--font-ui);margin-left:6px">${esc(t("stMaxFirst"))}</span></div>` : "";
      const alts = (v.alt_skills || []).map(a => `<div class="prio" style="margin-top:8px">${a.priority.map(L => `<span>${L}</span>`).join(`<span class="chev">${CHEV_SVG}</span>`)}<span class="meta mono" style="margin-left:6px">${esc(t("stAltSkill"))}${a.rates ? " · " + esc(rateLine(a.rates)) : ""}</span></div>`).join("");
      out.push(`<section class="panel">${blockHead(t("stSkillOrder"), sk.origin)}
          ${sk.rates ? `<div class="meta mono">${esc(rateLine(sk.rates))}</div>` : ""}
          ${prio}
          <div class="skill-grid" aria-hidden="true">${grid}</div>
          ${alts}
          ${sk.origin === "Online" ? `<div class="st-links">${credit}</div>` : ""}
        </section>`);
    }
    if (v.champ_profile) {
      const cp = v.champ_profile;
      const pPct = Math.round(cp.physical * 100);
      const mPct = Math.round(cp.magic * 100);
      const tPct = Math.round(cp.true_damage * 100);
      const traits = (cp.traits || []).map(tr => `<span class="tag">${esc(tr)}</span>`).join("");
      const bench = (cp.gpm != null && cp.vision_per_min != null && v.local_build) ? `<div class="st-tiles" style="margin-top:10px;grid-template-columns:repeat(2,1fr)">
          <div class="tile"><b>${esc(fmtDec(kdaRatio(v.local_build.kills, v.local_build.deaths, v.local_build.assists)))}</b><span>${esc(t("kdaRatio"))}</span></div>
          <div class="tile"><b>${esc(fmtDec(v.local_build.cs_per_min))}</b><span>${esc(t("stCsMin"))}</span></div>
          <div class="tile"><b>${esc(fmtNum(Math.round(cp.gpm)))}</b><span>${esc(t("stGpm"))}</span></div>
          <div class="tile"><b>${esc(fmtDec(cp.vision_per_min))}</b><span>${esc(t("stVsMin"))}</span></div>
        </div>` : "";
      out.push(`<section class="panel">${blockHead(t("stChampProfile"), cp.local_origin)}
          <div class="meta mono" style="margin-bottom:6px">${esc(t("stDmgSplit", pPct, mPct, tPct))}</div>
          <div class="dmg-bar">
            <i class="p" style="width:${pPct}%"></i>
            <i class="m" style="width:${mPct}%"></i>
            <i class="t" style="width:${tPct}%"></i>
          </div>
          ${traits ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${traits}</div>` : ""}
          ${bench}
        </section>`);
    }
    return out.join("");
  }

  function tierLabel(tier) {
    return tier === "SPlus" ? "S+" : tier;
  }

  function tierBody(v) {
    const queues = [["ranked_solo", t("stQueueSolo")], ["aram", "ARAM"], ["arena", t("stQueueArena")]];
    const brackets = [["all", t("stAllRanks")], ["emerald_plus", t("stEmeraldPlus")], ["diamond_plus", t("stDiamondPlus")], ["master_plus", t("stMasterPlus")]];
    const sorts = [["tier", t("stSortTier")], ["win", t("stSortWin")], ["pick", t("stSortPick")], ["ban", t("stSortBan")], ["games", t("stSortGames")]];
    const lanes = ui.tierQueue === "ranked_solo";
    const roleBtn = (k, inner) => `<button class="st-role ${ui.tierRole === k ? "active" : ""}" role="radio" aria-checked="${ui.tierRole === k}" data-action="st-tier-role" data-role="${k}">${inner}</button>`;
    const controls = `<section class="panel" data-key="st-tier-controls">
        <div class="section-head" style="margin-bottom:0">
          <span class="eyebrow">${esc(t("stTabTiers"))}</span>
          <span class="row" style="gap:6px">${v && v.patch ? `<span class="tag">${esc(t("stPatch", v.patch))}</span>` : ""}${v ? originTag(v.block.origin) : ""}</span>
        </div>
        <div class="st-seg" role="radiogroup">${queues.map(([k, l]) => `<button class="${ui.tierQueue === k ? "active" : ""}" role="radio" aria-checked="${ui.tierQueue === k}" data-action="st-queue" data-queue="${k}">${esc(l)}</button>`).join("")}</div>
        ${lanes ? `<div class="st-seg four" style="margin-top:8px" role="radiogroup">${brackets.map(([k, l]) => `<button class="${ui.tierBracket === k ? "active" : ""}" role="radio" aria-checked="${ui.tierBracket === k}" data-action="st-tier-bracket" data-bracket="${k}">${esc(l)}</button>`).join("")}</div>` : ""}
        ${lanes ? `<div class="st-roles six" role="radiogroup" aria-label="${esc(t("roles"))}">
          ${roleBtn("ALL", `<span style="font-size:12px">${esc(t("stAllRoles"))}</span>`)}
          ${ROLE_KEYS.map(k => { const l = laneInfo(k); return roleBtn(k, `${laneSvg(k, 17, l.color)}<span>${esc(l.label)}</span>`); }).join("")}
        </div>` : ""}
        <div class="st-seg" style="margin-top:8px" role="radiogroup">${sorts.map(([k, l]) => `<button class="${ui.tierSort === k ? "active" : ""}" role="radio" aria-checked="${ui.tierSort === k}" data-action="st-tier-sort" data-sort="${k}">${esc(l)}</button>`).join("")}<button class="${ui.tierOffMeta ? "active" : ""}" role="checkbox" aria-checked="${ui.tierOffMeta}" data-action="st-tier-off-meta">${esc(t("stOffMeta"))}</button></div>
        <div class="st-links">${extLink(v && v.dpm_url, t("stOpenDpm"))}${v ? creditLink(v.block) : ""}</div>
      </section>`;
    if (!v) return controls + `<section class="panel">${skeleton()}</section>`;
    if (v.block.state !== "Ready") return controls + `<section class="panel">${blockState(v.block)}</section>`;
    const rows = v.entries.map((e, i) => {
      const lbl = tierLabel(e.tier);
      const delta = e.win_rate_delta != null && Math.abs(e.win_rate_delta) >= 0.0005
        ? `<span style="color:${e.win_rate_delta > 0 ? "var(--green)" : "var(--red)"}">${e.win_rate_delta > 0 ? "+" : "−"}${esc(fmtPct(Math.abs(e.win_rate_delta)))}</span>`
        : "";
      return `
        <button class="st-row" data-key="tr-${e.champion.id}-${e.position || ""}" data-action="st-open" data-id="${e.champion.id}" data-pos="${laneOf(e.position)}" aria-label="${esc(t("stTierAria", lbl, e.champion.name))}">
          <span class="st-rank">${i + 1}</span>
          <span class="tier-badge ${esc(e.tier)}">${esc(lbl)}</span>
          ${champPt(e.champion.id, e.champion.name, 36)}
          <span class="grow">
            <span class="st-nm ellipsis" style="display:block">${esc(e.champion.name)}</span>
            <span class="meta row" style="gap:5px">${e.position ? `<span style="display:inline-flex" title="${esc(laneInfo(laneOf(e.position)).label)}">${laneSvg(laneOf(e.position), 13, laneInfo(laneOf(e.position)).color)}</span>` : ""}<span class="mono ellipsis" style="font-size:11px">${esc(t("stPickBan", fmtPct(e.rates.pick_rate), fmtPct(e.rates.ban_rate)))}</span></span>
          </span>
          <span class="st-fig"><b>${esc(fmtPct(e.rates.win_rate))}</b>${delta || `<span>${esc(t("stWin"))}</span>`}</span>
        </button>`;
    }).join("");
    return controls + `<section class="panel" style="padding-top:8px;padding-bottom:8px">
        ${rows || `<div class="empty-note">${esc(t("stNoTier"))}</div>`}
        ${rows ? `<div class="hl-hint">${esc(t("stTierHint"))}</div>` : ""}
      </section>`;
  }

  function matchupRow(m) {
    const win = Number(m.rates.win_rate);
    const span = Math.min(50, Math.abs(win - 0.5) / 0.1 * 50);
    const gold = m.gold_diff_15 != null
      ? t("stGold15", (m.gold_diff_15 > 0.5 ? "+" : m.gold_diff_15 < -0.5 ? "−" : "±") + fmtNum(Math.abs(Math.round(m.gold_diff_15)))) : "";
    const vText = m.verdict === "Good" ? t("stGoodLane") : m.verdict === "Hard" ? t("stHardLane") : t("stEvenLane");
    const localRec = m.local ? ` · <span style="color:var(--accent)">${esc(t("stYouRecord", t("stRecord", m.local.wins, Math.max(0, m.local.games - m.local.wins))))}</span>` : "";
    return `<button class="st-row" data-key="mu-${m.opponent.id}" data-action="st-open" data-id="${m.opponent.id}" data-pos="" aria-label="${esc(t("stOpenBuild", m.opponent.name))}">
        ${champPt(m.opponent.id, m.opponent.name, 36, "enemy")}
        <span class="grow">
          <span class="row" style="gap:6px"><span class="st-nm ellipsis">${esc(m.opponent.name)}</span><span class="verdict-chip ${esc(m.verdict || "Even")}">${esc(vText)}</span></span>
          <span class="meta ellipsis" style="display:block">${esc(t("stGamesN", fmtNum(m.rates.games)))}${gold ? " · " + esc(gold) : ""}${localRec}</span>
          <span class="mu-bar"><i class="${win >= 0.5 ? "blue" : "red"}" style="width:${span.toFixed(1)}%"></i></span>
        </span>
        <span class="st-fig"><b style="color:${win >= 0.5 ? "var(--blue)" : "var(--red)"}">${esc(fmtPct(win))}</b></span>
      </button>`;
  }
  function matchupsBody(v) {
    if (!v.champion) return pickerPanel(v);
    const out = [pickerPanel(v)];
    if (v.local_matchups && v.local_matchups.length) {
      const lrows = v.local_matchups.map(m => {
        const wr = m.wins / Math.max(1, m.games);
        return `<button class="st-row" data-key="lmu-${m.opponent.id}" data-action="st-open" data-id="${m.opponent.id}" data-pos="">
            ${champPt(m.opponent.id, m.opponent.name, 34, "enemy")}
            <span class="grow"><span class="st-nm ellipsis" style="display:block">${esc(m.opponent.name)}</span><span class="meta mono">${esc(t("stRecord", m.wins, Math.max(0, m.games - m.wins)))} · ${esc(fmtDec(m.kda))} KDA</span></span>
            <span class="st-fig"><b style="color:${wr >= 0.5 ? "var(--blue)" : "var(--red)"}">${esc(fmtPct(wr))}</b></span>
          </button>`;
      }).join("");
      out.push(`<section class="panel">${blockHead(t("stYourMatchups"), v.local_origin || "Local")}${lrows}</section>`);
    }
    if (v.block.state !== "Ready") {
      out.push(`<section class="panel">${blockHead(t("stTabMatchups"), null)}${blockState(v.block)}</section>`);
      return out.join("");
    }
    if (v.total_entries > 16 || ui.muAll) {
      out.push(`<div class="st-seg one" style="margin:0 0 8px"><button class="${ui.muAll ? "active" : ""}" data-action="st-mu-all">${esc(ui.muAll ? t("stTop8") : t("stShowAll"))}</button></div>`);
    }
    const col = (title, sub, list) => `<section class="panel">
        ${blockHead(title, v.block.origin)}
        <div class="meta" style="margin:-6px 0 4px">${esc(sub)}</div>
        ${list.length ? list.map(matchupRow).join("") : `<div class="empty-note">${esc(t("stNoneSample"))}</div>`}
      </section>`;
    out.push(col(t("stHardest"), t("stHardestFor", v.champion.name), v.hardest));
    out.push(col(t("stEasiest"), t("stEasiestFor", v.champion.name), v.easiest));
    const credit = creditLink(v.block);
    if (credit) out.push(`<div class="st-links" style="padding:0 4px">${credit}</div>`);
    return out.join("");
  }

  function dayLabel(ms) {
    if (!(ms > 0)) return "";
    return new Date(ms).toLocaleDateString(activeLang() === "fr" ? "fr-FR" : "en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  }
  function myStatsBody(v) {
    const head = `<section class="panel">
        ${blockHead(t("stLastGames"), v.block.origin)}
        <div class="meta">${esc(t("stHistoryNote"))}</div>
        ${blockState(v.block)}
      </section>`;
    if (v.block.state !== "Ready") return head;
    const rankCard = v.rank ? `<div class="rank-card">
        <div><b>${esc(v.rank.tier)}${v.rank.division ? " " + esc(v.rank.division) : ""}</b><div class="meta mono">${esc(v.rank.lp)} LP</div></div>
        <div style="text-align:right"><div class="mono" style="font-weight:700">${esc(fmtPct(v.rank.wins / Math.max(1, v.rank.wins + v.rank.losses)))}</div><div class="meta mono">${esc(t("stRecord", v.rank.wins, v.rank.losses))}</div></div>
      </div>` : "";
    const games = v.games;
    // Totals cover the summarised games (Summoner's Rift when there are any); ARAM, event
    // modes and remakes stay in the list below.
    const counted = games.filter(g => g.summarised);
    const wins = counted.filter(g => g.win).length;
    const sum = (f) => counted.reduce((n, g) => n + Number(f(g) || 0), 0);
    const minutes = Math.max(1, sum(g => g.duration_secs) / 60);
    const tile = (val, label) => `<div class="tile"><b>${esc(val)}</b><span>${esc(label)}</span></div>`;
    const totals = counted.length ? `<div class="st-tiles">
        <div class="tile wide"><b>${esc(fmtPct(wins / Math.max(1, counted.length)))}</b><span>${esc(t("stWinRate"))} · ${esc(t("stRecord", wins, counted.length - wins))}</span></div>
        ${tile(fmtDec(kdaRatio(sum(g => g.kills), sum(g => g.deaths), sum(g => g.assists))), t("kdaRatio"))}
        ${tile(fmtDec(sum(g => g.cs) / minutes), t("csMin"))}
        ${tile(fmtNum(Math.round(sum(g => g.damage_to_champions) / minutes)), t("stDpm"))}
      </div>` : "";
    const roles = (v.roles && v.roles.length) ? `<section class="panel">
        ${blockHead(t("stByRole"), v.block.origin)}
        <div class="role-grid">${v.roles.map(r => {
          const rk = laneOf(r.position);
          const l = laneInfo(rk);
          const wr = r.wins / Math.max(1, r.games);
          const on = ui.myRole === rk;
          return `<button class="role-card ${on ? "active" : ""}" data-action="st-my-role" data-role="${on ? "ALL" : rk}">
              ${laneSvg(rk, 20, l.color)}
              <span class="grow">
                <span class="row" style="justify-content:space-between"><b style="font-size:13px">${esc(l.label)}</b><span class="mono" style="font-size:12px;color:${wr >= 0.5 ? "var(--blue)" : "var(--red)"}">${esc(fmtPct(wr))}</span></span>
                <span class="meta mono">${esc(t("stGamesN", r.games))} · ${esc(fmtDec(r.kda))} KDA</span>
              </span>
            </button>`;
        }).join("")}</div>
      </section>` : "";
    const champs = v.champions.length ? `<section class="panel" style="padding-bottom:8px">
        ${blockHead(t("stByChampion"), v.block.origin)}
        ${v.champions.map(c => `
          <button class="st-row" data-key="mc-${c.champion.id}" data-action="st-open" data-id="${c.champion.id}" data-pos="" aria-label="${esc(t("stOpenBuild", c.champion.name))}">
            ${champPt(c.champion.id, c.champion.name, 40)}
            <span class="grow">
              <span class="st-nm ellipsis" style="display:block">${esc(c.champion.name)}</span>
              <span class="meta mono ellipsis" style="display:block">${esc(t("stRecord", c.wins, c.games - c.wins))} · ${esc(fmtDec(kdaRatio(c.kills, c.deaths, c.assists)))} ${esc(t("kdaRatio"))} · ${esc(fmtDec(c.cs_per_min))} CS</span>
              <span class="kit">${c.keystone ? pt("perk", c.keystone.id, esc(initials(c.keystone.name)), 22, "round") : ""}${c.items.map(n => itemPt(n, 22)).join("")}</span>
            </span>
            <span class="st-fig"><b>${esc(fmtPct(c.wins / Math.max(1, c.games)))}</b><span>${esc(t("stGamesN", c.games))}</span></span>
          </button>`).join("")}
      </section>` : "";

    const qFilters = [["all", t("stAllQueues")], ["ranked_solo", t("stQueueSolo")], ["ranked_flex", t("stQueueFlex")], ["aram", "ARAM"], ["arena", t("stQueueArena")]];
    const roleBtn = (k, inner) => `<button class="st-role ${ui.myRole === k ? "active" : ""}" role="radio" aria-checked="${ui.myRole === k}" data-action="st-my-role" data-role="${k}">${inner}</button>`;
    const filters = `<div class="st-seg wrap" style="margin-bottom:8px" role="radiogroup">${qFilters.map(([k, l]) => `<button class="${ui.myQueue === k ? "active" : ""}" data-action="st-my-queue" data-queue="${k}">${esc(l)}</button>`).join("")}</div>
      <div class="st-roles six" style="margin-bottom:8px" role="radiogroup" aria-label="${esc(t("roles"))}">
        ${roleBtn("ALL", `<span style="font-size:12px">${esc(t("stAllRoles"))}</span>`)}
        ${ROLE_KEYS.map(k => { const l = laneInfo(k); return roleBtn(k, `${laneSvg(k, 17, l.color)}<span>${esc(l.label)}</span>`); }).join("")}
      </div>`;

    // Group visible games by UTC calendar day for session headers.
    const dayOf = ms => ms > 0 ? Math.floor(ms / 86400000) : 0;
    const sessionMeta = new Map();
    for (const g of games) {
      const dk = dayOf(g.started_at_ms);
      if (!sessionMeta.has(dk)) sessionMeta.set(dk, { w: 0, l: 0, sSum: 0, sCnt: 0 });
      const m = sessionMeta.get(dk);
      if (!g.remake) { if (g.win) m.w++; else m.l++; }
      if (g.performance_score != null) { m.sSum += g.performance_score; m.sCnt++; }
    }
    let lastDay = null;
    const badgeHtml = (b) => {
      if (!b) return "";
      if (b === "Mvp") return `<span class="mbadge mvp">MVP</span>`;
      if (b === "Ace") return `<span class="mbadge ace">ACE</span>`;
      if (typeof b === "object" && b.Multikill) return `<span class="mbadge">${b.Multikill}K</span>`;
      return "";
    };
    const gameRows = games.map((g, i) => {
      const dk = dayOf(g.started_at_ms);
      let sess = "";
      if (dk !== lastDay) {
        lastDay = dk;
        const m = sessionMeta.get(dk);
        const avg = m.sCnt > 0 ? ` · ${t("stAvgScore")} ${Math.round(m.sSum / m.sCnt)}` : "";
        sess = `<div class="sess-head"><b>${esc(dayLabel(g.started_at_ms))}</b><span>${esc(t("stRecord", m.w, m.l))}${esc(avg)}</span></div>`;
      }
      const mins = Math.max(1, g.duration_secs / 60);
      const pos = laneOf(g.position);
      const resCls = g.remake ? "rmk" : (g.win ? "win" : "loss");
      const resTxt = g.remake ? t("stRmkShort") : (g.win ? t("stWinShort") : t("stLossShort"));
      const scCls = g.performance_score >= 80 ? "hi" : g.performance_score >= 65 ? "mid" : "";
      const kp = g.kill_participation != null ? ` · ${Math.round(g.kill_participation * 100)}% KP` : "";
      const vs = `${fmtDec((g.vision_score || 0) / mins)} VS/m`;
      const kit = `<span class="kit">${g.keystone ? pt("perk", g.keystone.id, esc(initials(g.keystone.name)), 18, "round") : ""}${(g.spells || []).map(s => pt("spell", s.id, spellFallbackGlyph(s.id, spellName(s.id, s.name)), 18)).join("")}${(g.items || []).map(n => itemPt(n, 18)).join("")}</span>`;
      return `${sess}<button class="st-row" style="${g.summarised ? "" : "opacity:0.78"}" data-key="mg-${i}" data-action="st-open" data-id="${g.champion.id}" data-pos="${pos}" aria-label="${esc(t("stOpenBuild", g.champion.name))}">
          ${champPt(g.champion.id, g.champion.name, 38)}
          <span class="grow">
            <span class="row" style="gap:6px"><span class="res ${resCls}">${esc(resTxt)}</span><span class="st-nm ellipsis">${esc(g.champion.name)}</span>${g.opponent ? `<span class="meta mono">VS</span>${champPt(g.opponent.id, g.opponent.name, 18, "enemy")}` : ""}</span>
            <span class="meta ellipsis" style="display:block;margin-top:2px">${pos ? esc(laneInfo(pos).label) + " · " : ""}${g.queue ? esc(tk("q_", g.queue)) + " · " : ""}${esc(fmtSec(g.duration_secs))}${g.summarised ? "" : " · " + esc(t("stNotInTotals"))}</span>
            ${kit}
          </span>
          <span class="st-fig">
            <b>${g.kills}/${g.deaths}/${g.assists}</b>
            <span>${esc(fmtDec(g.cs / mins))} CS · ${esc(vs)}${esc(kp)}</span>
            ${(g.performance_score != null || g.badge) ? `<span class="sc-pill" style="margin-top:3px">${badgeHtml(g.badge)}${g.performance_score != null ? `<span class="sc-num ${scCls}">${g.performance_score}</span>` : ""}</span>` : ""}
          </span>
        </button>`;
    }).join("");

    const recent = `<section class="panel" style="padding-bottom:8px">
        ${blockHead(t("stRecent"), v.block.origin)}
        ${filters}
        ${gameRows || `<div class="empty-note">${esc(t("stNoGames"))}</div>`}
      </section>`;
    return head + (rankCard ? `<section class="panel">${rankCard}${totals}</section>` : totals) + roles + champs + recent;
  }

  function renderStats() {
    renderDock(tabsHtml([
      { id: "build", label: t("stTabBuild") },
      { id: "tiers", label: t("stTabTiers") },
      { id: "matchups", label: t("stTabMatchups") },
      { id: "mine", label: t("stTabMine") }
    ], ui.statsTab, "st-tab"));
    loadStats(false);
    const backBar = `<section class="panel stats-back" data-key="st-back">
        <span class="eyebrow">${esc(t("modeStats"))}</span>
        <button class="btn btn-ghost btn-sm" data-action="mode" data-mode="match">${esc(t("backToMatch"))}</button>
      </section>`;
    const tab = ui.statsTab;
    const entry = ui.statsData[tab];
    // A view for another champion, role or language is not shown while the right one loads.
    const v = entry && entry.key === statsKey(tab) ? entry.json : null;
    if (tab === "tiers") return backBar + tierBody(v);
    if (!v) {
      const failed = ui.statsErr && !ui.statsPending;
      const picker = tab === "build" || tab === "matchups" ? pickerPanel(entry && entry.json) : "";
      return backBar + picker + `<section class="panel">${failed ? `<div class="st-state">${INFO_SVG}<span>${esc(t("stFailed"))}</span></div>` : skeleton()}</section>`;
    }
    if (tab === "build") return backBar + buildBody(v);
    if (tab === "matchups") return backBar + matchupsBody(v);
    return backBar + myStatsBody(v);
  }
  /** Behind the Stats tab: the chosen champion's splash on Build and Matchups, else the valley. */
  function statsScene() {
    const champ = (ui.statsTab === "build" || ui.statsTab === "matchups") ? ui.statsChamp : 0;
    return champ > 0 ? { cat: "splash", id: champ * 1000, mode: "" } : { cat: "art", id: ART.backdrop, mode: "ambient" };
  }
  function openStatsChampion(id, pos, tab) {
    ui.statsChamp = id;
    ui.statsPos = pos || "";
    ui.statsSearch = "";
    if (tab) { ui.statsTab = tab; store.set("hypatia_stats_tab", tab); }
    const field = $("stats-search");
    if (field && document.activeElement === field) field.blur();
    renderState(ui.state);
    window.scrollTo(0, 0);
  }

  // ---- Render loop ----------------------------------------------------------------------------
  function clockSignature(s) {
    if (!s) return "";
    if (s.phase === "ChampSelect" && s.champ_select) {
      const cs = s.champ_select;
      const act = cs.active_action;
      return `cs:${cs.sub_phase}:${act ? `${act.action_id}:${act.action_type}:${act.is_my_turn}` : ""}:${cs.time_left_sec}:${cs.total_time_sec}`;
    }
    if (s.phase === "ReadyCheck" && s.matchmaking) {
      return `rc:${s.matchmaking.ready_check_timer_sec}`;
    }
    if (s.phase === "Matchmaking" && s.matchmaking) {
      return `mm:${s.matchmaking.time_in_queue_sec}`;
    }
    if (s.phase === "InProgress" && s.live_game) {
      return `lg:${s.live_game.clock}`;
    }
    return s.phase || "";
  }

  function renderState(s) {
    if (!s) return;
    if (s.lang === "fr" || s.lang === "en") {
      if (ui.lastServerLang && ui.lastServerLang !== s.lang) {
        ui.langOverride = "";
        store.del("hypatia_lang_override");
      }
      ui.serverLang = s.lang;
      ui.lastServerLang = s.lang;
      store.set("hypatia_last_server_lang", s.lang);
    }
    if (s !== ui.state) {
      const nextClockSig = clockSignature(s);
      if (nextClockSig !== ui.clockSig) {
        ui.clockSig = nextClockSig;
        ui.stateAt = performance.now();
      }
      ui.state = s;
    }
    const turnNow = s.phase === "ReadyCheck"
      || Boolean(s.champ_select && s.champ_select.active_action
        && s.champ_select.active_action.is_my_turn && !s.champ_select.active_action.completed);
    if (turnNow && !ui.wasTurn) {
      ui.turnFlashUntil = Date.now() + 1400;
      // A ready check or the player's draft turn closes secondary views and focuses Pick.
      if (ui.mode === "stats") { ui.mode = "match"; store.set("hypatia_mode", "match"); }
      ui.guideOpen = false;
      if (s.phase === "ChampSelect") ui.csTab = "pick";
    }
    ui.wasTurn = turnNow;

    if (s.phase === "ChampSelect" && s.champ_select) {
      const cs = s.champ_select;
      const act = cs.active_action;
      const isMyBan = Boolean(act && act.is_my_turn && !act.completed && act.action_type === "ban");
      const draftKey = `${cs.local_cell_id}:${cs.assigned_position}:${isMyBan ? "ban" : "pick"}:${cs.is_roleless ? 1 : 0}`;
      if (draftKey !== ui.lastDraftKey) {
        ui.lastDraftKey = draftKey;
        if (cs.is_roleless || isMyBan) {
          ui.champRole = "ALL";
        } else {
          const rk = laneInfo(cs.assigned_position).key;
          ui.champRole = ROLE_KEYS.includes(rk) ? rk : "ALL";
        }
      }
      const me = (cs.my_team || []).find(a => a.is_self);
      const pickLocked = Boolean(me && me.pick_locked);
      if (pickLocked && !ui.wasPickLocked && !turnNow) {
        ui.csTab = "prep";
      }
      ui.wasPickLocked = pickLocked;
    } else {
      ui.guideOpen = false;
      ui.lastDraftKey = "";
      ui.wasPickLocked = false;
      ui.builderDirty = false;
      ui.activePageSig = "";
    }
    if (s.phase !== "Lobby") {
      ui.lobbySynced = false;
      ui.lobbyQueueOpen = false;
    }

    if (s.stats_revision !== ui.statsRev) {
      const landed = ui.statsRev !== null;
      ui.statsRev = s.stats_revision;
      if (landed && ui.mode === "stats") loadStats(true);
    }
    applyStaticChrome();
    fireAlertIfNew(s);
    updatePhaseRail(s.phase);

    $("summoner-line").textContent = (s.summoner_name || "Hypatia") + " · " + phaseLabel(s.phase);
    const avatarKey = `${s.profile_icon_id || 0}:${s.summoner_name || ""}`;
    if (ui.lastAvatarKey !== avatarKey) {
      ui.lastAvatarKey = avatarKey;
      $("summoner-avatar").innerHTML = pt("profile", s.profile_icon_id || 0, esc(initials(s.summoner_name || "HY")), 34, "round");
    }

    const demoBtn = $("demo-toggle-btn");
    const strip = $("demo-strip");
    demoBtn.hidden = !s.is_demo;
    strip.hidden = !(s.is_demo && ui.demoOpen);
    const demoPhase = (s.phase === "PreEndOfGame" || s.phase === "WaitingForStats") ? "EndOfGame" : s.phase;
    strip.querySelectorAll("[data-phase]").forEach(b => b.classList.toggle("active", b.dataset.phase === demoPhase));

    let html;
    const post = s.phase === "EndOfGame" || s.phase === "PreEndOfGame" || s.phase === "WaitingForStats";
    if (ui.mode === "stats") html = renderStats();
    else if (s.phase === "Lobby") html = renderLobby(s);
    else if (s.phase === "Matchmaking") html = renderQueue(s);
    else if (s.phase === "ReadyCheck") html = renderReady(s);
    else if (s.phase === "ChampSelect") html = renderChampSelect(s);
    else if (s.phase === "InProgress") html = renderLive(s);
    else if (post) html = renderEnd(s);
    else html = renderIdle(s);

    const root = $("view-root");
    const viewKey = ui.mode === "stats" ? "Stats|" + ui.statsTab
      : s.phase + "|" + (s.phase === "ChampSelect" ? ui.csTab : s.phase === "InProgress" ? ui.liveTab : "");
    if (viewKey !== ui.viewKey) {
      const phaseChanged = ui.viewKey.split("|")[0] !== viewKey.split("|")[0];
      ui.viewKey = viewKey;
      root.innerHTML = html;
      if (phaseChanged) {
        root.classList.remove("enter");
        void root.offsetWidth;
        root.classList.add("enter");
      }
    } else {
      morphInto(root, html);
    }
    renderGuideSheet(s);
    setScene(ui.mode === "stats" ? statsScene() : sceneFor(s));
    tickClocks();
    centerSelectedSkin();
  }

  /** Brings the equipped skin to the middle of the carousel when the tab opens or the champion changes. */
  function centerSelectedSkin() {
    const car = $("skin-carousel");
    if (!car) { ui.skinScrollKey = ""; return; }
    const key = car.dataset.key;
    if (key === ui.skinScrollKey) return;
    ui.skinScrollKey = key;
    const sel = car.querySelector(".skin.sel");
    if (sel) car.scrollLeft = sel.offsetLeft - car.offsetLeft - (car.clientWidth - sel.clientWidth) / 2;
  }

  // ---- Chrome events --------------------------------------------------------------------------
  const menu = $("menu");
  const menuBtn = $("menu-btn");
  function setMenu(open) {
    menu.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
  }
  menuBtn.addEventListener("click", (ev) => { ev.stopPropagation(); setMenu(!menu.classList.contains("open")); });
  document.addEventListener("click", (ev) => { if (!menu.contains(ev.target) && ev.target !== menuBtn) setMenu(false); });

  $("stats-top-btn").addEventListener("click", () => {
    ui.mode = ui.mode === "stats" ? "match" : "stats";
    ui.guideOpen = false;
    store.set("hypatia_mode", ui.mode);
    if (ui.state) renderState(ui.state);
    window.scrollTo(0, 0);
  });
  $("guide-sheet").addEventListener("click", (ev) => {
    if (ev.target === $("guide-sheet")) {
      ui.guideOpen = false;
      if (ui.state) renderState(ui.state);
    }
  });
  $("alert-top-btn").addEventListener("click", () => toggleAlerts());
  $("alerts-menu-btn").addEventListener("click", () => { setMenu(false); toggleAlerts(); });
  $("arm-alerts-btn").addEventListener("click", () => armAlerts(false));
  $("dismiss-alerts-btn").addEventListener("click", () => {
    ui.alertDismissed = true;
    store.set("hypatia_alert_dismissed", "1");
    updateAlertChrome();
  });
  $("refresh-btn").addEventListener("click", () => { setMenu(false); fetchState(); });
  $("theme-btn").addEventListener("click", () => {
    applyTheme(ui.theme === "dark" ? "light" : "dark");
    applyStaticChrome();
  });
  $("lang-btn").addEventListener("click", () => {
    const next = activeLang() === "fr" ? "en" : "fr";
    if (next === ui.serverLang) {
      ui.langOverride = "";
      store.del("hypatia_lang_override");
    } else {
      ui.langOverride = next;
      store.set("hypatia_lang_override", next);
    }
    applyStaticChrome();
    if (ui.state) renderState(ui.state);
    showToast(t("langSwitched"));
  });
  $("demo-toggle-btn").addEventListener("click", () => {
    ui.demoOpen = !ui.demoOpen;
    store.set("hypatia_demo_open", ui.demoOpen ? "1" : "0");
    if (ui.state) renderState(ui.state);
  });

  document.body.addEventListener("input", (ev) => {
    if (ev.target.id === "champ-search") {
      ui.champQuery = ev.target.value;
      if (ui.state) renderState(ui.state);
    } else if (ev.target.id === "swift-search") {
      ui.swiftQuery = ev.target.value;
      if (ui.state) renderState(ui.state);
    } else if (ev.target.id === "stats-search") {
      ui.statsSearch = ev.target.value;
      loadRoster();
      if (ui.state) renderState(ui.state);
    } else if (ev.target.id === "custom-rune-name") {
      ui.customName = ev.target.value;
      ui.customNameEdited = true;
    }
  });

  document.body.addEventListener("keydown", (ev) => {
    if (ev.target.id !== "stats-search" || ev.key !== "Enter") return;
    const first = searchRoster(ui.statsSearch)[0];
    if (first) openStatsChampion(first.id, "", null);
  });

  // ---- Actions --------------------------------------------------------------------------------
  // Every write is a RemoteCommand sent after an explicit tap; UI-only taps just re-render.
  document.body.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-action]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.action;
    const cs = ui.state && ui.state.champ_select;

    if (act === "mode") {
      ui.mode = btn.dataset.mode === "stats" ? "stats" : "match";
      ui.guideOpen = false;
      store.set("hypatia_mode", ui.mode);
      renderState(ui.state);
      window.scrollTo(0, 0);
    } else if (act === "st-tab") {
      ui.statsTab = btn.dataset.tab;
      store.set("hypatia_stats_tab", ui.statsTab);
      renderState(ui.state);
      window.scrollTo(0, 0);
    } else if (act === "st-champ") {
      openStatsChampion(Number(btn.dataset.id), "", null);
    } else if (act === "st-open") {
      openStatsChampion(Number(btn.dataset.id), btn.dataset.pos, "build");
    } else if (act === "st-role") {
      ui.statsPos = btn.dataset.role;
      renderState(ui.state);
    } else if (act === "st-build-queue") {
      ui.buildQueue = btn.dataset.queue;
      renderState(ui.state);
    } else if (act === "st-build-bracket") {
      ui.buildBracket = btn.dataset.bracket;
      renderState(ui.state);
    } else if (act === "st-item-view") {
      ui.itemView = btn.dataset.view;
      renderState(ui.state);
    } else if (act === "st-queue") {
      ui.tierQueue = btn.dataset.queue;
      renderState(ui.state);
    } else if (act === "st-tier-bracket") {
      ui.tierBracket = btn.dataset.bracket;
      renderState(ui.state);
    } else if (act === "st-tier-role") {
      ui.tierRole = btn.dataset.role;
      renderState(ui.state);
    } else if (act === "st-tier-sort") {
      const col = btn.dataset.sort;
      if (ui.tierSort === col) {
        ui.tierDir = ui.tierDir === "desc" ? "asc" : "desc";
      } else {
        ui.tierSort = col;
        ui.tierDir = col === "tier" ? "asc" : "desc";
      }
      renderState(ui.state);
    } else if (act === "st-tier-off-meta") {
      ui.tierOffMeta = !ui.tierOffMeta;
      renderState(ui.state);
    } else if (act === "st-mu-all") {
      ui.muAll = !ui.muAll;
      renderState(ui.state);
    } else if (act === "st-my-queue") {
      ui.myQueue = btn.dataset.queue;
      renderState(ui.state);
    } else if (act === "st-my-role") {
      ui.myRole = btn.dataset.role;
      renderState(ui.state);
    } else if (act === "demo-phase") {
      sendCmd({ cmd: "demo_set_phase", phase: btn.dataset.phase });
    } else if (act === "demo-swap") {
      sendCmd({ cmd: "demo_simulate_incoming_swap" });
    } else if (act === "create-lobby") {
      ui.lobbyQueueOpen = false;
      sendCmd({ cmd: "create_lobby", queue_id: Number(btn.dataset.queue) });
    } else if (act === "play-again") {
      sendCmd({ cmd: "play_again" });
    } else if (act === "toggle-lobby-queues") {
      ui.lobbyQueueOpen = !ui.lobbyQueueOpen;
      renderState(ui.state);
    } else if (act === "swift-focus") {
      ui.swiftSlot = Number(btn.dataset.idx) || 0;
      ui.swiftSpellOpen = false;
      renderState(ui.state);
    } else if (act === "swift-toggle-champs") {
      ui.swiftChampOpen = !ui.swiftChampOpen;
      renderState(ui.state);
    } else if (act === "swift-champ") {
      const sl = ui.swiftSlots[ui.swiftSlot];
      if (sl) {
        const cid = Number(btn.dataset.id);
        sl.champion_id = cid;
        sl.champion_name = btn.dataset.name || "";
        sl.skin_id = cid * 1000;
        ui.swiftChampOpen = false;
        ui.swiftQuery = "";
        renderState(ui.state);
      }
    } else if (act === "swift-lane") {
      const sl = ui.swiftSlots[ui.swiftSlot];
      if (sl) { sl.position = btn.dataset.lane; renderState(ui.state); }
    } else if (act === "swift-spell-slot") {
      const slot = Number(btn.dataset.slot);
      if (ui.swiftSpellOpen && ui.swiftSpellSlot === slot) ui.swiftSpellOpen = false;
      else { ui.swiftSpellSlot = slot; ui.swiftSpellOpen = true; }
      renderState(ui.state);
    } else if (act === "swift-swap-spells") {
      const sl = ui.swiftSlots[ui.swiftSlot];
      if (sl) {
        const tmp = sl.spell1_id;
        sl.spell1_id = sl.spell2_id;
        sl.spell2_id = tmp;
        renderState(ui.state);
      }
    } else if (act === "swift-pick-spell") {
      const sl = ui.swiftSlots[ui.swiftSlot];
      if (sl) {
        const picked = Number(btn.dataset.id);
        if (ui.swiftSpellSlot === 1) {
          if (picked === sl.spell2_id) sl.spell2_id = sl.spell1_id;
          sl.spell1_id = picked;
        } else {
          if (picked === sl.spell1_id) sl.spell1_id = sl.spell2_id;
          sl.spell2_id = picked;
        }
        ui.swiftSpellOpen = false;
        renderState(ui.state);
      }
    } else if (act === "swift-rune") {
      const sl = ui.swiftSlots[ui.swiftSlot];
      if (sl) { sl.perk_page_id = Number(btn.dataset.id); renderState(ui.state); }
    } else if (act === "swift-skin") {
      const sl = ui.swiftSlots[ui.swiftSlot];
      if (sl) { sl.skin_id = Number(btn.dataset.id); renderState(ui.state); }
    } else if (act === "save-swift-slots") {
      sendCmd({ cmd: "set_swiftplay_slots", slots: ui.swiftSlots });
    } else if (act === "focus-slot") {
      ui.selectingFirstRole = btn.dataset.slot === "1";
      renderState(ui.state);
    } else if (act === "pick-lane") {
      const k = btn.dataset.lane;
      if (ui.selectingFirstRole) {
        if (k === ui.lobbySecond && k !== "FILL") ui.lobbySecond = ui.lobbyFirst;
        ui.lobbyFirst = k;
        ui.selectingFirstRole = k === "FILL";
      } else {
        if (k === ui.lobbyFirst && k !== "FILL") ui.lobbyFirst = ui.lobbySecond;
        ui.lobbySecond = k;
      }
      renderState(ui.state);
    } else if (act === "save-roles") {
      sendCmd({ cmd: "set_lobby_positions", first: ui.lobbyFirst, second: ui.lobbyFirst === "FILL" ? "FILL" : ui.lobbySecond });
    } else if (act === "start-queue") {
      sendCmd({ cmd: "start_matchmaking" });
    } else if (act === "stop-queue") {
      sendCmd({ cmd: "stop_matchmaking" });
    } else if (act === "accept-ready") {
      sendCmd({ cmd: "accept_ready_check" });
    } else if (act === "decline-ready") {
      sendCmd({ cmd: "decline_ready_check" });
    } else if (act === "toggle-draft") {
      ui.draftExpanded = !ui.draftExpanded;
      renderState(ui.state);
    } else if (act === "toggle-guide") {
      ui.guideOpen = !ui.guideOpen;
      renderState(ui.state);
    } else if (act === "close-guide") {
      ui.guideOpen = false;
      renderState(ui.state);
    } else if (act === "toggle-fav") {
      const cid = Number(btn.dataset.id);
      if (cid > 0) {
        const idx = ui.favChamps.indexOf(cid);
        if (idx >= 0) ui.favChamps.splice(idx, 1);
        else ui.favChamps.unshift(cid);
        store.set("hypatia_fav_champs", JSON.stringify(ui.favChamps));
        renderState(ui.state);
      }
    } else if (act === "clear-champ-search") {
      ui.champQuery = "";
      renderState(ui.state);
      const inp = $("champ-search");
      if (inp) inp.focus();
    } else if (act === "cs-tab") {
      ui.csTab = btn.dataset.tab;
      ui.draftExpanded = false;
      renderState(ui.state);
      window.scrollTo(0, 0);
    } else if (act === "live-tab") {
      ui.liveTab = btn.dataset.tab;
      renderState(ui.state);
    } else if (act === "eog-tab") {
      ui.eogTab = btn.dataset.tab;
      renderState(ui.state);
    } else if (act === "champ-role") {
      ui.champRole = btn.dataset.role;
      renderState(ui.state);
    } else if (act === "hover-champ") {
      const target = hoverTarget(cs);
      const cid = Number(btn.dataset.id);
      if (btn.dataset.closeGuide === "1") ui.guideOpen = false;
      if (cs && target && cid > 0) {
        const actObj = cs.active_action;
        const isMyBan = Boolean(actObj && actObj.is_my_turn && !actObj.completed && actObj.action_type === "ban");
        if (isMyBan && (cs.my_team || []).some(a => !a.is_self && a.champion_id === cid)) {
          const nm = btn.dataset.name || ((cs.champions || []).find(c => c.id === cid) || {}).name || "";
          if (nm) showToast(t("allyHoverWarn", nm));
        }
        sendCmd({ cmd: "hover_champion", action_id: target.action_id, champion_id: cid });
      }
    } else if (act === "lock-action") {
      sendCmd({ cmd: "lock_action", action_id: Number(btn.dataset.actionId) });
    } else if (act === "reroll-champ") {
      sendCmd({ cmd: "reroll_champion" });
    } else if (act === "bench-swap") {
      sendCmd({ cmd: "swap_bench_champion", champion_id: Number(btn.dataset.id) });
    } else if (act === "set-skin") {
      sendCmd({ cmd: "set_skin", skin_id: Number(btn.dataset.id) });
    } else if (act === "set-ward-skin") {
      sendCmd({ cmd: "set_ward_skin", ward_skin_id: Number(btn.dataset.id) });
    } else if (act === "equip-smite") {
      if (cs) {
        const s1 = cs.spell1_id === 4 ? 4 : 11;
        const s2 = cs.spell1_id === 4 ? 11 : (cs.spell1_id === 11 ? cs.spell2_id : cs.spell1_id);
        sendCmd({ cmd: "set_summoner_spells", spell1_id: s1, spell2_id: s2 === s1 ? 4 : s2 });
      }
    } else if (act === "focus-spell-slot") {
      const slot = Number(btn.dataset.slot);
      if (ui.spellPickerOpen && ui.spellSlot === slot) {
        ui.spellPickerOpen = false;
      } else {
        ui.spellSlot = slot;
        ui.spellPickerOpen = true;
      }
      renderState(ui.state);
    } else if (act === "swap-spells") {
      if (cs) sendCmd({ cmd: "set_summoner_spells", spell1_id: cs.spell2_id, spell2_id: cs.spell1_id });
    } else if (act === "pick-spell") {
      if (!cs) return;
      const picked = Number(btn.dataset.id);
      let s1 = cs.spell1_id;
      let s2 = cs.spell2_id;
      if (ui.spellSlot === 1) {
        if (picked === s2) s2 = s1;
        s1 = picked;
      } else {
        if (picked === s1) s1 = s2;
        s2 = picked;
      }
      ui.spellPickerOpen = false;
      sendCmd({ cmd: "set_summoner_spells", spell1_id: s1, spell2_id: s2 });
    } else if (act === "apply-guide-spells") {
      const s1 = Number(btn.dataset.s1);
      const s2 = Number(btn.dataset.s2);
      if (s1 > 0 && s2 > 0 && s1 !== s2) {
        sendCmd({ cmd: "set_summoner_spells", spell1_id: s1, spell2_id: s2 });
      }
    } else if (act === "rune-sub") {
      ui.runeSubView = btn.dataset.mode;
      renderState(ui.state);
    } else if (act === "select-rune-page") {
      if (btn.dataset.isPreset === "1") {
        sendCmd({
          cmd: "save_rune_page",
          name: btn.dataset.name,
          primary_style_id: Number(btn.dataset.pri),
          sub_style_id: Number(btn.dataset.sub),
          selected_perk_ids: btn.dataset.perks.split(",").filter(Boolean).map(Number)
        });
      } else {
        sendCmd({ cmd: "select_rune_page", page_id: Number(btn.dataset.id) });
      }
    } else if (act === "apply-rec-both") {
      const s1 = Number(btn.dataset.s1);
      const s2 = Number(btn.dataset.s2);
      const perks = btn.dataset.perks.split(",").filter(Boolean).map(Number);
      (async () => {
        await sendCmd({
          cmd: "save_rune_page",
          name: btn.dataset.name,
          primary_style_id: Number(btn.dataset.pri),
          sub_style_id: Number(btn.dataset.sub),
          selected_perk_ids: perks
        });
        if (s1 > 0 && s2 > 0 && s1 !== s2) {
          await sendCmd({ cmd: "set_summoner_spells", spell1_id: s1, spell2_id: s2 });
        }
      })();
    } else if (act === "edit-rune-page") {
      const perks = (btn.dataset.perks || "").split(",").filter(Boolean).map(Number);
      loadPerksIntoBuilder(cs, Number(btn.dataset.pri), Number(btn.dataset.sub), perks, btn.dataset.name);
      ui.builderDirty = true;
      ui.runeSubView = "custom";
      renderState(ui.state);
    } else if (act === "rune-pri") {
      ui.customPrimary = Number(btn.dataset.id);
      ui.builderDirty = true;
      syncCustomRunesDefaults(cs);
      renderState(ui.state);
    } else if (act === "rune-p") {
      ui.customPerks[Number(btn.dataset.slot)] = Number(btn.dataset.id);
      ui.builderDirty = true;
      renderState(ui.state);
    } else if (act === "rune-sub-tree") {
      ui.customSub = Number(btn.dataset.id);
      ui.customSubMeta = [];
      ui.builderDirty = true;
      syncCustomRunesDefaults(cs);
      renderState(ui.state);
    } else if (act === "rune-sub-perk") {
      const row = btn.dataset.row;
      const id = Number(btn.dataset.id);
      const sameRow = ui.customSubMeta.findIndex(m => m.row === row);
      if (sameRow >= 0) ui.customSubMeta[sameRow] = { row, id };
      else ui.customSubMeta = [ui.customSubMeta[1] || ui.customSubMeta[0], { row, id }].filter(Boolean);
      ui.customPerks[4] = ui.customSubMeta[0] ? ui.customSubMeta[0].id : 0;
      ui.customPerks[5] = ui.customSubMeta[1] ? ui.customSubMeta[1].id : 0;
      ui.builderDirty = true;
      renderState(ui.state);
    } else if (act === "rune-shard") {
      ui.customPerks[Number(btn.dataset.slot)] = Number(btn.dataset.id);
      ui.builderDirty = true;
      renderState(ui.state);
    } else if (act === "save-custom-runes") {
      ui.builderDirty = false;
      sendCmd({
        cmd: "save_rune_page",
        name: (ui.customName || t("defaultSaveName")).trim(),
        primary_style_id: ui.customPrimary,
        sub_style_id: ui.customSub,
        selected_perk_ids: ui.customPerks.slice(0, 9)
      });
    } else if (act === "req-swap" || act === "cancel-swap") {
      const id = Number(btn.dataset.id);
      const k = btn.dataset.kind;
      const prefix = act === "req-swap" ? "request" : "cancel";
      if (k === "position") sendCmd({ cmd: prefix + "_position_swap", swap_id: id });
      else if (k === "pick") sendCmd({ cmd: prefix + "_pick_order_swap", swap_id: id });
      else if (k === "trade") sendCmd({ cmd: prefix + "_champion_trade", trade_id: id });
    } else if (act === "resp-swap") {
      // Incoming swap kinds come from the desktop as `position`, `pick_order` and `champion`.
      const id = Number(btn.dataset.id);
      const accept = btn.dataset.accept === "1";
      const k = btn.dataset.kind;
      if (k === "position") sendCmd({ cmd: "respond_position_swap", swap_id: id, accept });
      else if (k === "pick_order" || k === "pick") sendCmd({ cmd: "respond_pick_order_swap", swap_id: id, accept });
      else if (k === "champion" || k === "trade") sendCmd({ cmd: "respond_champion_trade", trade_id: id, accept });
    }
  });

  applyStaticChrome();
  fetchState();
  connectWs();
})();
</script>
</body>
</html>
