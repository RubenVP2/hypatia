<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f1116">
<title>Hypatia — Mobile Remote</title>
<style>
@font-face {
  font-family: "Overpass";
  src: url("/fonts/Overpass-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Overpass";
  src: url("/fonts/Overpass-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Overpass";
  src: url("/fonts/Overpass-ExtraBold.ttf") format("truetype");
  font-weight: 800;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Barlow Condensed";
  src: url("/fonts/BarlowCondensed-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Barlow Condensed";
  src: url("/fonts/BarlowCondensed-ExtraBold.ttf") format("truetype");
  font-weight: 800;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Overpass Mono";
  src: url("/fonts/OverpassMono.ttf") format("truetype");
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --shell: #0b0d11;
  --ground: #0f1116;
  --panel: #161922;
  --raised: #1f2430;
  --rule: #262b38;
  --rule-strong: #3c4356;
  --text: #edeff4;
  --muted: #9ca3b5;
  --plate: #edeff4;
  --on-plate: #0f1116;
  --signal: #f5b400;
  --signal-soft: rgba(245, 180, 0, 0.14);
  --signal-text: #ffd24d;
  --blue: #4c8df6;
  --blue-soft: rgba(76, 141, 246, 0.15);
  --red: #f0605a;
  --red-soft: rgba(240, 96, 90, 0.15);
  --green: #45c47f;
  --green-soft: rgba(69, 196, 127, 0.15);
  --lane-top: #e3b341;
  --lane-jgl: #45c47f;
  --lane-mid: #b07cf0;
  --lane-bot: #ef8bb5;
  --radius: 6px;
  --radius-sm: 4px;
  --font-ui: "Overpass", system-ui, sans-serif;
  --font-display: "Barlow Condensed", "Overpass", sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, monospace;
}

[data-theme="light"] {
  --shell: #e5e1d6;
  --ground: #efece3;
  --panel: #faf8f2;
  --raised: #ebe7dc;
  --rule: #d4cfc2;
  --rule-strong: #a59f8f;
  --text: #14171f;
  --muted: #555a66;
  --plate: #14171f;
  --on-plate: #faf8f2;
  --signal: #b87300;
  --signal-soft: rgba(184, 115, 0, 0.12);
  --signal-text: #8a5600;
  --blue: #2664d4;
  --blue-soft: rgba(38, 100, 212, 0.12);
  --red: #c9342e;
  --red-soft: rgba(201, 52, 46, 0.12);
  --green: #1e7f48;
  --green-soft: rgba(30, 127, 72, 0.12);
  --lane-top: #9e6b06;
  --lane-jgl: #217a47;
  --lane-mid: #7842c2;
  --lane-bot: #bf3b75;
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

::selection {
  background: var(--signal);
  color: #0f1116;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) var(--ground);
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--ground);
}

::-webkit-scrollbar-thumb {
  background: var(--rule-strong);
  border-radius: var(--radius-sm);
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  caret-color: var(--signal);
}

button, input {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 1px solid var(--rule);
  background: var(--panel);
  border-radius: var(--radius-sm);
  transition: background-color 110ms ease-out, border-color 110ms ease-out, transform 80ms ease-out;
}

button:active:not(:disabled) {
  transform: scale(0.985);
}

button:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}

.icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

/* Header & Navigation */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--shell);
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1 1 0%;
  min-width: 0;
  overflow: hidden;
}

.brand > div {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
}

.brand-mark {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}

.brand-mark.live {
  background: var(--green);
  box-shadow: 0 0 0 3px var(--green-soft);
}

.brand-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.6px;
  line-height: 1.1;
  margin: 0;
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.pill-btn {
  height: 30px;
  padding: 0 9px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius-sm);
}

.pill-btn.active {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--green);
}

.pill-btn.signal {
  background: var(--signal-soft);
  border-color: var(--signal);
  color: var(--signal-text);
}

.icon-btn {
  width: 30px;
  height: 30px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
}

/* Compact Collapsible Demo Strip */
.demo-strip {
  background: var(--shell);
  border-bottom: 1px solid var(--rule);
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
}

.demo-strip-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--signal-text);
  letter-spacing: 0.6px;
  flex-shrink: 0;
}

.demo-chip {
  height: 24px;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  background: var(--raised);
  border: 1px solid var(--rule);
}

.demo-chip.active {
  background: var(--signal);
  border-color: var(--signal);
  color: #0f1116;
}

/* Main App Container */
.shell-main {
  max-width: 560px;
  margin: 0 auto;
  padding: 12px 14px 96px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Cards & Typography */
.card {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-spotlight {
  background: var(--signal-soft);
  border: 1px solid var(--signal);
}

.card-danger {
  background: var(--danger-soft);
  border: 1px solid var(--red);
}

.card-green {
  background: var(--green-soft);
  border: 1px solid var(--green);
}

.heading-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.3px;
  line-height: 1.1;
}

.h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.3px;
  line-height: 1.15;
}

.meta {
  font-size: 12px;
  color: var(--muted);
}

.mono {
  font-family: var(--font-mono);
}

.timer-readout {
  font-family: var(--font-display);
  font-size: 58px;
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -1px;
  color: var(--text);
  text-align: center;
}

.timer-inline {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  color: var(--signal-text);
}

/* Buttons */
.btn-primary {
  height: 48px;
  padding: 0 16px;
  background: var(--signal);
  border: 1px solid var(--signal);
  color: #0f1116;
  font-size: 14px;
  font-weight: 800;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
}

.btn-accept {
  height: 58px;
  background: var(--green);
  border: 1px solid var(--green);
  color: #09130d;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.6px;
  border-radius: var(--radius);
  width: 100%;
}

.btn-secondary {
  height: 38px;
  padding: 0 12px;
  background: var(--raised);
  border: 1px solid var(--rule-strong);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-danger {
  height: 38px;
  padding: 0 12px;
  background: var(--danger-soft);
  border: 1px solid var(--red);
  color: var(--red);
  font-size: 14px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.row-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

/* Role Selection */
.lane-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.lane-card {
  height: 48px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
}

.lane-card.primary {
  background: var(--signal-soft);
  border-color: var(--signal);
  color: var(--signal-text);
}

.lane-card.secondary {
  background: var(--blue-soft);
  border-color: var(--blue);
  color: var(--blue);
}

.roundel-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 800;
  flex-shrink: 0;
}

/* Persistent Compact Team Draft Strip in Champ Select */
.team-strip {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.team-slots-5 {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}

.slot-mini {
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 6px 4px;
  text-align: center;
  min-width: 0;
}

.slot-mini.self {
  background: var(--signal-soft);
  border-color: var(--signal);
}

.slot-mini-role {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
}

.slot-mini-champ {
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.bans-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
}

/* Segmented Tabs (no numeric prefixes) */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  background: var(--shell);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 4px;
}

.tabs-2 {
  grid-template-columns: repeat(2, 1fr);
}

.tab-btn {
  height: 34px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  border-radius: var(--radius-sm);
}

.tab-btn.active {
  background: var(--signal);
  border-color: var(--signal);
  color: #0f1116;
}

/* Champion Grid & Filter */
.search-input {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  background: var(--ground);
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text);
}

.filter-pills {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.filter-pill {
  height: 28px;
  padding: 0 10px;
  font-size: 11px;
  font-weight: 700;
  background: var(--ground);
  border: 1px solid var(--rule);
  color: var(--muted);
  white-space: nowrap;
}

.filter-pill.active {
  background: var(--plate);
  border-color: var(--plate);
  color: var(--on-plate);
}

.champ-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 7px;
  max-height: 300px;
  overflow-y: auto;
  padding-right: 2px;
}

@media (min-height: 760px) {
  .champ-grid {
    max-height: min(46vh, 420px);
  }
}

.champ-card {
  padding: 9px 7px;
  text-align: left;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.champ-card.selected {
  background: var(--signal-soft);
  border-color: var(--signal);
}

.champ-card-name {
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.champ-card-role {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

/* Skins, Spells, Runes */
.list-col {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.row-card {
  padding: 10px 12px;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
}

.row-card.selected {
  background: var(--signal-soft);
  border-color: var(--signal);
}

.spell-pair {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: stretch;
}

.spell-box {
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: left;
}

.spell-box.active {
  border-color: var(--signal);
  background: var(--signal-soft);
}

.perk-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.perk-row.cols-flex {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 6px;
}

.perk-chip {
  min-height: 36px;
  height: auto;
  padding: 5px 6px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  color: var(--text);
}

.perk-chip.active {
  background: var(--signal);
  border-color: var(--signal);
  color: #0f1116;
}

.perk-chip.sub-active {
  background: var(--blue-soft);
  border-color: var(--blue);
  color: var(--blue);
}

.divider {
  height: 1px;
  background: var(--rule);
  width: 100%;
}

/* Live Match Scoreboard */
.score-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.score-duo {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.score-num {
  font-family: var(--font-display);
  font-size: 46px;
  font-weight: 800;
  line-height: 1;
}

.score-blue { color: var(--blue); }
.score-red { color: var(--red); }

.feed-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 12px;
}

.feed-item:last-child {
  border-bottom: none;
}

.player-live-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
}

.player-live-row.self {
  background: var(--signal-soft);
  border-color: var(--signal);
}

/* Bottom Sticky Action Dock */
.bottom-dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 45;
  background: var(--shell);
  border-top: 1px solid var(--rule);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}

.bottom-dock-inner {
  max-width: 560px;
  margin: 0 auto;
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  background: var(--plate);
  color: var(--on-plate);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--rule-strong);
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease-out;
}

.toast.visible {
  opacity: 1;
}

.alert-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="conn-dot" class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1 class="brand-title">HYPATIA</h1>
        <div id="summoner-line" class="brand-sub">Connecting...</div>
      </div>
    </div>
    <div class="top-actions">
      <button id="alert-top-btn" class="pill-btn" type="button" title="Notification alerts status">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span id="alert-top-lbl">Arm Alerts</span>
      </button>
      <button id="demo-toggle-btn" class="pill-btn signal" type="button" style="display:none">Demo</button>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle day or night theme">
        <svg id="theme-icon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh state">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="demo-strip" class="demo-strip" style="display:none" aria-label="Demo phase controls">
    <span class="demo-strip-label">DEMO:</span>
    <button class="demo-chip" data-action="demo-phase" data-phase="Lobby">Lobby</button>
    <button class="demo-chip" data-action="demo-phase" data-phase="Matchmaking">Queue</button>
    <button class="demo-chip" data-action="demo-phase" data-phase="ReadyCheck">Ready</button>
    <button class="demo-chip" data-action="demo-phase" data-phase="ChampSelect">Champ Select</button>
    <button class="demo-chip" data-action="demo-phase" data-phase="InProgress">Live Game</button>
    <button class="demo-chip" data-action="demo-swap">Test Swap</button>
  </nav>

  <main class="shell-main">
    <section id="alert-setup-card" class="card card-spotlight" style="display:none">
      <div class="alert-banner">
        <div>
          <div class="h3">Enable Turn & Ready Alerts</div>
          <div class="meta">Arm browser notifications and audio chime so you never miss Ready Check or Pick turn.</div>
        </div>
        <button id="arm-alerts-btn" class="btn-secondary" type="button" style="flex-shrink:0">Arm</button>
      </div>
    </section>

    <div id="view-root"></div>
  </main>

  <div id="bottom-dock" class="bottom-dock" style="display:none">
    <div id="dock-content" class="bottom-dock-inner"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const URL_TOKEN = new URLSearchParams(location.search).get("token") || "";
  const LANE_META = [
    { key: "TOP", label: "Top", code: "T", color: "var(--lane-top)" },
    { key: "JUNGLE", label: "Jungle", code: "J", color: "var(--lane-jgl)" },
    { key: "MIDDLE", label: "Mid", code: "M", color: "var(--lane-mid)" },
    { key: "BOTTOM", label: "Bot", code: "B", color: "var(--lane-bot)" },
    { key: "UTILITY", label: "Support", code: "S", color: "var(--lane-bot)" },
    { key: "FILL", label: "Fill", code: "F", color: "var(--muted)" }
  ];

  const STAT_SHARD_ROWS = [
    {
      label: "Offense",
      slot: 6,
      options: [
        { id: 5008, name: "+9 Adaptive Force" },
        { id: 5005, name: "+10% Attack Speed" },
        { id: 5007, name: "+8 Ability Haste" }
      ]
    },
    {
      label: "Flex",
      slot: 7,
      options: [
        { id: 5008, name: "+9 Adaptive Force" },
        { id: 5010, name: "+2% Move Speed" },
        { id: 5001, name: "+10-180 HP" }
      ]
    },
    {
      label: "Defense",
      slot: 8,
      options: [
        { id: 5011, name: "+65 Flat HP" },
        { id: 5013, name: "+10% Tenacity" },
        { id: 5001, name: "+10-180 HP" }
      ]
    }
  ];

  const ui = {
    state: null,
    demoOpen: localStorage.getItem("hypatia_demo_open") !== "0",
    theme: localStorage.getItem("hypatia_theme") || "dark",
    csTab: "pick",
    liveTab: "allies",
    champQuery: "",
    champRole: "ALL",
    selectingFirstRole: true,
    lobbyFirst: "MIDDLE",
    lobbySecond: "TOP",
    lobbySynced: false,
    spellSlot: 1, // 1 for D, 2 for F
    runeSubView: "saved", // saved | custom
    customPrimary: 8100,
    customSub: 8200,
    // 9 slots: [keystone, p1, p2, p3, s1, s2, shardOff, shardFlex, shardDef]
    customPerks: [8112, 8139, 8138, 8106, 8226, 8210, 5008, 5008, 5001],
    customSubMeta: [
      { row: "slot1", id: 8226 },
      { row: "slot2", id: 8210 }
    ],
    customName: "Hypatia Pit-Wall Page",
    alertsArmed: localStorage.getItem("hypatia_alerts") === "1",
    lastAlertSeq: 0,
    audioCtx: null,
    ws: null,
    toastTimer: null
  };

  function applyTheme(t) {
    ui.theme = t;
    localStorage.setItem("hypatia_theme", t);
    if (t === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  applyTheme(ui.theme);

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("visible");
    clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(() => el.classList.remove("visible"), 2200);
  }

  function fmtSec(sec) {
    const n = Math.max(0, Math.floor(sec || 0));
    const m = String(Math.floor(n / 60)).padStart(2, "0");
    const s = String(n % 60).padStart(2, "0");
    return m + ":" + s;
  }

  function laneInfo(raw) {
    const u = String(raw || "").toUpperCase();
    return LANE_META.find(l => l.key === u || l.label.toUpperCase() === u)
      || { key: u, label: u || "Flex", code: "?", color: "var(--muted)" };
  }

  function initAudio() {
    if (!ui.audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ui.audioCtx = new AC();
    }
    if (ui.audioCtx && ui.audioCtx.state === "suspended") {
      ui.audioCtx.resume().catch(() => {});
    }
  }

  function playChime() {
    if (!ui.alertsArmed) return;
    try {
      initAudio();
      if (!ui.audioCtx) return;
      const now = ui.audioCtx.currentTime;
      [660, 880].forEach((freq, idx) => {
        const osc = ui.audioCtx.createOscillator();
        const gain = ui.audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.001, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(ui.audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.26);
      });
    } catch (_) {}
  }

  function armAlerts(isTest) {
    initAudio();
    ui.alertsArmed = true;
    localStorage.setItem("hypatia_alerts", "1");
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission().finally(updateAlertChrome);
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
    updateAlertChrome();
    playChime();
    showToast(isTest ? "Alert chime tested" : "Alerts armed");
  }

  function updateAlertChrome() {
    const permGranted = !("Notification" in window) || Notification.permission === "granted";
    const armed = ui.alertsArmed && permGranted;
    const btn = document.getElementById("alert-top-btn");
    const lbl = document.getElementById("alert-top-lbl");
    const card = document.getElementById("alert-setup-card");
    if (armed) {
      btn.className = "pill-btn active";
      lbl.textContent = "Alerts ON";
      card.style.display = "none";
    } else {
      btn.className = "pill-btn";
      lbl.textContent = "Arm Alerts";
      card.style.display = "flex";
    }
  }

  function fireAlertIfNew(snap) {
    if (!snap || !snap.alert_seq || snap.alert_seq <= ui.lastAlertSeq) return;
    const isInitial = ui.lastAlertSeq === 0;
    ui.lastAlertSeq = snap.alert_seq;
    if (isInitial || !ui.alertsArmed || !snap.alert_title) return;
    playChime();
    if (navigator.vibrate) navigator.vibrate([120, 60, 140]);
    if ("Notification" in window && Notification.permission === "granted") {
      try {
        new Notification(snap.alert_title, { body: snap.alert_body || "", tag: "hypatia-turn" });
      } catch (_) {}
    }
  }

  async function sendCmd(payload) {
    const headers = { "Content-Type": "application/json" };
    if (URL_TOKEN) headers["X-Hypatia-Token"] = URL_TOKEN;
    try {
      const res = await fetch("/api/action", {
        method: "POST",
        headers,
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!res.ok || json.error) {
        showToast(json.error || "Command rejected");
        return;
      }
      if (json.state) renderState(json.state);
    } catch (_) {
      showToast("Network error sending action");
    }
  }

  async function fetchState() {
    const headers = {};
    if (URL_TOKEN) headers["X-Hypatia-Token"] = URL_TOKEN;
    try {
      const q = URL_TOKEN ? "?token=" + encodeURIComponent(URL_TOKEN) : "";
      const res = await fetch("/api/state" + q, { headers });
      if (res.ok) renderState(await res.json());
    } catch (_) {}
  }

  function connectWs() {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const q = URL_TOKEN ? "?token=" + encodeURIComponent(URL_TOKEN) : "";
    const ws = new WebSocket(proto + location.host + "/ws" + q);
    ui.ws = ws;
    ws.onopen = () => {
      document.getElementById("conn-dot").classList.add("live");
    };
    ws.onmessage = (ev) => {
      try {
        renderState(JSON.parse(ev.data));
      } catch (_) {}
    };
    ws.onclose = () => {
      document.getElementById("conn-dot").classList.remove("live");
      setTimeout(connectWs, 1500);
    };
  }

  function renderDock(html) {
    const dock = document.getElementById("bottom-dock");
    const content = document.getElementById("dock-content");
    if (!html) {
      dock.style.display = "none";
      content.innerHTML = "";
    } else {
      dock.style.display = "block";
      content.innerHTML = html;
    }
  }

  function syncCustomRunesDefaults(cs) {
    if (!cs || !cs.rune_trees || !cs.rune_trees.length) return;
    const pTree = cs.rune_trees.find(t => t.id === ui.customPrimary) || cs.rune_trees[0];
    if (ui.customSub === pTree.id) {
      const alt = cs.rune_trees.find(t => t.id !== pTree.id) || cs.rune_trees[0];
      ui.customSub = alt.id;
    }
    const sTree = cs.rune_trees.find(t => t.id === ui.customSub) || cs.rune_trees[1] || pTree;
    const ensureIn = (arr, cur) => (arr && arr.some(x => x.id === cur)) ? cur : (arr && arr[0] ? arr[0].id : 0);
    ui.customPrimary = pTree.id;
    ui.customSub = sTree.id;
    ui.customPerks[0] = ensureIn(pTree.keystones, ui.customPerks[0]);
    ui.customPerks[1] = ensureIn(pTree.slot1, ui.customPerks[1]);
    ui.customPerks[2] = ensureIn(pTree.slot2, ui.customPerks[2]);
    ui.customPerks[3] = ensureIn(pTree.slot3, ui.customPerks[3]);

    const validSubIds = [
      ...(sTree.slot1 || []).map(x => ({ row: "slot1", id: x.id })),
      ...(sTree.slot2 || []).map(x => ({ row: "slot2", id: x.id })),
      ...(sTree.slot3 || []).map(x => ({ row: "slot3", id: x.id }))
    ];
    let pair = ui.customSubMeta.filter(m => validSubIds.some(v => v.id === m.id));
    if (pair.length < 2) {
      const pick1 = sTree.slot1 && sTree.slot1[0] ? { row: "slot1", id: sTree.slot1[0].id } : validSubIds[0];
      const pick2 = sTree.slot2 && sTree.slot2[0] ? { row: "slot2", id: sTree.slot2[0].id } : (validSubIds[1] || pick1);
      pair = [pick1, pick2].filter(Boolean);
    }
    if (pair[0] && pair[1]) {
      ui.customSubMeta = pair;
      ui.customPerks[4] = pair[0].id;
      ui.customPerks[5] = pair[1].id;
    }
  }

  function renderLobby(s) {
    const l = s.lobby;
    if (!ui.lobbySynced && l) {
      ui.lobbyFirst = l.first_position || "MIDDLE";
      ui.lobbySecond = l.second_position || "TOP";
      ui.lobbySynced = true;
    }
    const members = (l && l.members) || [];
    renderDock(`
      <div class="row-2">
        <button class="btn-secondary" data-action="save-roles">Apply Lanes</button>
        <button class="btn-primary" data-action="start-queue">Find Match</button>
      </div>
    `);
    return `
      <section class="card">
        <div class="heading-row">
          <h2 class="h2">${esc((l && l.queue_name) || "League Lobby")}</h2>
          <span class="meta mono">${members.length} player${members.length === 1 ? "" : "s"}</span>
        </div>
        <div class="meta">Tap Primary or Secondary slot below, then choose a role.</div>
        <div class="row-2">
          <button class="lane-card ${ui.selectingFirstRole ? "primary" : ""}" data-action="focus-slot" data-slot="1">
            <span class="roundel-dot" style="border-color:${laneInfo(ui.lobbyFirst).color}">${esc(laneInfo(ui.lobbyFirst).code)}</span>
            <span>Primary: ${esc(laneInfo(ui.lobbyFirst).label)}</span>
          </button>
          <button class="lane-card ${!ui.selectingFirstRole ? "secondary" : ""}" data-action="focus-slot" data-slot="2">
            <span class="roundel-dot" style="border-color:${laneInfo(ui.lobbySecond).color}">${esc(laneInfo(ui.lobbySecond).code)}</span>
            <span>Secondary: ${esc(laneInfo(ui.lobbySecond).label)}</span>
          </button>
        </div>
        <div class="lane-grid">
          ${LANE_META.map(m => {
            const cls = m.key === ui.lobbyFirst ? "primary" : (m.key === ui.lobbySecond ? "secondary" : "");
            return `<button class="lane-card ${cls}" data-action="pick-lane" data-lane="${esc(m.key)}">
              <span class="roundel-dot" style="border-color:${m.color}">${esc(m.code)}</span>
              <span>${esc(m.label)}</span>
            </button>`;
          }).join("")}
        </div>
      </section>
      ${members.length ? `<section class="card">
        <h3 class="h3">Party Roster</h3>
        <div class="list-col">
          ${members.map(m => `
            <div class="row-card">
              <div>
                <div style="font-weight:800">${esc(m.summoner_name)}${m.is_leader ? " (Leader)" : ""}</div>
                <div class="meta">${esc(laneInfo(m.first_position).label)} / ${esc(laneInfo(m.second_position).label)}</div>
              </div>
              <span class="meta mono">${m.ready ? "READY" : "WAIT"}</span>
            </div>`).join("")}
        </div>
      </section>` : ""}
    `;
  }

  function renderQueue(s) {
    const mm = s.matchmaking || {};
    renderDock(`<button class="btn-danger" style="width:100%;height:44px" data-action="stop-queue">Cancel Queue</button>`);
    return `
      <section class="card">
        <div class="heading-row">
          <h2 class="h2">${esc(mm.queue_name || "Matchmaking")}</h2>
          <span class="pill-btn signal">In Queue</span>
        </div>
        <div class="timer-readout">${fmtSec(mm.time_in_queue_sec)}</div>
        <div class="meta" style="text-align:center">Estimated queue wait: ${fmtSec(mm.estimated_queue_time_sec || 60)}</div>
      </section>
    `;
  }

  function renderReady(s) {
    const mm = s.matchmaking || {};
    const accepted = mm.player_response === "Accepted";
    renderDock("");
    return `
      <section class="card ${accepted ? "card-green" : "card-spotlight"}">
        <div class="heading-row">
          <h2 class="h2">${accepted ? "Match Accepted" : "Match Found"}</h2>
          <span class="timer-inline">${esc(mm.ready_check_timer_sec || 10)}s</span>
        </div>
        <div class="meta">${accepted ? "Waiting for remaining players to accept." : "Tap ACCEPT now before the timer expires."}</div>
        ${!accepted ? `
          <button class="btn-accept" data-action="accept-ready">ACCEPT MATCH</button>
          <button class="btn-danger" data-action="decline-ready">Decline</button>
        ` : ""}
      </section>
    `;
  }

  function renderChampSelect(s) {
    const cs = s.champ_select;
    if (!cs) {
      renderDock("");
      return `<section class="card"><h2 class="h2">Champion Select</h2><div class="meta">Syncing draft state...</div></section>`;
    }
    syncCustomRunesDefaults(cs);
    const act = cs.active_action;
    const isTurn = Boolean(act && act.is_my_turn && !act.completed);
    const actWord = act && act.action_type === "ban" ? "Ban" : "Pick";

    // Persistent compact team strip
    const teamStrip = `
      <div class="team-strip" aria-label="Team draft summary">
        <div class="team-slots-5">
          ${(cs.my_team || []).map(a => {
            const role = laneInfo(a.assigned_position);
            return `<div class="slot-mini ${a.is_self ? "self" : ""}">
              <div class="slot-mini-role">${esc(role.label.toUpperCase())}</div>
              <div class="slot-mini-champ">${esc(a.champion_name || "Pending")}</div>
            </div>`;
          }).join("")}
        </div>
        <div class="bans-line">
          <span>Blue bans: ${(cs.my_team_bans || []).length ? esc(cs.my_team_bans.join(", ")) : "None"}</span>
          <span>Red bans: ${(cs.their_team_bans || []).length ? esc(cs.their_team_bans.join(", ")) : "None"}</span>
        </div>
      </div>
    `;

    // Bottom Dock when acting
    if (isTurn && act) {
      const hovered = act.champion_name || (act.action_type === "ban" ? "Choose ban below" : "Choose champion below");
      renderDock(`
        <button class="btn-primary" data-action="lock-action" data-action-id="${act.action_id}" ${act.champion_id > 0 ? "" : "disabled"}>
          Lock ${esc(actWord)}: ${esc(hovered)}
        </button>
      `);
    } else {
      renderDock("");
    }

    let tabBody = "";
    if (ui.csTab === "pick") {
      const q = ui.champQuery.trim().toLowerCase();
      const filtered = (cs.champions || []).filter(c => {
        if (q && !c.name.toLowerCase().includes(q)) return false;
        if (ui.champRole !== "ALL" && !(c.roles || []).includes(ui.champRole)) return false;
        return true;
      }).slice(0, 72);
      const selectedId = act ? act.champion_id : 0;
      tabBody = `
        <section class="card">
          <input id="champ-search" class="search-input" type="search" placeholder="Filter champion for ${esc(actWord)}..." value="${esc(ui.champQuery)}">
          <div class="filter-pills">
            ${["ALL", "TOP", "JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"].map(rk => `
              <button class="filter-pill ${ui.champRole === rk ? "active" : ""}" data-action="champ-role" data-role="${rk}">
                ${rk === "ALL" ? "All" : esc(laneInfo(rk).label)}
              </button>
            `).join("")}
          </div>
          <div class="champ-grid">
            ${filtered.map(c => `
              <button class="champ-card ${c.id === selectedId ? "selected" : ""}" data-action="hover-champ" data-id="${c.id}" ${act ? "" : "disabled"}>
                <div class="champ-card-name">${esc(c.name)}</div>
                <div class="champ-card-role">${esc((c.roles || []).map(r => laneInfo(r).code).join("/") || "FLEX")}</div>
              </button>
            `).join("")}
          </div>
        </section>
      `;
    } else if (ui.csTab === "skins") {
      const skins = cs.available_skins || [];
      tabBody = `
        <section class="card">
          <h3 class="h3">Champion Skins</h3>
          <div class="list-col">
            ${skins.length ? skins.map(sk => `
              <button class="row-card ${sk.selected ? "selected" : ""}" data-action="set-skin" data-id="${sk.id}">
                <span style="font-weight:700">${esc(sk.name)}</span>
                <span class="meta mono">${sk.selected ? "EQUIPPED" : "Select"}</span>
              </button>
            `).join("") : `<div class="meta">Select a champion to browse available skins.</div>`}
          </div>
        </section>
      `;
    } else if (ui.csTab === "loadout") {
      const spells = cs.available_spells || [];
      const s1 = spells.find(sp => sp.id === cs.spell1_id) || { name: "Flash", cooldown: "300s" };
      const s2 = spells.find(sp => sp.id === cs.spell2_id) || { name: "Ignite", cooldown: "180s" };
      const pages = [...(cs.rune_pages || []), ...(cs.recommended_rune_pages || [])];
      const pTree = (cs.rune_trees || []).find(t => t.id === ui.customPrimary);
      const sTree = (cs.rune_trees || []).find(t => t.id === ui.customSub);

      tabBody = `
        <section class="card">
          <div class="heading-row">
            <h3 class="h3">Summoner Spells</h3>
            <button class="btn-secondary" style="height:30px;font-size:11px" data-action="swap-spells">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/>
              </svg>
              Swap D / F
            </button>
          </div>
          <div class="spell-pair">
            <button class="spell-box ${ui.spellSlot === 1 ? "active" : ""}" data-action="focus-spell-slot" data-slot="1">
              <div class="meta mono">SLOT D</div>
              <div style="font-weight:800">${esc(s1.name)}</div>
              <div class="meta">${esc(s1.cooldown)}</div>
            </button>
            <div style="display:flex;align-items:center" class="meta">to</div>
            <button class="spell-box ${ui.spellSlot === 2 ? "active" : ""}" data-action="focus-spell-slot" data-slot="2">
              <div class="meta mono">SLOT F</div>
              <div style="font-weight:800">${esc(s2.name)}</div>
              <div class="meta">${esc(s2.cooldown)}</div>
            </button>
          </div>
          <div class="perk-row cols-flex">
            ${spells.map(sp => {
              const active = (ui.spellSlot === 1 ? cs.spell1_id : cs.spell2_id) === sp.id;
              return `<button class="perk-chip ${active ? "active" : ""}" data-action="pick-spell" data-id="${sp.id}">${esc(sp.name)}</button>`;
            }).join("")}
          </div>
        </section>

        <section class="card">
          <div class="heading-row">
            <h3 class="h3">Runes</h3>
            <div class="row-2" style="width:168px;gap:4px">
              <button class="filter-pill ${ui.runeSubView === "saved" ? "active" : ""}" data-action="rune-sub" data-mode="saved">Pages</button>
              <button class="filter-pill ${ui.runeSubView === "custom" ? "active" : ""}" data-action="rune-sub" data-mode="custom">Builder</button>
            </div>
          </div>

          ${ui.runeSubView === "saved" ? `
            <div class="list-col">
              ${pages.map(pg => `
                <button class="row-card ${pg.current ? "selected" : ""}" data-action="select-rune-page" data-id="${pg.id}" data-is-preset="${pg.is_preset ? "1" : "0"}" data-name="${esc(pg.name)}" data-pri="${pg.primary_style_id}" data-sub="${pg.sub_style_id}" data-perks="${esc((pg.selected_perk_ids || []).join(","))}">
                  <div>
                    <div style="font-weight:800">${esc(pg.name)}</div>
                    <div class="meta">${esc(pg.primary_style_name)} + ${esc(pg.sub_style_name)} · ${esc(pg.keystone_name)}</div>
                  </div>
                  <span class="meta mono">${pg.current ? "ACTIVE" : (pg.is_preset ? "PRESET" : "EQUIP")}</span>
                </button>
              `).join("")}
            </div>
          ` : `
            <div class="list-col">
              <input id="custom-rune-name" class="search-input" type="text" value="${esc(ui.customName)}" placeholder="Rune page name">
              <div class="meta mono">Primary Path</div>
              <div class="perk-row cols-flex">
                ${(cs.rune_trees || []).map(t => `<button class="perk-chip ${t.id === ui.customPrimary ? "active" : ""}" data-action="rune-pri" data-id="${t.id}">${esc(t.name)}</button>`).join("")}
              </div>
              ${pTree ? `
                <div class="meta mono">Keystone</div>
                <div class="perk-row ${pTree.keystones.length === 3 ? "" : "cols-flex"}">
                  ${pTree.keystones.map(k => `<button class="perk-chip ${ui.customPerks[0] === k.id ? "active" : ""}" data-action="rune-p" data-slot="0" data-id="${k.id}">${esc(k.name)}</button>`).join("")}
                </div>
                ${[pTree.slot1, pTree.slot2, pTree.slot3].map((row, idx) => `
                  <div class="perk-row">
                    ${row.map(o => `<button class="perk-chip ${ui.customPerks[idx + 1] === o.id ? "active" : ""}" data-action="rune-p" data-slot="${idx + 1}" data-id="${o.id}">${esc(o.name)}</button>`).join("")}
                  </div>
                `).join("")}
              ` : ""}
              <div class="divider"></div>
              <div class="meta mono">Secondary Path (choose 2 from distinct rows)</div>
              <div class="perk-row cols-flex">
                ${(cs.rune_trees || []).filter(t => t.id !== ui.customPrimary).map(t => `<button class="perk-chip ${t.id === ui.customSub ? "sub-active" : ""}" data-action="rune-sub-tree" data-id="${t.id}">${esc(t.name)}</button>`).join("")}
              </div>
              ${sTree ? ["slot1", "slot2", "slot3"].map(rowKey => `
                <div class="perk-row">
                  ${(sTree[rowKey] || []).map(o => {
                    const chosen = ui.customSubMeta.some(m => m.id === o.id);
                    return `<button class="perk-chip ${chosen ? "sub-active" : ""}" data-action="rune-sub-perk" data-row="${rowKey}" data-id="${o.id}">${esc(o.name)}</button>`;
                  }).join("")}
                </div>
              `).join("") : ""}
              <div class="divider"></div>
              <div class="meta mono">Stat Shards (3 slots)</div>
              ${STAT_SHARD_ROWS.map(sr => `
                <div class="perk-row">
                  ${sr.options.map(op => `<button class="perk-chip ${ui.customPerks[sr.slot] === op.id ? "active" : ""}" data-action="rune-shard" data-slot="${sr.slot}" data-id="${op.id}">${esc(op.name)}</button>`).join("")}
                </div>
              `).join("")}
              <button class="btn-primary" data-action="save-custom-runes">Save & Equip All 9 Perks</button>
            </div>
          `}
        </section>
      `;
    } else {
      // Tab: Team (Position Swaps, Pick Swaps, Champion Trades, Enemies)
      const incoming = cs.incoming_swaps || [];
      tabBody = `
        ${incoming.length ? `<section class="card card-spotlight">
          <h3 class="h3">Incoming Requests</h3>
          ${incoming.map(sw => `
            <div class="row-card" style="flex-direction:column;align-items:stretch">
              <div style="font-weight:800">${esc(sw.caller_name)} · ${esc(sw.kind.replace(/_/g, " "))}</div>
              <div class="meta">${esc(sw.detail)}</div>
              <div class="row-2" style="margin-top:6px">
                <button class="btn-secondary" data-action="resp-swap" data-kind="${esc(sw.kind)}" data-id="${sw.id}" data-accept="1">Accept</button>
                <button class="btn-danger" data-action="resp-swap" data-kind="${esc(sw.kind)}" data-id="${sw.id}" data-accept="0">Decline</button>
              </div>
            </div>
          `).join("")}
        </section>` : ""}

        <section class="card">
          <h3 class="h3">Allies & Swaps</h3>
          <div class="list-col">
            ${(cs.my_team || []).map(a => {
              const role = laneInfo(a.assigned_position);
              return `<div class="row-card" style="flex-direction:column;align-items:stretch">
                <div class="heading-row">
                  <div>
                    <div style="font-weight:800">${esc(a.champion_name || "Pending")} ${a.is_self ? "(You)" : ""}</div>
                    <div class="meta">${esc(role.label)} · ${esc(a.summoner_name)}</div>
                  </div>
                  ${a.acting_label ? `<span class="pill-btn signal">${esc(a.acting_label)}</span>` : ""}
                </div>
                ${!a.is_self ? `<div class="row-3" style="margin-top:6px">
                  ${a.position_swap_id != null && a.position_swap_state !== "INVALID" ? (
                    a.position_swap_state === "SENT"
                      ? `<button class="btn-secondary" data-action="cancel-swap" data-kind="position" data-id="${a.position_swap_id}">Cancel Lane</button>`
                      : `<button class="btn-secondary" data-action="req-swap" data-kind="position" data-id="${a.position_swap_id}">Swap Lane</button>`
                  ) : `<button class="btn-secondary" disabled>Lane N/A</button>`}
                  ${a.pick_swap_id != null && a.pick_swap_state !== "INVALID" ? (
                    a.pick_swap_state === "SENT"
                      ? `<button class="btn-secondary" data-action="cancel-swap" data-kind="pick" data-id="${a.pick_swap_id}">Cancel Order</button>`
                      : `<button class="btn-secondary" data-action="req-swap" data-kind="pick" data-id="${a.pick_swap_id}">Swap Order</button>`
                  ) : `<button class="btn-secondary" disabled>Order N/A</button>`}
                  ${a.trade_id != null && a.trade_state !== "INVALID" ? (
                    a.trade_state === "SENT"
                      ? `<button class="btn-secondary" data-action="cancel-swap" data-kind="trade" data-id="${a.trade_id}">Cancel Trade</button>`
                      : `<button class="btn-secondary" data-action="req-swap" data-kind="trade" data-id="${a.trade_id}">Trade Champ</button>`
                  ) : `<button class="btn-secondary" disabled>Trade N/A</button>`}
                </div>` : ""}
              </div>`;
            }).join("")}
          </div>
        </section>

        <section class="card">
          <h3 class="h3">Enemy Team</h3>
          <div class="perk-row">
            ${(cs.their_team || []).map(e => `<span class="pill-btn">${esc(e.champion_name || "Pending")}</span>`).join("")}
          </div>
        </section>
      `;
    }

    return `
      <section class="card ${isTurn ? "card-spotlight" : ""}">
        <div class="heading-row">
          <div>
            <h2 class="h2">${isTurn ? "Your Turn to " + esc(actWord) : esc(cs.sub_phase.replace(/_/g, " "))}</h2>
            <div class="meta">${esc(laneInfo(cs.assigned_position).label)} · ${esc(cs.queue_type.replace(/_/g, " "))}</div>
          </div>
          <div class="timer-inline">${esc(cs.time_left_sec)}s</div>
        </div>
      </section>

      ${teamStrip}

      <div class="tabs" role="tablist">
        ${[
          { id: "pick", label: "Pick" },
          { id: "skins", label: "Skins" },
          { id: "loadout", label: "Loadout" },
          { id: "team", label: "Team" }
        ].map(t => `<button class="tab-btn ${ui.csTab === t.id ? "active" : ""}" role="tab" aria-selected="${ui.csTab === t.id}" data-action="cs-tab" data-tab="${t.id}">${esc(t.label)}</button>`).join("")}
      </div>

      ${tabBody}
    `;
  }

  function renderLive(s) {
    renderDock("");
    const lg = s.live_game;
    if (!lg) {
      return `<section class="card"><h2 class="h2">Live Match</h2><div class="meta">Waiting for League Live Client Data on :2999...</div></section>`;
    }
    const list = ui.liveTab === "allies" ? (lg.allies || []) : (lg.enemies || []);
    return `
      <section class="card">
        <div class="score-banner">
          <div class="score-duo">
            <span class="score-num score-blue">${lg.my_kills}</span>
            <span class="meta mono" style="font-size:22px">:</span>
            <span class="score-num score-red">${lg.enemy_kills}</span>
          </div>
          <div style="text-align:right">
            <div class="timer-inline mono">${esc(lg.clock)}</div>
            <div class="meta mono">Towers ${lg.my_towers} / ${lg.enemy_towers}</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="heading-row">
          <div>
            <div style="font-weight:800;font-size:18px">${esc(lg.active_champion)} · Lvl ${lg.level}</div>
            <div class="meta">${lg.cs} CS · ${lg.current_gold} Gold</div>
          </div>
          <span class="pill-btn signal mono" style="font-size:12px">${esc(lg.kda)}</span>
        </div>
      </section>

      ${(lg.feed || []).length ? `<section class="card">
        <h3 class="h3">Recent Match Events</h3>
        <div>
          ${lg.feed.map(f => `
            <div class="feed-item">
              <span class="meta mono" style="width:42px;flex-shrink:0">${esc(f.time)}</span>
              <span style="color:${f.side === 0 ? "var(--red)" : "var(--text)"};font-weight:600">${esc(f.text)}</span>
            </div>
          `).join("")}
        </div>
      </section>` : ""}

      <div class="tabs tabs-2" role="tablist">
        <button class="tab-btn ${ui.liveTab === "allies" ? "active" : ""}" data-action="live-tab" data-tab="allies">Allies</button>
        <button class="tab-btn ${ui.liveTab === "enemies" ? "active" : ""}" data-action="live-tab" data-tab="enemies">Enemies</button>
      </div>

      <section class="card">
        <div class="list-col">
          ${list.map(p => `
            <div class="player-live-row ${p.is_self ? "self" : ""}">
              <div>
                <div style="font-weight:800">${esc(p.champion)} ${p.is_self ? "(You)" : ""}</div>
                <div class="meta">${esc(p.lane)} · ${p.dead ? `<span style="color:var(--red);font-weight:700">Respawn ${p.respawn_sec}s</span>` : `Lvl ${p.level} · ${p.cs} CS`}</div>
              </div>
              <span class="mono" style="font-weight:700">${esc(p.kda)}</span>
            </div>
          `).join("")}
        </div>
      </section>
    `;
  }

  function renderIdle(s) {
    renderDock("");
    const title = (s.phase === "EndOfGame" || s.phase === "PreEndOfGame")
      ? "Match Completed"
      : "Standing By";
    const detail = (s.phase === "EndOfGame" || s.phase === "PreEndOfGame")
      ? "Full post-game damage and gold telemetry is available on Hypatia Desktop."
      : "Open a League lobby on your PC or toggle Demo mode to control draft from here.";
    return `
      <section class="card">
        <h2 class="h2">${title}</h2>
        <div class="meta">${detail}</div>
      </section>
    `;
  }

  function renderState(s) {
    ui.state = s;
    fireAlertIfNew(s);
    updateAlertChrome();

    document.getElementById("summoner-line").textContent =
      (s.summoner_name || "Hypatia") + " · " + (s.phase || "None");

    const demoBtn = document.getElementById("demo-toggle-btn");
    const demoStrip = document.getElementById("demo-strip");
    if (s.is_demo) {
      demoBtn.style.display = "inline-flex";
      demoStrip.style.display = ui.demoOpen ? "flex" : "none";
      demoStrip.querySelectorAll("[data-phase]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.phase === s.phase);
      });
    } else {
      demoBtn.style.display = "none";
      demoStrip.style.display = "none";
    }

    const activeId = document.activeElement && document.activeElement.id;
    let html = "";
    if (s.phase === "Lobby") html = renderLobby(s);
    else if (s.phase === "Matchmaking") html = renderQueue(s);
    else if (s.phase === "ReadyCheck") html = renderReady(s);
    else if (s.phase === "ChampSelect") html = renderChampSelect(s);
    else if (s.phase === "InProgress") html = renderLive(s);
    else html = renderIdle(s);

    document.getElementById("view-root").innerHTML = html;

    if (activeId === "champ-search" || activeId === "custom-rune-name") {
      const el = document.getElementById(activeId);
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }
  }

  // Global Event Listeners & Delegation
  document.getElementById("alert-top-btn").addEventListener("click", () => armAlerts(true));
  document.getElementById("arm-alerts-btn").addEventListener("click", () => armAlerts(false));
  document.getElementById("refresh-btn").addEventListener("click", fetchState);
  document.getElementById("theme-btn").addEventListener("click", () => {
    applyTheme(ui.theme === "dark" ? "light" : "dark");
  });
  document.getElementById("demo-toggle-btn").addEventListener("click", () => {
    ui.demoOpen = !ui.demoOpen;
    localStorage.setItem("hypatia_demo_open", ui.demoOpen ? "1" : "0");
    if (ui.state) renderState(ui.state);
  });

  document.body.addEventListener("input", (ev) => {
    if (ev.target.id === "champ-search") {
      ui.champQuery = ev.target.value;
      if (ui.state) renderState(ui.state);
    } else if (ev.target.id === "custom-rune-name") {
      ui.customName = ev.target.value;
    }
  });

  document.body.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-action]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.action;

    if (act === "demo-phase") {
      sendCmd({ cmd: "demo_set_phase", phase: btn.dataset.phase });
    } else if (act === "demo-swap") {
      sendCmd({ cmd: "demo_simulate_incoming_swap" });
    } else if (act === "focus-slot") {
      ui.selectingFirstRole = btn.dataset.slot === "1";
      renderState(ui.state);
    } else if (act === "pick-lane") {
      const k = btn.dataset.lane;
      if (ui.selectingFirstRole) {
        if (k === ui.lobbySecond && k !== "FILL") ui.lobbySecond = ui.lobbyFirst;
        ui.lobbyFirst = k;
        ui.selectingFirstRole = false;
      } else {
        if (k === ui.lobbyFirst && k !== "FILL") ui.lobbyFirst = ui.lobbySecond;
        ui.lobbySecond = k;
      }
      renderState(ui.state);
    } else if (act === "save-roles") {
      sendCmd({ cmd: "set_lobby_positions", first: ui.lobbyFirst, second: ui.lobbySecond });
    } else if (act === "start-queue") {
      sendCmd({ cmd: "start_matchmaking" });
    } else if (act === "stop-queue") {
      sendCmd({ cmd: "stop_matchmaking" });
    } else if (act === "accept-ready") {
      sendCmd({ cmd: "accept_ready_check" });
    } else if (act === "decline-ready") {
      sendCmd({ cmd: "decline_ready_check" });
    } else if (act === "cs-tab") {
      ui.csTab = btn.dataset.tab;
      renderState(ui.state);
    } else if (act === "live-tab") {
      ui.liveTab = btn.dataset.tab;
      renderState(ui.state);
    } else if (act === "champ-role") {
      ui.champRole = btn.dataset.role;
      renderState(ui.state);
    } else if (act === "hover-champ") {
      const cs = ui.state && ui.state.champ_select;
      if (cs && cs.active_action) {
        sendCmd({ cmd: "hover_champion", action_id: cs.active_action.action_id, champion_id: Number(btn.dataset.id) });
      }
    } else if (act === "lock-action") {
      sendCmd({ cmd: "lock_action", action_id: Number(btn.dataset.actionId) });
    } else if (act === "set-skin") {
      sendCmd({ cmd: "set_skin", skin_id: Number(btn.dataset.id) });
    } else if (act === "focus-spell-slot") {
      ui.spellSlot = Number(btn.dataset.slot);
      renderState(ui.state);
    } else if (act === "swap-spells") {
      const cs = ui.state && ui.state.champ_select;
      if (cs) sendCmd({ cmd: "set_summoner_spells", spell1_id: cs.spell2_id, spell2_id: cs.spell1_id });
    } else if (act === "pick-spell") {
      const cs = ui.state && ui.state.champ_select;
      if (!cs) return;
      const picked = Number(btn.dataset.id);
      let s1 = cs.spell1_id;
      let s2 = cs.spell2_id;
      if (ui.spellSlot === 1) {
        if (picked === s2) s2 = s1;
        s1 = picked;
      } else {
        if (picked === s1) s1 = s2;
        s2 = picked;
      }
      sendCmd({ cmd: "set_summoner_spells", spell1_id: s1, spell2_id: s2 });
    } else if (act === "rune-sub") {
      ui.runeSubView = btn.dataset.mode;
      renderState(ui.state);
    } else if (act === "select-rune-page") {
      if (btn.dataset.isPreset === "1") {
        const perks = btn.dataset.perks.split(",").filter(Boolean).map(Number);
        sendCmd({
          cmd: "save_rune_page",
          name: btn.dataset.name,
          primary_style_id: Number(btn.dataset.pri),
          sub_style_id: Number(btn.dataset.sub),
          selected_perk_ids: perks
        });
      } else {
        sendCmd({ cmd: "select_rune_page", page_id: Number(btn.dataset.id) });
      }
    } else if (act === "rune-pri") {
      ui.customPrimary = Number(btn.dataset.id);
      syncCustomRunesDefaults(ui.state && ui.state.champ_select);
      renderState(ui.state);
    } else if (act === "rune-p") {
      ui.customPerks[Number(btn.dataset.slot)] = Number(btn.dataset.id);
      renderState(ui.state);
    } else if (act === "rune-sub-tree") {
      ui.customSub = Number(btn.dataset.id);
      ui.customSubMeta = [];
      syncCustomRunesDefaults(ui.state && ui.state.champ_select);
      renderState(ui.state);
    } else if (act === "rune-sub-perk") {
      const row = btn.dataset.row;
      const id = Number(btn.dataset.id);
      const existingSameRow = ui.customSubMeta.findIndex(m => m.row === row);
      if (existingSameRow >= 0) {
        ui.customSubMeta[existingSameRow] = { row, id };
      } else {
        ui.customSubMeta = [ui.customSubMeta[1] || ui.customSubMeta[0], { row, id }].filter(Boolean);
      }
      ui.customPerks[4] = ui.customSubMeta[0] ? ui.customSubMeta[0].id : 0;
      ui.customPerks[5] = ui.customSubMeta[1] ? ui.customSubMeta[1].id : 0;
      renderState(ui.state);
    } else if (act === "rune-shard") {
      ui.customPerks[Number(btn.dataset.slot)] = Number(btn.dataset.id);
      renderState(ui.state);
    } else if (act === "save-custom-runes") {
      sendCmd({
        cmd: "save_rune_page",
        name: (ui.customName || "Hypatia Page").trim(),
        primary_style_id: ui.customPrimary,
        sub_style_id: ui.customSub,
        selected_perk_ids: ui.customPerks.slice(0, 9)
      });
    } else if (act === "req-swap" || act === "cancel-swap") {
      const id = Number(btn.dataset.id);
      const k = btn.dataset.kind;
      const prefix = act === "req-swap" ? "request" : "cancel";
      if (k === "position") sendCmd({ cmd: prefix + "_position_swap", swap_id: id });
      else if (k === "pick") sendCmd({ cmd: prefix + "_pick_order_swap", swap_id: id });
      else if (k === "trade") sendCmd({ cmd: prefix + "_champion_trade", trade_id: id });
    } else if (act === "resp-swap") {
      const id = Number(btn.dataset.id);
      const accept = btn.dataset.accept === "1";
      const k = btn.dataset.kind;
      if (k === "position") sendCmd({ cmd: "respond_position_swap", swap_id: id, accept });
      else if (k === "pick") sendCmd({ cmd: "respond_pick_order_swap", swap_id: id, accept });
      else if (k === "trade") sendCmd({ cmd: "respond_champion_trade", trade_id: id, accept });
    }
  });

  fetchState();
  connectWs();
})();
</script>
</body>
</html>
