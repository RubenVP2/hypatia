<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f1116">
<title>Hypatia — Mobile Remote</title>
<style>
@font-face {
  font-family: "Overpass";
  src: url("/fonts/Overpass-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Overpass";
  src: url("/fonts/Overpass-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Overpass";
  src: url("/fonts/Overpass-ExtraBold.ttf") format("truetype");
  font-weight: 800;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Barlow Condensed";
  src: url("/fonts/BarlowCondensed-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Barlow Condensed";
  src: url("/fonts/BarlowCondensed-ExtraBold.ttf") format("truetype");
  font-weight: 800;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Overpass Mono";
  src: url("/fonts/OverpassMono.ttf") format("truetype");
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --shell: #0b0d11;
  --ground: #0f1116;
  --panel: #161922;
  --raised: #1f2430;
  --rule: #262b38;
  --rule-strong: #3c4356;
  --text: #edeff4;
  --muted: #9ca3b5;
  --plate: #edeff4;
  --on-plate: #0f1116;
  --signal: #f5b400;
  --signal-soft: rgba(245, 180, 0, 0.14);
  --signal-text: #ffd24d;
  --blue: #4c8df6;
  --blue-soft: rgba(76, 141, 246, 0.15);
  --red: #f0605a;
  --red-soft: rgba(240, 96, 90, 0.15);
  --green: #45c47f;
  --green-soft: rgba(69, 196, 127, 0.15);
  --lane-top: #e3b341;
  --lane-jgl: #45c47f;
  --lane-mid: #b07cf0;
  --lane-bot: #ef8bb5;
  --danger-soft: rgba(240, 96, 90, 0.15);
  --panel-raised: var(--raised);
  --on-team: #ffffff;
  --on-signal: #0f1116;
  --tap: 44px;
  --radius: 6px;
  --radius-sm: 4px;
  --font-ui: "Overpass", system-ui, sans-serif;
  --font-display: "Barlow Condensed", "Overpass", sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, monospace;
}

[data-theme="light"] {
  --shell: #e5e1d6;
  --ground: #efece3;
  --panel: #faf8f2;
  --raised: #ebe7dc;
  --rule: #d4cfc2;
  --rule-strong: #a59f8f;
  --text: #14171f;
  --muted: #555a66;
  --plate: #14171f;
  --on-plate: #faf8f2;
  --signal: #b87300;
  --signal-soft: rgba(184, 115, 0, 0.12);
  --signal-text: #8a5600;
  --blue: #2664d4;
  --blue-soft: rgba(38, 100, 212, 0.12);
  --red: #c9342e;
  --red-soft: rgba(201, 52, 46, 0.12);
  --green: #1e7f48;
  --green-soft: rgba(30, 127, 72, 0.12);
  --lane-top: #9e6b06;
  --lane-jgl: #217a47;
  --lane-mid: #7842c2;
  --lane-bot: #bf3b75;
  --danger-soft: rgba(201, 52, 46, 0.12);
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

::selection {
  background: var(--signal);
  color: #0f1116;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) var(--ground);
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--ground);
}

::-webkit-scrollbar-thumb {
  background: var(--rule-strong);
  border-radius: var(--radius-sm);
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  caret-color: var(--signal);
}

button, input {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 1px solid var(--rule);
  background: var(--panel);
  border-radius: var(--radius-sm);
  transition: background-color 110ms ease-out, border-color 110ms ease-out, transform 80ms ease-out;
}

button:active:not(:disabled) {
  transform: scale(0.985);
}

button:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}

.icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

/* Header & Navigation */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--shell);
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1 1 0%;
  min-width: 0;
  overflow: hidden;
}

.brand > div {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
}

.brand-mark {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}

.brand-mark.live {
  background: var(--green);
  box-shadow: 0 0 0 3px var(--green-soft);
}

.brand-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.6px;
  line-height: 1.1;
  margin: 0;
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.pill-btn {
  height: var(--tap);
  min-width: var(--tap);
  padding: 0 10px;
  justify-content: center;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius-sm);
}

.pill-btn.active {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--green);
}

.pill-btn.quiet {
  background: var(--raised);
  border-color: var(--rule-strong);
  color: var(--text);
}

.icon-btn {
  width: var(--tap);
  height: var(--tap);
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
}

/* Compact Collapsible Demo Strip */
.demo-strip {
  background: var(--shell);
  border-bottom: 1px solid var(--rule);
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
}

.demo-strip-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.6px;
  flex-shrink: 0;
}

.demo-chip {
  height: 36px;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  background: var(--raised);
  border: 1px solid var(--rule);
}

.demo-chip.active {
  background: var(--plate);
  border-color: var(--plate);
  color: var(--on-plate);
}

/* Main App Container */
.shell-main {
  max-width: 560px;
  margin: 0 auto;
  padding: 12px 14px 96px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Cards & Typography */
.card {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-spotlight {
  background: var(--signal-soft);
  border: 1px solid var(--signal);
}

.card-danger {
  background: var(--danger-soft);
  border: 1px solid var(--red);
}

.card-green {
  background: var(--green-soft);
  border: 1px solid var(--green);
}

.heading-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.3px;
  line-height: 1.1;
}

.h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.3px;
  line-height: 1.15;
}

.meta {
  font-size: 12px;
  color: var(--muted);
}

.mono {
  font-family: var(--font-mono);
}

.timer-readout {
  font-family: var(--font-display);
  font-size: 58px;
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -1px;
  color: var(--text);
  text-align: center;
}

.timer-inline {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  color: var(--text);
}

/* Countdowns warm up at 10 s and turn red at 5 s; the bar drains with the time left. */
.js-clock { transition: color 240ms ease-out; font-variant-numeric: tabular-nums; }
.js-clock.urgent-1 { color: var(--signal-text); }
.js-clock.urgent-2 { color: var(--red); }
.clock-bar {
  height: 3px;
  margin-top: 6px;
  border-radius: var(--radius-sm);
  background: var(--rule);
  overflow: hidden;
}
.clock-bar > i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--text);
  transform-origin: left center;
  transition: transform 1000ms linear, background-color 240ms ease-out;
}
.clock-bar.urgent-1 > i { background: var(--signal); }
.clock-bar.urgent-2 > i { background: var(--red); }

/* Your turn starts: the spotlight border flashes twice, then holds. */
@keyframes turn-flash {
  0% { outline: 2px solid var(--signal); outline-offset: 0; }
  100% { outline: 2px solid transparent; outline-offset: 6px; }
}
.card-spotlight.turn-start { animation: turn-flash 650ms ease-out 2; }

/* Buttons */
.btn-primary {
  height: 48px;
  padding: 0 16px;
  background: var(--signal);
  border: 1px solid var(--signal);
  color: var(--on-signal);
  font-size: 14px;
  font-weight: 800;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
}

.btn-accept {
  height: 58px;
  background: var(--green);
  border: 1px solid var(--green);
  color: #09130d;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.6px;
  border-radius: var(--radius);
  width: 100%;
}

.btn-secondary {
  height: var(--tap);
  padding: 0 12px;
  background: var(--raised);
  border: 1px solid var(--rule-strong);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-danger {
  height: var(--tap);
  padding: 0 12px;
  background: var(--danger-soft);
  border: 1px solid var(--red);
  color: var(--red);
  font-size: 14px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.row-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

/* Role Selection */
.lane-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.lane-card {
  height: 48px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
}

.lane-card.primary {
  background: var(--plate);
  border-color: var(--plate);
  color: var(--on-plate);
}

.lane-card.secondary {
  background: var(--raised);
  border-color: var(--text);
  color: var(--text);
}

.roundel-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--ground);
}

/* Game Icon + Text Badges (100% local LCU cache + crisp vector/monogram fallback) */
.game-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule-strong);
  background: var(--panel-raised);
  overflow: hidden;
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.game-badge.round { border-radius: 50%; }
.game-badge.blue {
  border-color: var(--blue);
  background: var(--blue-soft);
  color: var(--blue);
}
.game-badge.red {
  border-color: var(--red);
  background: var(--red-soft);
  color: var(--red);
}
.game-badge.empty {
  background: var(--panel-raised);
  border-color: var(--rule);
  color: var(--muted);
}
.game-badge img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.game-badge .game-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.game-badge.is-loaded .game-fallback { display: none; }
.game-badge.is-fallback img { display: none; }

/* Persistent Compact Team Draft Strip in Champ Select */
.team-strip {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.team-slots-5 {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}

.slot-mini {
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 6px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
  min-width: 0;
}

.slot-mini.self {
  background: var(--raised);
  border-color: var(--rule-strong);
}

.slot-mini-role {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
}

.slot-mini-champ {
  width: 100%;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ban-groups {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.ban-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}
.ban-side-lbl {
  font-weight: 700;
  min-width: 34px;
}
.ban-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px 2px 3px;
  border-radius: var(--radius-sm);
  background: var(--panel-raised);
  border: 1px solid var(--rule-strong);
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
}
.ban-chip.blue { border-color: var(--blue); }
.ban-chip.red { border-color: var(--red); }

/* Segmented Tabs (no numeric prefixes) */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  background: var(--shell);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 4px;
}

.tabs-2 {
  grid-template-columns: repeat(2, 1fr);
}

.tab-btn {
  height: var(--tap);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  border-radius: var(--radius-sm);
}

.tab-btn.active {
  background: var(--plate);
  border-color: var(--plate);
  color: var(--on-plate);
}

/* Champion Grid & Filter */
.search-input {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  background: var(--ground);
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text);
}

.filter-pills {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.filter-pill {
  height: 40px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  background: var(--ground);
  border: 1px solid var(--rule);
  color: var(--muted);
  white-space: nowrap;
}

.filter-pill.active {
  background: var(--plate);
  border-color: var(--plate);
  color: var(--on-plate);
}

.champ-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(144px, 1fr));
  gap: 7px;
}

.champ-card {
  padding: 7px 8px;
  text-align: left;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.champ-card-meta {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.champ-card.selected {
  background: var(--raised);
  border-color: var(--text);
}

.champ-card-name {
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.champ-card-role {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

/* Skins, Spells, Runes */
.list-col {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.row-card {
  padding: 10px 12px;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
}

.row-card.selected {
  background: var(--raised);
  border-color: var(--text);
}

.spell-pair {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: stretch;
}

.spell-box {
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 9px;
}

.spell-box.active {
  border-color: var(--text);
  background: var(--raised);
}

.perk-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.perk-row.cols-flex {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 6px;
}

.perk-chip {
  min-height: var(--tap);
  height: auto;
  padding: 5px 8px;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.15;
  text-align: left;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  color: var(--text);
}

.perk-chip-lbl {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.obj-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.obj-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px 4px 4px;
  border-radius: var(--radius-sm);
  background: var(--panel-raised);
  border: 1px solid var(--rule-strong);
  font-size: 11px;
  font-weight: 600;
}
.obj-chip.blue { border-color: var(--blue); }
.obj-chip.red { border-color: var(--red); }
.obj-emblem {
  width: 18px;
  height: 18px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--on-team);
  flex-shrink: 0;
}
.obj-emblem.blue { background: var(--blue); }
.obj-emblem.red { background: var(--red); }

.perk-chip.active {
  background: var(--plate);
  border-color: var(--plate);
  color: var(--on-plate);
}

.perk-chip.sub-active {
  background: var(--raised);
  border-color: var(--text);
  color: var(--text);
}

.divider {
  height: 1px;
  background: var(--rule);
  width: 100%;
}

/* Live Match Scoreboard */
.score-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.score-duo {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.score-num {
  font-family: var(--font-display);
  font-size: 46px;
  font-weight: 800;
  line-height: 1;
}

.score-blue { color: var(--blue); }
.score-red { color: var(--red); }

.feed-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 12px;
}

.feed-item:last-child {
  border-bottom: none;
}

.player-live-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
}

.player-live-row.self {
  background: var(--raised);
  border-color: var(--rule-strong);
}

/* Bottom Sticky Action Dock */
.bottom-dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 45;
  background: var(--shell);
  border-top: 1px solid var(--rule);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}

.bottom-dock-inner {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dock-decline {
  height: var(--tap);
  background: transparent;
  border: 1px solid var(--rule-strong);
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
  width: 100%;
}

/* On a narrow phone the alert button keeps its icon and drops its label. */
@media (max-width: 420px) {
  #alert-top-lbl { display: none; }
  /* The live socket keeps state fresh; the brand needs the room more than a manual refresh. */
  #refresh-btn, #summoner-avatar { display: none; }
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  background: var(--plate);
  color: var(--on-plate);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--rule-strong);
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease-out;
}

.toast.visible {
  opacity: 1;
}

.alert-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>

  // --- Running clocks -------------------------------------------------------------------------
  // A clock is rendered once per state push with the seconds it had then; this ticker moves it
  // between pushes so it never freezes. Countdowns escalate at 10 s and 5 s.
  function clockHtml(sec, opts = {}) {
    const dir = opts.down ? -1 : 1;
    const total = opts.total || 0;
    const fmt = opts.fmt || "mmss";
    const cls = opts.cls || "timer-inline";
    const base = Math.max(0, Number(sec) || 0);
    const bar = dir < 0 && total > 0
      ? `<div class="clock-bar js-clock-bar" aria-hidden="true"><i></i></div>` : "";
    return `<div class="js-clock-wrap" data-base="${base}" data-dir="${dir}" data-total="${total}" data-fmt="${fmt}">`
      + `<div class="${cls} js-clock" role="timer" aria-live="off">${fmtClock(base, fmt)}</div>${bar}</div>`;
  }

  function fmtClock(sec, fmt) {
    const n = Math.max(0, Math.round(sec));
    if (fmt === "s") return n + "s";
    return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  }

  function tickClocks() {
    const elapsed = (performance.now() - (ui.stateAt || performance.now())) / 1000;
    document.querySelectorAll(".js-clock-wrap").forEach(w => {
      const dir = Number(w.dataset.dir);
      const base = Number(w.dataset.base);
      const total = Number(w.dataset.total);
      const now = dir < 0 ? Math.max(0, Math.ceil(base - elapsed)) : Math.floor(base + elapsed);
      const label = w.querySelector(".js-clock");
      const text = fmtClock(now, w.dataset.fmt);
      if (label.textContent !== text) label.textContent = text;
      const urgency = dir < 0 ? (now <= 5 ? 2 : (now <= 10 ? 1 : 0)) : 0;
      label.classList.toggle("urgent-1", urgency === 1);
      label.classList.toggle("urgent-2", urgency === 2);
      const bar = w.querySelector(".js-clock-bar");
      if (bar) {
        bar.classList.toggle("urgent-1", urgency === 1);
        bar.classList.toggle("urgent-2", urgency === 2);
        bar.firstElementChild.style.transform = `scaleX(${Math.min(1, now / Math.max(1, total))})`;
      }
    });
  }
  setInterval(tickClocks, 250);

  function parseClock(str) {
    const m = /^(\d+):(\d{2})$/.exec(String(str || "").trim());
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  applyTheme(ui.theme);

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("visible");
    clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(() => el.classList.remove("visible"), 2200);
  }

  function fmtSec(sec) {
    const n = Math.max(0, Math.floor(sec || 0));
    const m = String(Math.floor(n / 60)).padStart(2, "0");
    const s = String(n % 60).padStart(2, "0");
    return m + ":" + s;
  }

  function laneInfo(raw) {
    const lang = activeLang();
    const u = String(raw || "").toUpperCase();
    const alias = u === "JGL" ? "JUNGLE"
      : (u === "MID" ? "MIDDLE"
      : (u === "BOT" ? "BOTTOM"
      : (u === "SUP" || u === "SUPPORT" ? "UTILITY"
      : (u === "FLEX" || u === "NONE" ? "FILL" : u))));
    const item = LANE_META_BASE.find(l => l.key === alias || l.en.toUpperCase() === alias || l.fr.toUpperCase() === alias);
    if (!item) {
      return { key: alias || "FILL", label: u || t("fill"), code: lang === "fr" ? "P" : "F", color: "var(--muted)" };
    }
    return {
      key: item.key,
      label: lang === "fr" ? item.fr : item.en,
      code: lang === "fr" ? item.codeFr : item.codeEn,
      color: item.color
    };
  }

  function spellName(id, fallback) {
    const e = SPELL_NAMES[Number(id)];
    return e ? e[activeLang()] : (fallback || "");
  }

  function styleName(id, fallback) {

    return e ? e[activeLang()] : (fallback || "");
  }

    const d = key === "TOP"
      ? "M5 18V5h13M11 11h8v8h-8z"
      : (key === "JUNGLE"
        ? "M12 3v17M6 9l5 8M18 9l-5 8M4 15l4 5M20 15l-4 5"
        : (key === "MIDDLE"
          ? "M5 19L19 5M5 9V5h4M15 19h4v-4"
          : (key === "BOTTOM"
            ? "M6 19h13V6M5 5h7v7H5z"
            : (key === "UTILITY"
              ? "M4 7h16l-4 7H8zM12 14v6M8 20h8"
              : "M12 3l9 9-9 9-9-9zM12 9v6M9 12h6"))));
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

  function localizedAlert(snap) {
    const lang = activeLang();
    if (!ui.langOverride || lang === ui.serverLang) {
      return { title: snap.alert_title || "", body: snap.alert_body || "" };

    if (snap.alert_kind === "ready_check") {
      return {

      };

      return {

      };
    }
    if (snap.alert_kind === "your_pick") {
      return {
        title: lang === "fr" ? "À vous de choisir !" : "Your turn to PICK!",
        body: t("choosePick")
      };
    }
    if (snap.alert_kind === "incoming_swap") {
      return {
        title: t("incomingReq"),

    }
    return { title: snap.alert_title || "", body: snap.alert_body || "" };

  function objectiveSvg(label, size = 12) {
    const s = String(label || "").toLowerCase();
    let d = "M4 8l8-4 8 4-4 6-4 6-4-6zM8 10l4 3 4-3"; // Drake default
    if (s.includes("baron")) d = "M4 19h16l1-12-5 5-4-8-4 8-5-5z";
    else if (s.includes("elder") || s.includes("ancestral")) d = "M12 3l8 6-4 11H8L4 9zM12 8v8M9 12h6";
    else if (s.includes("herald") || s.includes("héraut")) d = "M4 16l4-9h8l4 9zM9 16v3M15 16v3M12 10l2 3-2 2-2-2z";
    else if (s.includes("grub") || s.includes("larve")) d = "M7 6l3 3-3 3-3-3zM17 6l3 3-3 3-3-3zM12 13l3 3-3 3-3-3z";
    else if (s.includes("tower") || s.includes("turret") || s.includes("tourelle") || s.includes("inhib")) d = "M7 20h10M9 20V8l3-4 3 4v12M8 8h8";
    else if (s.includes("->") || s.includes("→") || s.includes("kill") || s.includes("éliminé") || s.includes("sang")) d = "M5 19L19 5M14 5h5v5M5 5l14 14M10 19H5v-5";
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  }

  function initials(name) {
    const t = String(name || "").trim();
    if (!t || t.startsWith("Selecting") || t.startsWith("Sélection") || t.startsWith("Pending") || t.startsWith("En attente")) return "--";
    const words = t.split(/[^a-zA-Z0-9\u00C0-\u017F]+/).filter(Boolean);
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return t.slice(0, 2).toUpperCase();
  }

  function assetUrl(category, id) {
    const n = Number(id);
    if (!Number.isFinite(n)) return "";
    if (category !== "profile" && n <= 0) return "";
    if (category === "profile" && n < 0) return "";
    const tok = URL_TOKEN ? "?token=" + encodeURIComponent(URL_TOKEN) : "";
    return `/assets/${category}/${Math.trunc(n)}.png${tok}`;
  }

  function gameBadge(category, id, fallbackHtml, opts = {}) {
    const size = opts.size || 28;
    const cls = opts.className || "";
    const fontSz = Math.max(10, Math.round(size * 0.4));
    const url = assetUrl(category, id);
    const cacheKey = `${category}/${Math.trunc(Number(id) || 0)}`;
    const missedUntil = window.__hm && window.__hm[cacheKey];
    if (opts.empty || !url || (missedUntil && Date.now() < missedUntil)) {
      return `<span class="game-badge is-fallback ${opts.empty ? "empty" : ""} ${cls}" style="width:${size}px;height:${size}px;font-size:${fontSz}px"><span class="game-fallback">${fallbackHtml}</span></span>`;
    }
    return `<span class="game-badge ${cls}" style="width:${size}px;height:${size}px;font-size:${fontSz}px"><img src="${esc(url)}" data-ak="${esc(cacheKey)}" alt="" loading="lazy" onload="this.parentElement.classList.add('is-loaded')" onerror="this.parentElement.classList.add('is-fallback');(window.__hm=window.__hm||{})[this.dataset.ak]=Date.now()+30000;"><span class="game-fallback">${fallbackHtml}</span></span>`;
  }

  function champBadge(id, name, size = 28, mine = true) {
    const n = String(name || "");
    const hasChamp = Number(id) > 0 || (n && !n.startsWith("Selecting") && !n.startsWith("Sélection") && n !== "Pending" && n !== "En attente");
    return gameBadge("champion", id, esc(initials(name)), {
      size,

  function spellFallbackGlyph(id, name) {
    const map = { 1: "PU", 3: "FA", 4: "SE", 6: "FT", 7: "SO", 11: "CH", 12: "TP", 13: "CL", 14: "EM", 21: "BA", 32: "MQ" };

    const map = { 5008: "+9", 5005: "VA", 5007: "AC", 5010: "VIT", 5001: "PV", 5011: "PV+", 5013: "TÉN" };

  }

  function initAudio() {
    if (!ui.audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ui.audioCtx = new AC();
    }
    if (ui.audioCtx && ui.audioCtx.state === "suspended") {
      ui.audioCtx.resume().catch(() => {});
    }
  }

  function playChime() {
    if (!ui.alertsArmed) return;
    try {
      initAudio();
      if (!ui.audioCtx) return;
      const now = ui.audioCtx.currentTime;
      [660, 880].forEach((freq, idx) => {
        const osc = ui.audioCtx.createOscillator();
        const gain = ui.audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.001, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(ui.audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.26);
      });
    } catch (_) {}
  }

  function armAlerts(isTest) {
    initAudio();
    ui.alertsArmed = true;
    localStorage.setItem("hypatia_alerts", "1");
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission().finally(updateAlertChrome);
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
    updateAlertChrome();
    playChime();
    showToast(isTest ? t("chimeTested") : t("alertsEnabled"));
  }

  function updateAlertChrome() {
    const permGranted = !("Notification" in window) || Notification.permission === "granted";
    const armed = ui.alertsArmed && permGranted;
    const btn = document.getElementById("alert-top-btn");
    const lbl = document.getElementById("alert-top-lbl");
    const card = document.getElementById("alert-setup-card");
    if (armed) {
      btn.className = "pill-btn active";
      lbl.textContent = t("alertsOn");
      card.style.display = "none";
    } else {
      btn.className = "pill-btn";
      lbl.textContent = t("alerts");
      card.style.display = "flex";
    }
  }

  function fireAlertIfNew(snap) {
    if (!snap || !snap.alert_seq || snap.alert_seq <= ui.lastAlertSeq) return;
    const isInitial = ui.lastAlertSeq === 0;
    ui.lastAlertSeq = snap.alert_seq;
    const msg = localizedAlert(snap);
    if (isInitial || !ui.alertsArmed || !msg.title) return;
    playChime();
    if (navigator.vibrate) navigator.vibrate([120, 60, 140]);
    if ("Notification" in window && Notification.permission === "granted") {
      try {
        new Notification(msg.title, { body: msg.body || "", tag: "hypatia-turn" });
      } catch (_) {}
    }
  }

  async function sendCmd(payload) {
    const headers = { "Content-Type": "application/json" };
    if (URL_TOKEN) headers["X-Hypatia-Token"] = URL_TOKEN;
    try {
      const res = await fetch("/api/action", {
        method: "POST",
        headers,
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!res.ok || json.error) {
        showToast(json.error || t("cmdRejected"));
        return;
      }
      if (json.state) renderState(json.state);
    } catch (_) {
      showToast(t("netErr"));
    }
  }

  async function fetchState() {
    const headers = {};
    if (URL_TOKEN) headers["X-Hypatia-Token"] = URL_TOKEN;
    try {
      const q = URL_TOKEN ? "?token=" + encodeURIComponent(URL_TOKEN) : "";
      const res = await fetch("/api/state" + q, { headers });
      if (res.ok) renderState(await res.json());
    } catch (_) {}
  }

  function connectWs() {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const q = URL_TOKEN ? "?token=" + encodeURIComponent(URL_TOKEN) : "";
    const ws = new WebSocket(proto + location.host + "/ws" + q);
    ui.ws = ws;
    ws.onopen = () => {
      document.getElementById("conn-dot").classList.add("live");
    };
    ws.onmessage = (ev) => {
      try {
        renderState(JSON.parse(ev.data));
      } catch (_) {}
    };
    ws.onclose = () => {
      document.getElementById("conn-dot").classList.remove("live");
      document.getElementById("summoner-line").textContent = t("reconnecting");
      setTimeout(connectWs, 1500);
    };
  }

  function renderDock(html) {
    const dock = document.getElementById("bottom-dock");
    const content = document.getElementById("dock-content");
    if (!html) {
      dock.style.display = "none";
      content.innerHTML = "";
    } else {
      dock.style.display = "block";
      content.innerHTML = html;
    }
    const main = document.querySelector(".shell-main");
    if (main) main.style.paddingBottom = (html ? dock.offsetHeight + 16 : 24) + "px";
  }

  function syncCustomRunesDefaults(cs) {
    if (!cs || !cs.rune_trees || !cs.rune_trees.length) return;
    const pTree = cs.rune_trees.find(t => t.id === ui.customPrimary) || cs.rune_trees[0];
    if (ui.customSub === pTree.id) {
      const alt = cs.rune_trees.find(t => t.id !== pTree.id) || cs.rune_trees[0];
      ui.customSub = alt.id;
    }
    const sTree = cs.rune_trees.find(t => t.id === ui.customSub) || cs.rune_trees[1] || pTree;
    const ensureIn = (arr, cur) => (arr && arr.some(x => x.id === cur)) ? cur : (arr && arr[0] ? arr[0].id : 0);
    ui.customPrimary = pTree.id;
    ui.customSub = sTree.id;
    ui.customPerks[0] = ensureIn(pTree.keystones, ui.customPerks[0]);
    ui.customPerks[1] = ensureIn(pTree.slot1, ui.customPerks[1]);
    ui.customPerks[2] = ensureIn(pTree.slot2, ui.customPerks[2]);
    ui.customPerks[3] = ensureIn(pTree.slot3, ui.customPerks[3]);

    const validSubIds = [
      ...(sTree.slot1 || []).map(x => ({ row: "slot1", id: x.id })),
      ...(sTree.slot2 || []).map(x => ({ row: "slot2", id: x.id })),
      ...(sTree.slot3 || []).map(x => ({ row: "slot3", id: x.id }))
    ];
    let pair = ui.customSubMeta.filter(m => validSubIds.some(v => v.id === m.id));
    if (pair.length < 2) {
      const pick1 = sTree.slot1 && sTree.slot1[0] ? { row: "slot1", id: sTree.slot1[0].id } : validSubIds[0];
      const pick2 = sTree.slot2 && sTree.slot2[0] ? { row: "slot2", id: sTree.slot2[0].id } : (validSubIds[1] || pick1);
      pair = [pick1, pick2].filter(Boolean);
    }
    if (pair[0] && pair[1]) {
      ui.customSubMeta = pair;
      ui.customPerks[4] = pair[0].id;
      ui.customPerks[5] = pair[1].id;
    }
  }

  function renderReady(s) {
    const mm = s.matchmaking || {};
    const accepted = mm.player_response === "Accepted";
    const left = mm.ready_check_timer_sec != null ? mm.ready_check_timer_sec : 10;
    // Accept sits in the thumb zone; Decline is a quieter, separate target below it.
    renderDock(accepted ? "" : `
      <button class="btn-accept" data-action="accept-ready">${t("acceptMatch")}</button>
      <button class="dock-decline" data-action="decline-ready">${t("decline")}</button>
    `);
    return `
      <section class="card ${accepted ? "card-green" : "card-spotlight" + (ui.turnFlash ? " turn-start" : "")}">
        <div class="heading-row">
          <h2 class="h2">${accepted ? t("matchAccepted") : t("matchFound")}</h2>
          ${clockHtml(left, { down: true, total: Math.max(10, left), fmt: "s" })}
        </div>
        <div class="meta">${accepted ? t("waitingOthers") : t("acceptBefore")}</div>
      </section>
    `;
  }

  function renderChampSelect(s) {
    const cs = s.champ_select;
    if (!cs) {
      renderDock("");
      return `<section class="card"><h2 class="h2">${t("champSelect")}</h2><div class="meta">${t("syncDraft")}</div></section>`;
    }
    syncCustomRunesDefaults(cs);
    const act = cs.active_action;
    const isTurn = Boolean(act && act.is_my_turn && !act.completed);
    const isBan = Boolean(act && act.action_type === "ban");
    const actVerb = isBan ? t("actBan") : t("actPick");

    // Persistent compact team strip with role emblems, portraits, names, and ban chips
    const myBans = cs.my_team_bans || [];
    const myBanIds = cs.my_team_ban_ids || [];
    const theirBans = cs.their_team_bans || [];
    const theirBanIds = cs.their_team_ban_ids || [];
    const banChips = (names, ids, mine) => names.length
      ? names.map((n, i) => `<span class="ban-chip ${mine ? "blue" : "red"}">${champBadge(ids[i] || 0, n, 18, mine)}<span>${esc(n)}</span></span>`).join("")
      : `<span>${t("none")}</span>`;

    const teamStrip = `
      <div class="team-strip" aria-label="${esc(t("teamStripAria"))}">

            return `<div class="slot-mini ${a.is_self ? "self" : ""}">
              <div class="slot-mini-role" style="color:${role.color}">${laneSvg(role.key, 12)}<span>${esc(role.code)}</span></div>
              ${champBadge(a.champion_id, a.champion_name, 26, true)}

            </div>`;
          }).join("")}
        </div>
        <div class="ban-groups">
          <div class="ban-row"><span class="ban-side-lbl" style="color:var(--blue)">${t("blueSide")}</span>${banChips(myBans, myBanIds, true)}</div>
          <div class="ban-row"><span class="ban-side-lbl" style="color:var(--red)">${t("redSide")}</span>${banChips(theirBans, theirBanIds, false)}</div>

    // Thumb-zone dock: the four tabs, plus the lock button while it is your turn.

    if (isTurn && act) {

          <div class="champ-grid">
            ${filtered.map(c => `

        <section class="card">

                    <div style="min-width:0">
                      <div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pg.name)}</div>
                      <div class="meta">${esc(pStyle)} + ${esc(sStyle)} · ${esc(pg.keystone_name)}</div>
                    </div>
                  </div>
                  <span class="meta mono">${pg.current ? t("activeTag") : (pg.is_preset ? t("presetTag") : t("equipTag"))}</span>
                </button>`;
              }).join("")}
            </div>
          ` : `
            <div class="list-col">
              <input id="custom-rune-name" class="search-input" type="text" value="${esc(ui.customName)}" placeholder="${esc(t("runeNamePh"))}">
              <div class="meta mono">${t("priPath")}</div>
              <div class="perk-row cols-flex">
                ${(cs.rune_trees || []).map(tr => {
                  const tname = styleName(tr.id, tr.name);

                      ${gameBadge("perk", o.id, esc(initials(o.name)), { size: 20, className: "round" })}
                      <span class="perk-chip-lbl">${esc(o.name)}</span>

      return `<section class="card"><h2 class="h2">${t("liveMatch")}</h2><div class="meta">${t("waitingLive")}</div></section>`;

    const list = ui.liveTab === "allies" ? (lg.allies || []) : (lg.enemies || []);

            <span class="score-num score-blue">${lg.my_kills}</span>
            <span class="meta mono" style="font-size:22px">:</span>
            <span class="score-num score-red">${lg.enemy_kills}</span>
          </div>
          <div style="text-align:right">
            ${parseClock(lg.clock) != null ? clockHtml(parseClock(lg.clock), { cls: "timer-inline" }) : `<div class="timer-inline">${esc(lg.clock)}</div>`}
            <div class="meta mono">${esc(t("towers", lg.my_towers, lg.enemy_towers))}</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="heading-row">
          <div style="display:flex;align-items:center;gap:10px;min-width:0">
            ${champBadge(lg.active_champion_id, lg.active_champion, 42, true)}
            <div>
              <div style="font-weight:800;font-size:18px">${esc(lg.active_champion)} · ${esc(t("lvl", lg.level))}</div>
              <div class="meta">${lg.cs} CS · ${esc(t("gold", lg.current_gold))}</div>
            </div>
          </div>
          <span class="pill-btn quiet mono" style="font-size:12px">${esc(lg.kda)}</span>
        </div>
      </section>

      ${(lg.objectives || []).length ? `<section class="card">
        <h3 class="h3">${t("objectives")}</h3>
        <div class="obj-strip">
          ${(lg.objectives || []).map(o => `
            <span class="obj-chip ${o.mine ? "blue" : "red"}">
              <span class="obj-emblem ${o.mine ? "blue" : "red"}">${objectiveSvg(o.label, 12)}</span>
              <span>${esc(o.label)}</span>
            </span>
          `).join("")}
        </div>
      </section>` : ""}

      ${(lg.feed || []).length ? `<section class="card">
        <h3 class="h3">${t("recentEvents")}</h3>
        <div>
          ${lg.feed.map(f => `
            <div class="feed-item">
              <span class="meta mono" style="width:42px;flex-shrink:0">${esc(f.time)}</span>
              <span style="display:inline-flex;color:${f.side === 0 ? "var(--red)" : (f.side === 1 ? "var(--blue)" : "var(--muted)")};flex-shrink:0">${objectiveSvg(f.text, 14)}</span>
              <span style="color:${f.side === 0 ? "var(--red)" : "var(--text)"};font-weight:600">${esc(f.text)}</span>
            </div>
          `).join("")}
        </div>
      </section>` : ""}

      <section class="card">
        <div class="list-col">
          ${list.map(p => {
            const role = laneInfo(p.lane);
            const mine = ui.liveTab === "allies";
            return `<div class="player-live-row ${p.is_self ? "self" : ""}">
              <div style="display:flex;align-items:center;gap:10px;min-width:0">
                ${champBadge(p.champion_id, p.champion, 34, mine)}
                <div style="min-width:0">
                  <div style="font-weight:800">${esc(p.champion)} ${p.is_self ? t("youTag") : ""}</div>
                  <div class="meta" style="display:flex;align-items:center;gap:5px">
                    <span style="display:inline-flex;align-items:center;gap:3px;color:${role.color}">${laneSvg(role.key, 12)}<span>${esc(role.label)}</span></span>
                    <span>· ${p.dead ? `<span style="color:var(--red);font-weight:700">${esc(t("respawn", p.respawn_sec))}</span>` : `${esc(t("lvl", p.level))} · ${p.cs} CS`}</span>
                  </div>
                </div>
              </div>
              <span class="mono" style="font-weight:700">${esc(p.kda)}</span>
            </div>`;
          }).join("")}
        </div>
      </section>
    `;
  }

  function renderIdle(s) {
    renderDock("");
    const eog = s.phase === "EndOfGame" || s.phase === "PreEndOfGame";
    return `
      <section class="card">
        <h2 class="h2">${eog ? t("matchCompleted") : t("standingBy")}</h2>
        <div class="meta">${eog ? t("eogDetail") : t("idleDetail")}</div>
      </section>
    `;
  }

  function renderState(s) {
    if (s && (s.lang === "fr" || s.lang === "en")) {
      if (ui.lastServerLang && ui.lastServerLang !== s.lang) {
        ui.langOverride = "";
        localStorage.removeItem("hypatia_lang_override");
      }
      ui.serverLang = s.lang;
      ui.lastServerLang = s.lang;
      localStorage.setItem("hypatia_last_server_lang", s.lang);
    }
    ui.state = s;
    ui.stateAt = performance.now();
    const turnNow = s.phase === "ReadyCheck"
      || Boolean(s.champ_select && s.champ_select.active_action
        && s.champ_select.active_action.is_my_turn && !s.champ_select.active_action.completed);
    ui.turnFlash = turnNow && !ui.wasTurn;
    ui.wasTurn = turnNow;
    applyStaticChrome();
    fireAlertIfNew(s);

    document.getElementById("summoner-line").textContent =
      (s.summoner_name || "Hypatia") + " · " + phaseLabel(s.phase);
    const avatarKey = `${s.profile_icon_id || 0}:${s.summoner_name || ""}`;
    if (ui.lastAvatarKey !== avatarKey) {
      ui.lastAvatarKey = avatarKey;
      const avEl = document.getElementById("summoner-avatar");
      if (avEl) {
        avEl.innerHTML = gameBadge("profile", s.profile_icon_id || 0, esc(initials(s.summoner_name || "HY")), { size: 28 });
      }
    }

    const demoBtn = document.getElementById("demo-toggle-btn");
    const demoStrip = document.getElementById("demo-strip");
    if (s.is_demo) {
      demoBtn.style.display = "inline-flex";
      demoStrip.style.display = ui.demoOpen ? "flex" : "none";
      demoStrip.querySelectorAll("[data-phase]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.phase === s.phase);
      });
    } else {
      demoBtn.style.display = "none";
      demoStrip.style.display = "none";
    }

    const activeId = document.activeElement && document.activeElement.id;
    let html = "";
    if (s.phase === "Lobby") html = renderLobby(s);
    else if (s.phase === "Matchmaking") html = renderQueue(s);
    else if (s.phase === "ReadyCheck") html = renderReady(s);
    else if (s.phase === "ChampSelect") html = renderChampSelect(s);
    else if (s.phase === "InProgress") html = renderLive(s);
    else html = renderIdle(s);

    // Rebuilding the view must not throw the player back to the top mid-draft.
    const scrollY = window.scrollY;
    document.getElementById("view-root").innerHTML = html;
    window.scrollTo(0, scrollY);
    tickClocks();

    if (activeId === "champ-search" || activeId === "custom-rune-name") {
      const el = document.getElementById(activeId);
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }
  }

  // Global Event Listeners & Delegation
  document.getElementById("alert-top-btn").addEventListener("click", () => armAlerts(true));
  document.getElementById("arm-alerts-btn").addEventListener("click", () => armAlerts(false));
  document.getElementById("refresh-btn").addEventListener("click", fetchState);
  document.getElementById("theme-btn").addEventListener("click", () => {
    applyTheme(ui.theme === "dark" ? "light" : "dark");
  });
  document.getElementById("lang-btn").addEventListener("click", () => {
    const next = activeLang() === "fr" ? "en" : "fr";
    if (next === ui.serverLang) {
      ui.langOverride = "";
      localStorage.removeItem("hypatia_lang_override");
    } else {
      ui.langOverride = next;
      localStorage.setItem("hypatia_lang_override", next);
    }
    applyStaticChrome();
    if (ui.state) renderState(ui.state);
    showToast(t("langSwitched"));
  });
  document.getElementById("demo-toggle-btn").addEventListener("click", () => {
    ui.demoOpen = !ui.demoOpen;
    localStorage.setItem("hypatia_demo_open", ui.demoOpen ? "1" : "0");
    if (ui.state) renderState(ui.state);
  });

  document.body.addEventListener("input", (ev) => {
    if (ev.target.id === "champ-search") {
      ui.champQuery = ev.target.value;
      if (ui.state) renderState(ui.state);
    } else if (ev.target.id === "custom-rune-name") {
      ui.customName = ev.target.value;
      ui.customNameEdited = true;
    }
  });

  document.body.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-action]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.action;

    if (act === "demo-phase") {
      sendCmd({ cmd: "demo_set_phase", phase: btn.dataset.phase });
    } else if (act === "demo-swap") {
      sendCmd({ cmd: "demo_simulate_incoming_swap" });
    } else if (act === "focus-slot") {
      ui.selectingFirstRole = btn.dataset.slot === "1";
      renderState(ui.state);
    } else if (act === "pick-lane") {
      const k = btn.dataset.lane;
      if (ui.selectingFirstRole) {
        if (k === ui.lobbySecond && k !== "FILL") ui.lobbySecond = ui.lobbyFirst;
        ui.lobbyFirst = k;
        ui.selectingFirstRole = false;
      } else {
        if (k === ui.lobbyFirst && k !== "FILL") ui.lobbyFirst = ui.lobbySecond;
        ui.lobbySecond = k;
      }
      renderState(ui.state);
    } else if (act === "save-roles") {
      sendCmd({ cmd: "set_lobby_positions", first: ui.lobbyFirst, second: ui.lobbySecond });
    } else if (act === "start-queue") {
      sendCmd({ cmd: "start_matchmaking" });
    } else if (act === "stop-queue") {
      sendCmd({ cmd: "stop_matchmaking" });
    } else if (act === "accept-ready") {
      sendCmd({ cmd: "accept_ready_check" });
    } else if (act === "decline-ready") {
      sendCmd({ cmd: "decline_ready_check" });
    } else if (act === "cs-tab") {
      ui.csTab = btn.dataset.tab;
      renderState(ui.state);
    } else if (act === "live-tab") {
      ui.liveTab = btn.dataset.tab;
      renderState(ui.state);
    } else if (act === "champ-role") {
      ui.champRole = btn.dataset.role;
      renderState(ui.state);
    } else if (act === "hover-champ") {
      const cs = ui.state && ui.state.champ_select;
      if (cs && cs.active_action) {
        sendCmd({ cmd: "hover_champion", action_id: cs.active_action.action_id, champion_id: Number(btn.dataset.id) });
      }
    } else if (act === "lock-action") {
      sendCmd({ cmd: "lock_action", action_id: Number(btn.dataset.actionId) });
    } else if (act === "set-skin") {
      sendCmd({ cmd: "set_skin", skin_id: Number(btn.dataset.id) });
    } else if (act === "focus-spell-slot") {
      ui.spellSlot = Number(btn.dataset.slot);
      renderState(ui.state);
    } else if (act === "swap-spells") {
      const cs = ui.state && ui.state.champ_select;
      if (cs) sendCmd({ cmd: "set_summoner_spells", spell1_id: cs.spell2_id, spell2_id: cs.spell1_id });
    } else if (act === "pick-spell") {
      const cs = ui.state && ui.state.champ_select;
      if (!cs) return;
      const picked = Number(btn.dataset.id);
      let s1 = cs.spell1_id;
      let s2 = cs.spell2_id;
      if (ui.spellSlot === 1) {
        if (picked === s2) s2 = s1;
        s1 = picked;
      } else {
        if (picked === s1) s1 = s2;
        s2 = picked;
      }
      sendCmd({ cmd: "set_summoner_spells", spell1_id: s1, spell2_id: s2 });
    } else if (act === "rune-sub") {
      ui.runeSubView = btn.dataset.mode;
      renderState(ui.state);
    } else if (act === "select-rune-page") {
      if (btn.dataset.isPreset === "1") {
        const perks = btn.dataset.perks.split(",").filter(Boolean).map(Number);
        sendCmd({
          cmd: "save_rune_page",
          name: btn.dataset.name,
          primary_style_id: Number(btn.dataset.pri),
          sub_style_id: Number(btn.dataset.sub),
          selected_perk_ids: perks
        });
      } else {
        sendCmd({ cmd: "select_rune_page", page_id: Number(btn.dataset.id) });
      }
    } else if (act === "rune-pri") {
      ui.customPrimary = Number(btn.dataset.id);
      syncCustomRunesDefaults(ui.state && ui.state.champ_select);
      renderState(ui.state);
    } else if (act === "rune-p") {
      ui.customPerks[Number(btn.dataset.slot)] = Number(btn.dataset.id);
      renderState(ui.state);
    } else if (act === "rune-sub-tree") {
      ui.customSub = Number(btn.dataset.id);
      ui.customSubMeta = [];
      syncCustomRunesDefaults(ui.state && ui.state.champ_select);
      renderState(ui.state);
    } else if (act === "rune-sub-perk") {
      const row = btn.dataset.row;
      const id = Number(btn.dataset.id);
      const existingSameRow = ui.customSubMeta.findIndex(m => m.row === row);
      if (existingSameRow >= 0) {
        ui.customSubMeta[existingSameRow] = { row, id };
      } else {
        ui.customSubMeta = [ui.customSubMeta[1] || ui.customSubMeta[0], { row, id }].filter(Boolean);
      }
      ui.customPerks[4] = ui.customSubMeta[0] ? ui.customSubMeta[0].id : 0;
      ui.customPerks[5] = ui.customSubMeta[1] ? ui.customSubMeta[1].id : 0;
      renderState(ui.state);
    } else if (act === "rune-shard") {
      ui.customPerks[Number(btn.dataset.slot)] = Number(btn.dataset.id);
      renderState(ui.state);
    } else if (act === "save-custom-runes") {
      sendCmd({
        cmd: "save_rune_page",
        name: (ui.customName || t("defaultSaveName")).trim(),
        primary_style_id: ui.customPrimary,
        sub_style_id: ui.customSub,
        selected_perk_ids: ui.customPerks.slice(0, 9)
      });
    } else if (act === "req-swap" || act === "cancel-swap") {
      const id = Number(btn.dataset.id);
      const k = btn.dataset.kind;
      const prefix = act === "req-swap" ? "request" : "cancel";
      if (k === "position") sendCmd({ cmd: prefix + "_position_swap", swap_id: id });
      else if (k === "pick") sendCmd({ cmd: prefix + "_pick_order_swap", swap_id: id });
      else if (k === "trade") sendCmd({ cmd: prefix + "_champion_trade", trade_id: id });
    } else if (act === "resp-swap") {
      const id = Number(btn.dataset.id);
      const accept = btn.dataset.accept === "1";
      const k = btn.dataset.kind;
      if (k === "position") sendCmd({ cmd: "respond_position_swap", swap_id: id, accept });
      else if (k === "pick") sendCmd({ cmd: "respond_pick_order_swap", swap_id: id, accept });
      else if (k === "trade") sendCmd({ cmd: "respond_champion_trade", trade_id: id, accept });
    }
  });

  applyStaticChrome();
  fetchState();
  connectWs();
})();
</script>
</body>
</html>
