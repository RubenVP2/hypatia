name: Release Windows Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.5.0). Defaults to v<Cargo.toml version>.'
        required: false
        default: ''
      draft:
        description: 'Keep GitHub Release as a draft'
        type: boolean
        default: false
      prerelease:
        description: 'Mark GitHub Release as a pre-release'
        type: boolean
        default: false
  # Called by release-plz.yml once the release PR is merged and tagged: a tag pushed
  # with GITHUB_TOKEN does not trigger `push: tags` above.
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag created by release-plz (e.g. v0.6.0).'
        type: string
        required: true
      draft:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false
    secrets:
      MINISIGN_SECRET_KEY:
        description: 'minisign secret key signing the archive for the in-app updater.'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release & Checks
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate release tag against workspace versions
        id: release_info
        shell: bash
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          TAG=$(python3 - <<'PY'
          import os, re, sys, tomllib

          manifests = [
              "crates/shared/Cargo.toml",
              "crates/core/Cargo.toml",
              "crates/desktop/Cargo.toml",
          ]
          versions = {}
          for path in manifests:
              with open(path, "rb") as f:
                  versions[path] = tomllib.load(f)["package"]["version"]

          unique = set(versions.values())
          if len(unique) != 1:
              sys.stderr.write(f"Workspace crate versions mismatch: {versions}\n")
              sys.exit(1)

          crate_ver = next(iter(unique))
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
          elif os.environ.get("INPUT_TAG"):
              tag = os.environ["INPUT_TAG"].strip()
          else:
              tag = f"v{crate_ver}"

          pattern = rf"^v{re.escape(crate_ver)}(-[0-9A-Za-z.-]+)?$"
          if not re.match(pattern, tag):
              sys.stderr.write(
                  f"Release tag '{tag}' does not match Cargo.toml version '{crate_ver}'\n"
              )
              sys.exit(1)

          print(tag)
          PY
          )
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated release tag: $TAG"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny,cargo-audit

      - name: Check dependencies (advisories, licenses, bans, sources)
        run: cargo deny --locked check

      - name: Audit Cargo.lock for RustSec vulnerabilities
        run: cargo audit

      - name: Install gettext tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Read Slint version from Cargo.lock
        id: slint_ver
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "slint"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache slint-tr-extractor
        id: slint_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/slint-tr-extractor
          key: ${{ runner.os }}-slint-tr-extractor-${{ steps.slint_ver.outputs.version }}

      - name: Install slint-tr-extractor
        if: steps.slint_cache.outputs.cache-hit != 'true'
        env:
          SLINT_VERSION: ${{ steps.slint_ver.outputs.version }}
        run: cargo install --locked slint-tr-extractor --version "$SLINT_VERSION"

      - name: Verify Slint i18n template and French catalog
        working-directory: crates/desktop
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          slint-tr-extractor ui/app.slint ui/parts.slint ui/theme.slint ui/stats.slint ui/helper.slint -o "$RUNNER_TEMP/hypatia.pot"
          msgcmp --use-untranslated lang/hypatia.pot "$RUNNER_TEMP/hypatia.pot"
          msgcmp --use-untranslated "$RUNNER_TEMP/hypatia.pot" lang/hypatia.pot
          msgfmt -c -o /dev/null lang/fr/LC_MESSAGES/hypatia.po
          msgcmp lang/fr/LC_MESSAGES/hypatia.po lang/hypatia.pot
          msgcmp --use-untranslated lang/hypatia.pot lang/fr/LC_MESSAGES/hypatia.po
          test -z "$(msgattrib --untranslated lang/fr/LC_MESSAGES/hypatia.po)"
          test -z "$(msgattrib --fuzzy lang/fr/LC_MESSAGES/hypatia.po)"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ubuntu-core

      - name: Run Clippy on shared and core crates
        run: cargo clippy -p hypatia-shared -p hypatia-core --all-targets --locked -- -D warnings

      - name: Run shared and core tests
        run: cargo test -p hypatia-shared -p hypatia-core --locked

  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows

      - name: Run Clippy across workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build Windows release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p hypatia

      - name: Package Windows binary and SHA-256 checksum
        shell: pwsh
        run: |
          $assetName = "hypatia-windows-x86_64.zip"
          $binPath = "target/x86_64-pc-windows-msvc/release/hypatia.exe"
          if (-not (Test-Path $binPath) -or (Get-Item $binPath).Length -le 0) {
            throw "Release binary missing or empty at $binPath"
          }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue staging, dist
          New-Item -ItemType Directory -Force -Path staging, dist | Out-Null
          Copy-Item $binPath staging/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE staging/
          Copy-Item crates/desktop/ui/fonts/OFL.txt staging/FONT-LICENSE-OFL.txt
          Compress-Archive -Path staging/* -DestinationPath "dist/$assetName" -Force
          $hash = (Get-FileHash -Path "dist/$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Resolve-Path dist) "$assetName.sha256"
          [System.IO.File]::WriteAllText($checksumPath, "$hash  $assetName`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload staged release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypatia-windows-x86_64-release
          path: |
            dist/hypatia-windows-x86_64.zip
            dist/hypatia-windows-x86_64.zip.sha256
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout CHANGELOG.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          # Body of the `## [X.Y.Z]` section, up to the next `## [` heading.
          awk -v heading="## [${TAG#v}]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "Release notes for $TAG:"
            cat "$RUNNER_TEMP/release-notes.md"
          else
            echo "::warning::No CHANGELOG.md section for $TAG; falling back to GitHub generated notes."
            rm "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Download staged release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hypatia-windows-x86_64-release
          path: dist

      - name: Verify archive SHA-256 checksum
        working-directory: dist
        run: sha256sum -c hypatia-windows-x86_64.zip.sha256

      # The in-app updater installs only an archive signed by this key for this exact tag
      # (`crates/core/src/update.rs`: RELEASE_PUBLIC_KEY, signed_comment). No key, no release.
      - name: Sign archive for the in-app updater
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "::error::MINISIGN_SECRET_KEY is not set: the in-app updater would refuse this release."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          minisign -S -s "$RUNNER_TEMP/release.key" \
            -m hypatia-windows-x86_64.zip \
            -x hypatia-windows-x86_64.zip.minisig \
            -t "hypatia $TAG hypatia-windows-x86_64.zip" < /dev/null
          rm -f "$RUNNER_TEMP/release.key"
          minisign -V -P "RWSf8L7IkDzI9TxR9cV2mloXM51lq/kH05iBqCUB4Gicu3SnKVgJboiq" \
            -m hypatia-windows-x86_64.zip \
            -x hypatia-windows-x86_64.zip.minisig

      - name: Attest build provenance (public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hypatia-windows-x86_64.zip

      - name: Publish GitHub Release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          EXTRA_FLAGS=()
          if [[ "$INPUT_PRERELEASE" == "true" || "$TAG" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          if [[ "$REF_TYPE" != "tag" ]]; then
            EXTRA_FLAGS+=(--target "$COMMIT_SHA")
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES_FLAGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_FLAGS=(--generate-notes)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Hypatia $TAG" \
              "${NOTES_FLAGS[@]}" \
              --draft \
              "${EXTRA_FLAGS[@]}"
          fi

          gh release upload "$TAG" \
            dist/hypatia-windows-x86_64.zip \
            dist/hypatia-windows-x86_64.zip.sha256 \
            dist/hypatia-windows-x86_64.zip.minisig \
            --clobber

          if [[ "$INPUT_DRAFT" != "true" ]]; then
            gh release edit "$TAG" --draft=false
          fi

          {
            echo "### Release $TAG"
            echo ""
            echo "- Asset: \`hypatia-windows-x86_64.zip\`"
            echo "- SHA-256: \`$(cat dist/hypatia-windows-x86_64.zip.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
