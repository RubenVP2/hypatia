[package]
name = "hypatia"
version = "0.5.0"
edition = "2021"
description = "Local, read-only League of Legends companion"

[dependencies]
hypatia-core = { path = "../core" }
hypatia-shared = { path = "../shared" }
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
