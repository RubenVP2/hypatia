name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de version (ex: v0.1.0). Si vide, extrait de Cargo.toml'
        required: false
        default: ''
      draft:
        description: 'Créer en tant que brouillon (draft)'
        type: boolean
        default: false
      prerelease:
        description: 'Marquer comme pré-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-web:
    name: Build Frontend (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: 'latest'

      - name: Build WebAssembly frontend
        run: |
          cd crates/web
          trunk build --release

      - name: Upload WASM dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/web/dist/
          retention-days: 1

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: hypatia-server.exe
            asset_name: hypatia-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: hypatia-server
            asset_name: hypatia-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: hypatia-server
            asset_name: hypatia-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: hypatia-server
            asset_name: hypatia-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/web/dist

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native server binary
        run: cargo build --release --target ${{ matrix.target }} -p hypatia-server

      - name: Package Windows binary (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" staging/
          Copy-Item README.md staging/
          Copy-Item DESIGN.md staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.asset_name }}"
          Get-FileHash -Path "${{ matrix.asset_name }}" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding utf8 "${{ matrix.asset_name }}.sha256"

      - name: Package Unix binary (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" staging/
          cp README.md DESIGN.md staging/
          cd staging
          tar -czvf "../${{ matrix.asset_name }}" *
          cd ..
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload packaged release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 1

  create-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION=$(grep '^version =' crates/server/Cargo.toml | head -1 | awk -F'"' '{print $2}')
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Selected Release Tag: $TAG"

      - name: List Release Assets
        shell: bash
        run: |
          ls -lah release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Hypatia ${{ steps.release_info.outputs.tag }}
          files: release-assets/*
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
