[package]
name = "hypatia-core"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
hypatia-shared = { path = "../shared" }
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tracing = "0.1"
base64 = "0.22"
anyhow = "1.0"
axum = { version = "0.8", default-features = true, features = ["ws"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
sysinfo = "0.40"
netstat2 = "0.11"
# Already linked by Slint at runtime with these formats: preparing client artwork adds no weight.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.14"
