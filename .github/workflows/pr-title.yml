name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main that release-plz
# turns into a CHANGELOG.md entry. Enforce Conventional Commits so nothing is dropped.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      # Reads only the PR metadata; never checks out PR code.
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            ci
            build
            chore
            style
