<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#070b12">
<meta name="color-scheme" content="dark light">
<title>Hypatia — Mobile Remote</title>
<style>
@font-face { font-family: "Overpass"; src: url("/fonts/Overpass-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Overpass"; src: url("/fonts/Overpass-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Overpass"; src: url("/fonts/Overpass-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("/fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("/fonts/BarlowCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Overpass Mono"; src: url("/fonts/OverpassMono.ttf") format("truetype"); font-weight: 400 700; font-display: swap; }

/* Hextech tokens: the same values as Theme in crates/desktop/ui/theme.slint. */
:root {
  --shell: #070b12;
  --ground: #0b111b;
  --backdrop: #05080d;
  --panel: #111926;
  --raised: #182334;
  --rule: #223047;
  --rule-strong: #53462c;
  --text: #eef0f5;
  --muted: #9aa7bd;
  --plate: #edeff4;
  --on-plate: #0f1116;
  --signal: #f5b400;
  --signal-soft: rgba(245, 180, 0, 0.16);
  --signal-text: #ffd24d;
  --on-signal: #0f1116;
  --gold: #6e5730;
  --gold-bright: #c8aa6e;
  --accent: #0ac8b9;
  --accent-soft: rgba(10, 200, 185, 0.14);
  --green: #45c47f;
  --green-soft: rgba(69, 196, 127, 0.16);
  --danger: #f0605a;
  --danger-soft: rgba(240, 96, 90, 0.16);
  --blue: #3b9eff;
  --blue-soft: rgba(59, 158, 255, 0.16);
  --red: #f0605a;
  --red-soft: rgba(240, 96, 90, 0.16);
  --lane-top: #e3b341;
  --lane-jgl: #45c47f;
  --lane-mid: #b07cf0;
  --lane-bot: #ef8bb5;
  --glass: rgba(11, 17, 27, 0.74);
  --glass-strong: rgba(7, 11, 18, 0.88);
  --glass-row: rgba(5, 8, 13, 0.58);
  --glass-line: rgba(200, 170, 110, 0.30);
  --bevel: rgba(200, 170, 110, 0.22);
  --veil-a: rgba(7, 11, 18, 0.10);
  --veil-b: rgba(11, 17, 27, 0.55);
  --dmg-phys: #d29a52;
  --dmg-mag: #4fb8e8;
  --dmg-true: #eef0f5;
  --tap: 44px;
  --r: 6px;
  --r-sm: 4px;
  --dock-h: 0px;
  --font-ui: "Overpass", system-ui, sans-serif;
  --font-display: "Barlow Condensed", "Overpass", sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, monospace;
}

[data-theme="light"] {
  --shell: #e4e1d5;
  --ground: #ede9dd;
  --backdrop: #d9d5c8;
  --panel: #f9f7ef;
  --raised: #e6e1d3;
  --rule: #c9c1ad;
  --rule-strong: #99855a;
  --text: #14171f;
  --muted: #525968;
  --plate: #14171f;
  --on-plate: #faf8f2;
  --signal: #b87300;
  --signal-soft: rgba(184, 115, 0, 0.14);
  --signal-text: #8a5600;
  --gold: #8a6d38;
  --gold-bright: #7a5c24;
  --accent: #087c73;
  --accent-soft: rgba(8, 124, 115, 0.12);
  --green: #1e7f48;
  --green-soft: rgba(30, 127, 72, 0.12);
  --danger: #c9342e;
  --danger-soft: rgba(201, 52, 46, 0.12);
  --blue: #1f62c9;
  --blue-soft: rgba(31, 98, 201, 0.12);
  --red: #c9342e;
  --red-soft: rgba(201, 52, 46, 0.12);
  --lane-top: #9e6b06;
  --lane-jgl: #217a47;
  --lane-mid: #7842c2;
  --lane-bot: #bf3b75;
  --glass: rgba(249, 247, 239, 0.84);
  --glass-strong: rgba(237, 233, 221, 0.92);
  --glass-row: rgba(249, 247, 239, 0.70);
  --glass-line: rgba(122, 92, 36, 0.32);
  --bevel: rgba(122, 92, 36, 0.18);
  --veil-a: rgba(237, 233, 221, 0.05);
  --veil-b: rgba(237, 233, 221, 0.62);
  --dmg-phys: #9a5f14;
  --dmg-mag: #1f6fa8;
  --dmg-true: #4c5364;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ground);
  color: var(--text);
  font: 400 15px/1.4 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.icon { width: 20px; height: 20px; flex-shrink: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---- Scene: the player's own splash behind every phase ------------------------------------ */
.scene {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 78vh;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--accent-soft), transparent 70%),
    var(--ground);
}
.scene img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 16%;
  opacity: 0;
  transition: opacity 400ms ease;
}
.scene img.in { opacity: 1; }
.scene.ambient img.in { opacity: 0.7; }
.scene .veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, var(--veil-a) 0%, var(--veil-b) 34%, var(--ground) 92%);
  transition: background-color 400ms ease;
}
.scene.dead .veil { background-color: rgba(120, 14, 18, 0.42); }
.scene.defeat .veil { background-color: rgba(40, 52, 70, 0.55); }
.scene.defeat img { filter: saturate(0.35); }

/* ---- Top bar --------------------------------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top);
  background: var(--glass-strong);
  border-bottom: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
}
.topbar-inner {
  max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px 6px 16px;
  min-height: 56px;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.avatar { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
.avatar .pt { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold-bright); }
.conn-dot {
  position: absolute; right: -1px; bottom: -1px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--muted); border: 2px solid var(--shell);
  transition: background-color 240ms ease;
}
.conn-dot.live { background: var(--green); }
.brand { min-width: 0; }
.brand-title {
  margin: 0;
  font: 800 17px/1 var(--font-display);
  letter-spacing: 0.16em;
  color: var(--gold-bright);
}
.brand-sub {
  margin-top: 3px;
  font-size: 12px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-actions { display: flex; align-items: center; gap: 2px; }
.icon-btn {
  width: var(--tap); height: var(--tap);
  display: inline-grid; place-items: center;
  border-radius: var(--r);
  color: var(--muted);
}
.icon-btn:active { background: var(--raised); }
.icon-btn.on { color: var(--accent); }

.menu {
  position: absolute; right: 8px; top: calc(100% + 6px);
  width: 236px;
  padding: 6px;
  background: var(--glass-strong);
  border: 1px solid var(--glass-line);
  border-radius: var(--r);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu-wrap { position: relative; }
.menu-item {
  width: 100%; min-height: var(--tap);
  display: flex; align-items: center; gap: 12px;
  padding: 0 10px;
  border-radius: var(--r-sm);
  text-align: left; font-weight: 600; font-size: 14px;
}
.menu-item:active { background: var(--raised); }
.menu-item .icon { color: var(--muted); }
.menu-item .menu-val { margin-left: auto; font: 700 12px var(--font-mono); color: var(--muted); }
.menu-item.on .menu-val { color: var(--accent); }

.demo-strip {
  position: relative; z-index: 15;
  display: flex; align-items: center; gap: 6px;
  max-width: 560px; margin: 0 auto;
  padding: 8px 16px 0;
  overflow-x: auto; scrollbar-width: none;
}
.demo-strip::-webkit-scrollbar { display: none; }
.demo-label { font: 700 11px var(--font-mono); letter-spacing: 0.1em; color: var(--muted); flex-shrink: 0; }
.demo-chip {
  flex-shrink: 0;
  height: 32px; padding: 0 11px;
  border-radius: 16px;
  border: 1px solid var(--rule);
  background: var(--glass);
  font-size: 12px; font-weight: 600; color: var(--muted);
}
.demo-chip.active { color: var(--text); border-color: var(--text); background: var(--raised); }

/* ---- Shell ---------------------------------------------------------------------------------- */
.shell {
  position: relative; z-index: 1;
  max-width: 560px; margin: 0 auto;
  padding: 12px 16px calc(var(--dock-h) + 24px);
  display: flex; flex-direction: column; gap: 12px;
}
#view-root { display: flex; flex-direction: column; gap: 12px; }
#view-root.enter { animation: enter 260ms ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.panel {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 14px;
  box-shadow: inset 0 1px 0 var(--bevel);
}
.panel.flush { padding: 0; overflow: hidden; }
.eyebrow {
  font: 700 12px/1.2 var(--font-display);
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--gold-bright);
}
.title {
  margin: 2px 0 0;
  font: 800 26px/1.05 var(--font-display);
  letter-spacing: 0.02em; text-transform: uppercase;
}
.title.sm { font-size: 20px; }
.meta { font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.center { text-align: center; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.rule { height: 1px; background: var(--rule); margin: 12px 0; }

/* Spotlight: the player's turn or a ready check. The ring fades out twice, then holds still. */
.spot { border-color: var(--signal); background: linear-gradient(180deg, var(--signal-soft), transparent 70%), var(--glass); }
.spot::after {
  content: ""; position: absolute; inset: -4px;
  border: 2px solid var(--signal); border-radius: 9px;
  opacity: 0; pointer-events: none;
}
.spot.turn-start::after { animation: ring 650ms ease-out 2; }
@keyframes ring { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.025); } }

/* ---- Buttons -------------------------------------------------------------------------------- */
.btn {
  min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 14px;
  border-radius: var(--r-sm);
  font-weight: 800; font-size: 14px;
  letter-spacing: 0.02em;
  transition: transform 120ms ease, opacity 160ms ease;
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; }
.btn-plate { background: var(--plate); color: var(--on-plate); }
.btn-ghost { border: 1px solid var(--rule-strong); background: var(--glass-row); }
.btn-danger { border: 1px solid var(--danger); color: var(--danger); background: var(--danger-soft); }
.btn-sm { min-height: 36px; font-size: 12px; padding: 0 10px; }
.btn-block { width: 100%; }
.btn-signal {
  width: 100%; min-height: 48px;
  background: var(--signal); color: var(--on-signal);
  font: 800 17px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase;
  justify-content: flex-start; padding: 0 12px;
}
.btn-signal .pt { width: 32px; height: 32px; border: 1px solid rgba(0, 0, 0, 0.35); }
.btn-signal .lock-name { margin-left: auto; font-size: 18px; }
.btn-accept {
  width: 100%; min-height: 58px;
  background: var(--green); color: #06130b;
  font: 800 22px var(--font-display); letter-spacing: 0.08em;
}
.btn-quiet { width: 100%; min-height: var(--tap); color: var(--muted); font-weight: 600; font-size: 14px; }
.dock-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }

/* ---- Bottom dock ---------------------------------------------------------------------------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 18;
  background: var(--glass-strong);
  border-top: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
  padding-bottom: env(safe-area-inset-bottom);
}
.dock[hidden] { display: none; }
.demo-strip[hidden] { display: none; }
.dock-inner { max-width: 560px; margin: 0 auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.tab {
  min-height: var(--tap);
  border-radius: var(--r-sm);
  font: 700 14px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted);
  position: relative;
}
.tab.active { background: var(--plate); color: var(--on-plate); }
.tab .tab-dot {
  position: absolute; top: 8px; right: 10px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--signal);
}

.toast {
  position: fixed; left: 50%; z-index: 30;
  bottom: calc(var(--dock-h) + 14px);
  transform: translate(-50%, 10px);
  max-width: calc(100% - 32px);
  padding: 10px 14px;
  background: var(--plate); color: var(--on-plate);
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }

.alert-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.alert-card .icon { color: var(--accent); }
.alert-card[hidden] { display: none; }

/* ---- Portraits and client art ---------------------------------------------------------------- */
.pt {
  position: relative; flex-shrink: 0;
  display: inline-grid; place-items: center;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: var(--raised);
  border: 1px solid var(--gold);
  color: var(--muted);
  font: 800 12px var(--font-display);
}
.pt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 200ms ease; }
.pt.is-loaded img { opacity: 1; }
.pt.is-fallback img { display: none; }
.pt.is-loaded > span { visibility: hidden; }
.pt.round { border-radius: 50%; }
.pt.self { border: 2px solid var(--gold-bright); }
.pt.enemy { border-color: var(--red); }
.pt.empty { border-style: dashed; border-color: var(--rule-strong); background: transparent; }
.pt.dead img { filter: grayscale(1); opacity: 0.45; }
.pt.struck::after {
  content: ""; position: absolute; left: -10%; right: -10%; top: 50%;
  height: 2px; background: var(--red); transform: rotate(-45deg);
}
.pt.struck img { filter: grayscale(1) brightness(0.7); }
.pt.no-rim { border: 0; background: transparent; }

.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 260ms ease; }
.art.is-loaded { opacity: 1; }

.roundel {
  width: 26px; height: 26px; flex-shrink: 0;
  display: inline-grid; place-items: center;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  background: var(--glass-strong);
}
.roundel.lg { width: 38px; height: 38px; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px;
  border-radius: 10px;
  font: 700 11px var(--font-mono); letter-spacing: 0.04em;
  border: 1px solid var(--rule-strong); color: var(--muted);
  white-space: nowrap;
}
.tag.gold { border-color: var(--gold-bright); color: var(--gold-bright); }
.tag.signal { border-color: var(--signal); color: var(--signal-text); background: var(--signal-soft); }
.tag.accent { border-color: var(--accent); color: var(--accent); }
.tag.red { border-color: var(--red); color: var(--red); }

/* ---- Clocks ------------------------------------------------------------------------------------ */
.js-clock-wrap { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.clock { font: 800 40px/0.9 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.5px; transition: color 240ms ease; }
.clock.specimen { font-size: 56px; letter-spacing: -1px; }
.clock.inline { font-size: 22px; }
.u1 .js-clock { color: var(--signal-text); }
.u2 .js-clock { color: var(--danger); }
.drain { width: 72px; height: 3px; background: var(--rule); overflow: hidden; border-radius: 2px; }
.drain i { display: block; height: 100%; background: var(--text); transform-origin: left center; transition: background-color 240ms ease; }
.u1 .drain i { background: var(--signal); }
.u2 .drain i { background: var(--danger); }

/* ---- Lobby ------------------------------------------------------------------------------------- */
.role-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 8px; }
.role-slot {
  display: flex; align-items: center; gap: 10px;
  min-height: 64px; padding: 10px;
  border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--glass-row); text-align: left;
}
.role-slot.focus { border-color: var(--gold-bright); box-shadow: inset 0 0 0 1px var(--gold-bright); }
.role-slot .slot-k { font: 700 11px var(--font-mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.role-slot .slot-v { font: 800 20px/1.1 var(--font-display); text-transform: uppercase; }
.lane-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.lane-btn {
  position: relative;
  min-height: 62px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--glass-row);
  font-size: 13px; font-weight: 600;
}
.lane-btn.chosen { border-color: var(--text); background: var(--raised); }
.lane-btn .rank {
  position: absolute; top: 5px; right: 6px;
  font: 800 12px var(--font-display); color: var(--gold-bright);
}

/* ---- Queue and ready check medallion -------------------------------------------------------- */
.hero-center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 22px 14px; }
.dial { position: relative; width: 210px; height: 210px; margin: 10px 0 4px; display: grid; place-items: center; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dial-track { fill: none; stroke: var(--rule); stroke-width: 2; }
.dial-ticks { fill: none; stroke: var(--gold); stroke-width: 6; stroke-dasharray: 0.6 3.566; }
.dial-inner { fill: none; stroke: var(--gold-bright); stroke-width: 1; opacity: 0.6; }
.dial .js-clock-wrap { align-items: center; }

.medal { position: relative; width: 236px; height: 236px; margin: 6px auto 4px; display: grid; place-items: center; }
.medal .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.medal .ring-track { fill: none; stroke: var(--rule); stroke-width: 6; }
.medal .ring-fill {
  fill: none; stroke: var(--signal); stroke-width: 6;
  stroke-dasharray: 100; stroke-linecap: butt;
  transition: stroke-dashoffset 250ms linear, stroke 240ms ease;
}
.medal .ring-notch { fill: none; stroke: var(--shell); stroke-width: 8; stroke-dasharray: 0.5 9.5; }
.u2 .ring-fill { stroke: var(--danger); }
.medal.accepted .ring-fill { stroke: var(--accent); stroke-dashoffset: 0 !important; }
.medal.declined .ring-fill { stroke: var(--danger); stroke-dashoffset: 0 !important; }
.medal-core {
  position: relative;
  width: 192px; height: 192px; border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #1c3346, #070b12 72%);
  border: 2px solid var(--gold);
  display: grid; place-items: center;
}
.medal-core::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(5, 8, 13, 0.15), rgba(5, 8, 13, 0.62)); }
.medal-num { position: relative; z-index: 1; font: 800 72px/1 var(--font-display); color: #eef0f5; font-variant-numeric: tabular-nums; }
.medal .js-clock-wrap { position: absolute; inset: 0; display: grid; place-items: center; }
.medal .js-clock-wrap > * { grid-area: 1 / 1; }
.medal-mark { position: relative; z-index: 1; width: 72px; height: 72px; }
.medal.accepted .medal-mark { color: var(--accent); }
.medal.declined .medal-mark { color: var(--danger); }

/* ---- Champion select: header plate and draft board ------------------------------------------- */
.plate-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.board { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.ally {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  min-height: 52px; padding: 6px 10px 6px 8px;
  border-radius: var(--r-sm);
  background: var(--glass-row);
  border-left: 3px solid transparent;
}
.ally .banner {
  position: absolute; top: 0; right: 0; bottom: 0; width: 72%;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 55%);
  mask-image: linear-gradient(90deg, transparent, #000 55%);
  overflow: hidden;
  opacity: 0; transition: opacity 300ms ease;
}
.ally .banner img { width: 100%; height: 100%; object-fit: cover; }
.ally.hover .banner { opacity: 0.4; }
.ally.locked .banner { opacity: 1; }
.ally.dead .banner { opacity: 0.1; }
.ally > :not(.banner):not(.glint) { position: relative; }
.ally.self { border-left-color: var(--gold-bright); }
.ally.acting { border-left-color: var(--signal); }
.ally-name { font: 800 17px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.ally-sub { font-size: 12px; color: var(--muted); }
.ally.locked .ally-sub, .ally.hover .ally-sub { color: #d8dce6; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
[data-theme="light"] .ally.locked .ally-sub, [data-theme="light"] .ally.hover .ally-sub { color: var(--muted); text-shadow: none; }
[data-theme="light"] .ally-name { text-shadow: none; }
.ally .side { margin-left: auto; display: flex; gap: 3px; align-items: center; }
.glint {
  position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
  background: linear-gradient(100deg, transparent, rgba(255, 236, 190, 0.38), transparent);
  opacity: 0; pointer-events: none;
}
.ally.locked .glint { animation: glint 700ms ease-out 1; }
@keyframes glint { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(520%); } }

.board-foot { display: flex; flex-direction: column; gap: 6px; padding: 8px 6px 4px; }
.strip { display: flex; align-items: center; gap: 5px; min-width: 0; }
.strip-lbl { width: 54px; flex-shrink: 0; font: 700 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.strip-lbl.blue { color: var(--blue); }
.strip-lbl.red { color: var(--red); }
.strip .gap { width: 6px; }

/* Champion grid */
.search {
  width: 100%; height: var(--tap);
  padding: 0 12px 0 38px;
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--backdrop) url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%239aa7bd' stroke-width='2' xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-4-4'/%3E%3C/svg%3E") no-repeat 12px center / 17px;
  font-size: 15px;
}
.search:focus { outline: none; border-color: var(--gold-bright); }
.field { width: 100%; height: var(--tap); padding: 0 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--backdrop); }
.field:focus { outline: none; border-color: var(--gold-bright); }
.pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px -14px 12px; padding: 0 14px; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0;
  height: 36px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--rule); border-radius: 18px;
  background: var(--glass-row);
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.pill.active { border-color: var(--text); color: var(--text); background: var(--raised); }
.champ-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 10px 6px; }
.champ {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  min-width: 0;
}
.champ .pt { width: 100%; height: auto; aspect-ratio: 1; border-color: var(--rule); }
.champ.sel .pt { border: 2px solid var(--gold-bright); box-shadow: 0 0 0 2px rgba(200, 170, 110, 0.25); }
.champ-name { width: 100%; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.champ.sel .champ-name { color: var(--text); }
.champ:disabled { opacity: 0.32; }
.empty-note { padding: 18px 4px; text-align: center; color: var(--muted); font-size: 13px; }

/* Skin carousel */
.carousel {
  display: flex; gap: 10px;
  overflow-x: auto; scroll-snap-type: x mandatory;
  margin: 0 -14px; padding: 2px 14px 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.carousel::-webkit-scrollbar { display: none; }
.skin {
  position: relative; flex: 0 0 84%;
  aspect-ratio: 16 / 10;
  scroll-snap-align: center;
  border-radius: var(--r);
  overflow: hidden;
  border: 1px solid var(--rule);
  background: linear-gradient(160deg, var(--raised), var(--backdrop));
  text-align: left;
}
.skin .art { object-position: 50% 18%; }
.skin::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(5, 8, 13, 0.85)); }
.skin-label { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.skin-name { font: 800 20px/1.05 var(--font-display); text-transform: uppercase; color: #eef0f5; letter-spacing: 0.02em; }
.skin.sel { border: 2px solid var(--gold-bright); }
.skin .tag { background: rgba(5, 8, 13, 0.6); }
.carousel-foot { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
.carousel-foot i { width: 6px; height: 6px; border-radius: 50%; background: var(--rule-strong); }
.carousel-foot i.on { background: var(--gold-bright); }

/* Loadout */
.spell-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.spell-slot {
  display: flex; align-items: center; gap: 10px;
  min-height: 60px; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--glass-row); text-align: left;
}
.spell-slot.focus { border-color: var(--gold-bright); box-shadow: inset 0 0 0 1px var(--gold-bright); }
.slot-k { font: 700 11px var(--font-mono); letter-spacing: 0.08em; color: var(--muted); }
/* ---- Champ-select helper (Guide tab): build, lane, comps, tips ------------------------------- */
.hl-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.hl-champ { font: 800 22px/1.05 var(--font-display); letter-spacing: 0.02em; }
.hl-row { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 0; border-top: 1px solid var(--rule); }
.hl-head + .hl-row { border-top: 0; }
.hl-k { width: 64px; flex-shrink: 0; font: 700 11px var(--font-mono); letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.hl-items { display: flex; gap: 8px; flex: 1; min-width: 0; }
.hl-item { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.hl-item .meta { font-size: 11px; width: 100%; text-align: center; }
.tag.online { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.hl-link { font: 700 12px var(--font-ui); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; min-height: var(--tap); display: inline-flex; align-items: center; }
.hl-apply { display: flex; justify-content: flex-end; padding: 0 0 8px; }
.dmg { margin-top: 10px; }
.dmg-top { display: flex; justify-content: space-between; gap: 8px; font: 700 11px var(--font-mono); }
.dmg-top .blue { color: var(--blue); } .dmg-top .red { color: var(--red); }
.dmg-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--raised); margin-top: 5px; }
.dmg-bar i { display: block; height: 100%; }
.dmg-bar .p { background: var(--dmg-phys); } .dmg-bar .m { background: var(--dmg-mag); } .dmg-bar .t { background: var(--dmg-true); }
.dmg-bar.none { border: 1px solid var(--rule); background: transparent; }
.traits { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.trait { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--r-sm); border: 1px solid var(--rule); background: var(--glass-row); font-size: 12px; font-weight: 700; }
.trait.gap { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.dmg-key { display: flex; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--muted); }
.dmg-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.tips { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tips li { position: relative; padding-left: 14px; font-size: 13px; line-height: 1.4; }
.tips li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold-bright); }
.hl-hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
.chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 10px; }
.chip-grid.three { grid-template-columns: repeat(3, 1fr); }
.chip {
  min-height: var(--tap);
  display: flex; align-items: center; gap: 7px;
  padding: 5px 8px;
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--glass-row);
  font-size: 12px; font-weight: 600; text-align: left;
  min-width: 0;
}
.chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
.chip.active { border-color: var(--text); background: var(--raised); }
.chip.sub-active { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.seg button { min-height: 34px; padding: 0 12px; border-radius: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
.seg button.active { background: var(--plate); color: var(--on-plate); }
.page-row {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  min-height: 56px; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--glass-row); text-align: left;
}
.page-row.current { border-color: var(--text); background: var(--raised); }
.sub-k { margin: 12px 0 6px; font: 700 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Team tab */
.mate { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r); background: var(--glass-row); border: 1px solid var(--rule); }
.mate.self { border-color: var(--gold); }
.swap-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

/* ---- Live game ---------------------------------------------------------------------------------- */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; border-radius: var(--r); overflow: hidden; border: 1px solid var(--rule); }
.hud-side { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.hud-side.blue { background: linear-gradient(90deg, rgba(59, 158, 255, 0.34), rgba(59, 158, 255, 0.12)); }
.hud-side.red { background: linear-gradient(270deg, rgba(240, 96, 90, 0.34), rgba(240, 96, 90, 0.12)); justify-content: flex-end; }
.score { font: 800 46px/0.9 var(--font-display); font-variant-numeric: tabular-nums; }
.hud-side.blue .score { color: var(--blue); }
.hud-side.red .score { color: var(--red); }
[data-theme="light"] .hud-side.blue .score, [data-theme="light"] .hud-side.red .score { filter: none; }
.towers { display: inline-flex; align-items: center; gap: 3px; font: 700 13px var(--font-mono); color: var(--muted); }
.hud-clock {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 8px 14px;
  background: var(--glass-strong);
  border-left: 1px solid var(--gold); border-right: 1px solid var(--gold);
}
.hud-clock .js-clock-wrap { align-items: center; }
.hud-mode { font: 700 11px var(--font-mono); color: var(--muted); letter-spacing: 0.06em; }
.me { display: flex; align-items: center; gap: 12px; }
.me .pt { width: 60px; height: 60px; }
.me-name { font: 800 24px/1 var(--font-display); text-transform: uppercase; }
.me-kda { margin-left: auto; text-align: right; }
.me-kda b { display: block; font: 800 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stats-line { display: flex; gap: 14px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.stats-line b { color: var(--text); font-weight: 700; }
.death { border-color: var(--danger); background: linear-gradient(180deg, var(--danger-soft), transparent), var(--glass); }
.death .js-clock-wrap { align-items: flex-end; }
.death .clock { color: var(--danger); }
.obj-strip { display: flex; flex-wrap: wrap; gap: 6px; }
.obj { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px; border-radius: 15px; font-size: 12px; font-weight: 600; border: 1px solid; }
.obj.blue { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
.obj.red { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.feed-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 13px; }
.feed-item:first-child { border-top: 0; }
.feed-t { width: 40px; flex-shrink: 0; font: 600 12px var(--font-mono); color: var(--muted); }
.kda-txt, .respawn-chip { padding: 2px 7px; border-radius: 3px; background: var(--glass-strong); }
.kda-txt { font: 700 14px var(--font-mono); font-variant-numeric: tabular-nums; }
.respawn-chip { font: 800 16px var(--font-display); color: var(--danger); }

/* ---- Results ------------------------------------------------------------------------------------ */
.result { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 14px 16px; }
.crest { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
.crest svg { position: absolute; width: 112px; height: 112px; }
.crest .art.is-loaded + svg { display: none; }
.crest .art { object-fit: contain; }
.result-title { margin-top: 6px; font: 800 46px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
.result.victory .result-title { color: var(--gold-bright); }
.result.defeat .result-title { color: #a9b4c4; }
[data-theme="light"] .result.defeat .result-title { color: #5b6574; }
.result.victory .crest { color: var(--gold-bright); }
.result.defeat .crest { color: #8693a6; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile { padding: 10px 8px; border-radius: var(--r); background: var(--glass); border: 1px solid var(--rule); text-align: center; }
.tile b { display: block; font: 800 24px/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { font: 700 11px var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.tile.wide { grid-column: span 3; display: flex; align-items: baseline; justify-content: center; gap: 10px; }
.tile.wide b { font-size: 34px; }
.team-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 4px 6px; }

/* ---- Mode switch (Match | Stats), last row of the dock --------------------------------------- */
.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--glass-row); }
.mode-btn {
  min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 3px;
  font: 700 13px var(--font-display); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
}
.mode-btn .icon { width: 17px; height: 17px; }
.mode-btn.active { background: var(--raised); border-color: var(--text); color: var(--text); }

/* ---- Stats tab: Champion Stats, read-only ---------------------------------------------------- */
.st-hero { display: flex; align-items: center; gap: 12px; }
.st-name { font: 800 28px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
.st-links { display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; }
.hl-link .ext { width: 13px; height: 13px; margin-left: 5px; flex-shrink: 0; }
.st-rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.st-rate { padding: 7px 4px 6px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--glass-row); text-align: center; min-width: 0; }
.st-rate b { display: block; font: 800 19px/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
.st-rate span { font: 700 10px var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.st-roles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; }
.st-roles.six { grid-template-columns: repeat(6, 1fr); }
.st-role {
  min-height: 48px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--glass-row);
  font-size: 11px; font-weight: 700; color: var(--muted);
}
.st-role span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.st-role.active { border-color: var(--text); background: var(--raised); color: var(--text); }
.st-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; border: 1px solid var(--rule); border-radius: var(--r-sm); margin-top: 10px; }
.st-seg button { min-height: 40px; border-radius: 3px; border: 1px solid transparent; font-size: 13px; font-weight: 700; color: var(--muted); }
.st-seg button.active { background: var(--raised); border-color: var(--text); color: var(--text); }
.st-state { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.st-state .icon { width: 18px; height: 18px; margin-top: 1px; }
.st-state b { display: block; color: var(--text); font-size: 14px; }
.skel { display: block; height: 12px; margin: 10px 0; border-radius: 3px; background: var(--raised); }
.skel.w70 { width: 70%; } .skel.w40 { width: 40%; }
.rp { padding: 12px 0 2px; border-top: 1px solid var(--rule); }
.rp:first-of-type { border-top: 0; padding-top: 0; }
.rp-head { display: flex; align-items: center; gap: 8px; }
.rp-key { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.rp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.rp-cols .stack { gap: 6px; min-width: 0; }
.perk { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; font-weight: 600; }
.perk > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-style { display: flex; align-items: center; gap: 5px; font: 700 11px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.rp-style span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shards { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.stage { padding: 10px 0 4px; border-top: 1px solid var(--rule); }
.stage:first-of-type { border-top: 0; padding-top: 0; }
.stage-head { display: flex; flex-direction: column; gap: 2px; }
.stage-items { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 4px; margin-top: 8px; }
.it { width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.it .meta { width: 100%; font-size: 10.5px; line-height: 1.15; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.chev { width: 12px; height: 40px; display: grid; place-items: center; color: var(--gold-bright); }
.prio { display: flex; align-items: center; gap: 6px; margin-top: 8px; font: 800 22px/1 var(--font-display); }
.prio .chev { height: auto; color: var(--muted); }
.prio .r { color: var(--gold-bright); }
.skill-grid { display: grid; grid-template-columns: 20px repeat(15, minmax(0, 1fr)); gap: 2px; margin-top: 12px; }
.sk-k { display: grid; place-items: center; font: 800 13px var(--font-display); color: var(--muted); }
.sk { aspect-ratio: 1; display: grid; place-items: center; border-radius: 2px; border: 1px solid var(--rule); background: var(--glass-row); font: 700 9px var(--font-mono); color: transparent; }
.sk.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.sk.on.r { border-color: var(--gold-bright); background: rgba(200, 170, 110, 0.18); color: var(--gold-bright); }
.st-row {
  width: 100%; min-height: 54px;
  display: flex; align-items: center; gap: 10px;
  padding: 6px 2px;
  border-top: 1px solid var(--rule);
  text-align: left;
}
.st-row:first-of-type { border-top: 0; }
.st-row:active { background: var(--raised); }
.st-rank { width: 22px; flex-shrink: 0; text-align: right; font: 600 12px var(--font-mono); color: var(--muted); }
.tier-badge { width: 28px; height: 28px; flex-shrink: 0; display: grid; place-items: center; border-radius: var(--r-sm); border: 1px solid var(--rule-strong); font: 800 17px var(--font-display); color: var(--muted); }
.tier-badge.S { color: var(--gold-bright); border-color: var(--gold-bright); background: rgba(200, 170, 110, 0.16); }
.tier-badge.A { color: var(--accent); border-color: var(--accent); }
.tier-badge.B { color: var(--text); border-color: var(--rule-strong); }
.st-fig { flex-shrink: 0; text-align: right; }
.st-fig b { display: block; font: 700 15px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.st-fig span { font: 600 11px var(--font-mono); color: var(--muted); white-space: nowrap; }
.st-nm { font-weight: 700; font-size: 15px; }
.mu-bar { display: block; position: relative; height: 5px; margin-top: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.mu-bar i { position: absolute; top: 0; bottom: 0; }
.mu-bar i.blue { left: 50%; background: var(--blue); }
.mu-bar i.red { right: 50%; background: var(--red); }
.mu-bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--text); opacity: 0.55; }
.res { display: inline-grid; place-items: center; min-width: 44px; height: 22px; padding: 0 6px; border-radius: var(--r-sm); border: 1px solid; font: 700 11px var(--font-mono); letter-spacing: 0.04em; }
.res.win { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
.res.loss { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.kit { display: flex; align-items: center; gap: 3px; margin-top: 5px; }
.st-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.st-tiles .tile.wide b { font-size: 30px; }

@media (max-width: 360px) {
  .clock.specimen { font-size: 48px; }
  .score { font-size: 38px; }
  .medal { width: 210px; height: 210px; }
  .medal-core { width: 170px; height: 170px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    return s > 0 && Math.floor(s / 1000) === Number(champId) ? s : Number(champId) || 0;
  }

  // ---- Scene: the player's own splash full-bleed behind the phase ----------------------------
  function sceneFor(s) {
    if (s.phase === "ChampSelect" && s.champ_select) {
      const cs = s.champ_select;
      const me = (cs.my_team || []).find(a => a.is_self);
      const act = cs.active_action;
      let champ = me && me.champion_id > 0 ? me.champion_id : 0;
      if (!champ && act && act.is_my_turn && act.action_type !== "ban") champ = act.champion_id || 0;
      if (champ > 0) return { cat: "splash", id: skinFor(cs.selected_skin_id, champ), mode: "" };
    }
    if (s.phase === "InProgress" && s.live_game) {
      const lg = s.live_game;
      const me = (lg.allies || []).find(p => p.is_self);
      const champ = (me && me.champion_id) || lg.active_champion_id;
      if (champ > 0) return { cat: "splash", id: skinFor(me && me.skin_id, champ), mode: me && me.dead ? "dead" : "" };
    }
    if (s.end_of_game && s.end_of_game.champion_id > 0) {
      const e = s.end_of_game;
      return { cat: "splash", id: skinFor(e.skin_id, e.champion_id), mode: isDefeat(e) ? "defeat" : "" };
    }
    return { cat: "art", id: ART.backdrop, mode: "ambient" };
  }
  /**
   * Shows the scene's splash, or the client's valley backdrop when that splash is not cached.
   * One image per scene: a state push for the same scene does nothing.
   */
  function setScene(sc) {
    const el = $("scene");
    const usable = c => assetUrl(c.cat, c.id) && !missed(`${c.cat}/${c.id}`);
    const target = sc.cat !== "art" && !usable(sc) ? { cat: "art", id: ART.backdrop } : sc;
    el.classList.toggle("dead", sc.mode === "dead");
    el.classList.toggle("defeat", sc.mode === "defeat");
    el.classList.toggle("ambient", target.cat === "art");
    const key = `${target.cat}/${target.id}`;
    if (key === ui.sceneKey) return;
    ui.sceneKey = key;
    const img = new Image();
    const dropOthers = () => el.querySelectorAll("img").forEach(o => {
      if (o === img) return;
      o.classList.remove("in");
      setTimeout(() => o.remove(), 450);
    });
    if (!usable(target)) { dropOthers(); return; }
    img.alt = "";
    img.decoding = "async";
    img.onload = () => {
      if (ui.sceneKey !== key) { img.remove(); return; }
      requestAnimationFrame(() => img.classList.add("in"));
      dropOthers();
    };
    img.onerror = () => {
      imgMiss[key] = Date.now() + 30000;
      img.remove();
      if (ui.sceneKey === key) { ui.sceneKey = ""; setScene(sc); }
    };
    img.src = assetUrl(target.cat, target.id);
    el.insertBefore(img, el.querySelector(".veil"));
  }

  // ---- Alerts ---------------------------------------------------------------------------------
  function initAudio() {
    if (!ui.audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ui.audioCtx = new AC();
    }
    if (ui.audioCtx && ui.audioCtx.state === "suspended") ui.audioCtx.resume().catch(() => {});
  }
  function playChime() {
    if (!ui.alertsArmed) return;
    try {
      initAudio();
      if (!ui.audioCtx) return;
      const now = ui.audioCtx.currentTime;
      [660, 880].forEach((freq, idx) => {
        const osc = ui.audioCtx.createOscillator();
        const gain = ui.audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.001, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(ui.audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.26);
      });
    } catch (_) {}
  }
  function armAlerts(isTest) {
    initAudio();
    ui.alertsArmed = true;
    store.set("hypatia_alerts", "1");
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission().finally(updateAlertChrome);
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    updateAlertChrome();
    playChime();
    showToast(isTest ? t("chimeTested") : t("alertsEnabled"));
  }
  function updateAlertChrome() {
    const permGranted = !("Notification" in window) || Notification.permission === "granted";
    const armed = ui.alertsArmed && permGranted;
    const btn = $("alert-top-btn");
    btn.classList.toggle("on", armed);
    btn.setAttribute("aria-label", `${t("alerts")} · ${armed ? t("alertsOn") : t("alertsOff")}`);
    $("alerts-menu-val").textContent = armed ? t("alertsOn") : t("alertsOff");
    $("alerts-menu-btn").classList.toggle("on", armed);
    $("alert-setup-card").hidden = armed;
  }
  function fireAlertIfNew(snap) {
    if (!snap || !snap.alert_seq || snap.alert_seq <= ui.lastAlertSeq) return;
    const isInitial = ui.lastAlertSeq === 0;
    ui.lastAlertSeq = snap.alert_seq;
    const msg = localizedAlert(snap);
    if (isInitial || !ui.alertsArmed || !msg.title) return;
    playChime();
    if (navigator.vibrate) navigator.vibrate([120, 60, 140]);
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification(msg.title, { body: msg.body || "", tag: "hypatia-turn" }); } catch (_) {}
    }
  }

  // ---- Transport ------------------------------------------------------------------------------
  async function sendCmd(payload) {
    const headers = { "Content-Type": "application/json" };
    if (URL_TOKEN) headers["X-Hypatia-Token"] = URL_TOKEN;
    try {
      const res = await fetch("/api/action", { method: "POST", headers, body: JSON.stringify(payload) });
      const json = await res.json();
      if (!res.ok || json.error) { showToast(json.error || t("cmdRejected")); return; }
      if (json.state) renderState(json.state);
    } catch (_) {
      showToast(t("netErr"));
    }
  }
  async function fetchState() {
    const headers = {};
    if (URL_TOKEN) headers["X-Hypatia-Token"] = URL_TOKEN;
    try {
      const q = URL_TOKEN ? "?token=" + encodeURIComponent(URL_TOKEN) : "";
      const res = await fetch("/api/state" + q, { headers });
      if (res.ok) renderState(await res.json());
    } catch (_) {}
  }
  function connectWs() {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const q = URL_TOKEN ? "?token=" + encodeURIComponent(URL_TOKEN) : "";
    const ws = new WebSocket(proto + location.host + "/ws" + q);
    ui.ws = ws;
    ws.onopen = () => $("conn-dot").classList.add("live");
    ws.onmessage = (ev) => { try { renderState(JSON.parse(ev.data)); } catch (_) {} };
    ws.onclose = () => {
      $("conn-dot").classList.remove("live");
      $("summoner-line").textContent = t("reconnecting");
      setTimeout(connectWs, 1500);
    };
  }

  // ---- DOM morph ------------------------------------------------------------------------------
  // State pushes arrive every second in a draft. Rebuilding the view would reload images, replay
  // the one-shot animations and drop the scroll of carousels; patching the live DOM keeps them.
  const tpl = document.createElement("template");
  function morphInto(root, html) {
    tpl.innerHTML = html;
    morphChildren(root, tpl.content);
  }
  function sameNode(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) return false;
    if (a.nodeType !== 1) return true;
    return (a.getAttribute("data-key") || "") === (b.getAttribute("data-key") || "");
  }
  function morphChildren(from, to) {
    const next = Array.from(to.childNodes);
    for (let i = 0; i < next.length; i++) {
      const nb = next[i];
      const na = from.childNodes[i];
      if (!na) from.appendChild(nb);
      else if (sameNode(na, nb)) morphNode(na, nb);
      else from.replaceChild(nb, na);
    }
    while (from.childNodes.length > next.length) from.removeChild(from.lastChild);
  }
  function morphNode(a, b) {
    if (a.nodeType !== 1) {
      if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
      return;
    }
    if (a.nodeName === "IMG" && a.getAttribute("src") === b.getAttribute("src")) return;
    for (const attr of Array.from(a.attributes)) if (!b.hasAttribute(attr.name)) a.removeAttribute(attr.name);
    for (const attr of Array.from(b.attributes)) if (a.getAttribute(attr.name) !== attr.value) a.setAttribute(attr.name, attr.value);
    if (a.nodeName === "INPUT") {
      const v = b.getAttribute("value") || "";
      if (document.activeElement !== a && a.value !== v) a.value = v;
      return;
    }
    morphChildren(a, b);
  }

  // ---- Champion select ------------------------------------------------------------------------
  function syncCustomRunesDefaults(cs) {
    if (!cs || !cs.rune_trees || !cs.rune_trees.length) return;
    const pTree = cs.rune_trees.find(x => x.id === ui.customPrimary) || cs.rune_trees[0];
    if (ui.customSub === pTree.id) {
      const alt = cs.rune_trees.find(x => x.id !== pTree.id) || cs.rune_trees[0];
      ui.customSub = alt.id;
    }
    const sTree = cs.rune_trees.find(x => x.id === ui.customSub) || cs.rune_trees[1] || pTree;
    const ensureIn = (arr, cur) => (arr && arr.some(x => x.id === cur)) ? cur : (arr && arr[0] ? arr[0].id : 0);
    ui.customPrimary = pTree.id;
    ui.customSub = sTree.id;
    ui.customPerks[0] = ensureIn(pTree.keystones, ui.customPerks[0]);
    ui.customPerks[1] = ensureIn(pTree.slot1, ui.customPerks[1]);
    ui.customPerks[2] = ensureIn(pTree.slot2, ui.customPerks[2]);
    ui.customPerks[3] = ensureIn(pTree.slot3, ui.customPerks[3]);
    const validSubIds = [
      ...(sTree.slot1 || []).map(x => ({ row: "slot1", id: x.id })),
      ...(sTree.slot2 || []).map(x => ({ row: "slot2", id: x.id })),
      ...(sTree.slot3 || []).map(x => ({ row: "slot3", id: x.id }))
    ];
    let pair = ui.customSubMeta.filter(m => validSubIds.some(v => v.id === m.id));
    if (pair.length < 2) {
      const pick1 = sTree.slot1 && sTree.slot1[0] ? { row: "slot1", id: sTree.slot1[0].id } : validSubIds[0];
      const pick2 = sTree.slot2 && sTree.slot2[0] ? { row: "slot2", id: sTree.slot2[0].id } : (validSubIds[1] || pick1);
      pair = [pick1, pick2].filter(Boolean);
    }
    if (pair[0] && pair[1]) {
      ui.customSubMeta = pair;
      ui.customPerks[4] = pair[0].id;
      ui.customPerks[5] = pair[1].id;
    }
  }
