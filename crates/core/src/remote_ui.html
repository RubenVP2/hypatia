<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#070b12">
<meta name="color-scheme" content="dark light">
<title>Hypatia — Mobile Remote</title>
<style>
@font-face { font-family: "Overpass"; src: url("/fonts/Overpass-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Overpass"; src: url("/fonts/Overpass-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Overpass"; src: url("/fonts/Overpass-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("/fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("/fonts/BarlowCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Overpass Mono"; src: url("/fonts/OverpassMono.ttf") format("truetype"); font-weight: 400 700; font-display: swap; }

/* Hextech tokens: the same values as Theme in crates/desktop/ui/theme.slint. */
:root {
  --shell: #070b12;
  --ground: #0b111b;
  --backdrop: #05080d;
  --panel: #111926;
  --raised: #182334;
  --rule: #223047;
  --rule-strong: #53462c;
  --text: #eef0f5;
  --muted: #9aa7bd;
  --plate: #edeff4;
  --on-plate: #0f1116;
  --signal: #f5b400;
  --signal-soft: rgba(245, 180, 0, 0.16);
  --signal-text: #ffd24d;
  --on-signal: #0f1116;
  --gold: #6e5730;
  --gold-bright: #c8aa6e;
  --accent: #0ac8b9;
  --accent-soft: rgba(10, 200, 185, 0.14);
  --green: #45c47f;
  --on-green: #06130b;
  --green-soft: rgba(69, 196, 127, 0.16);
  --danger: #f0605a;
  --danger-soft: rgba(240, 96, 90, 0.16);
  --blue: #3b9eff;
  --blue-soft: rgba(59, 158, 255, 0.16);
  --red: #f0605a;
  --red-soft: rgba(240, 96, 90, 0.16);
  --lane-top: #e3b341;
  --lane-jgl: #45c47f;
  --lane-mid: #b07cf0;
  --lane-bot: #ef8bb5;
  --glass: rgba(11, 17, 27, 0.74);
  --glass-strong: rgba(7, 11, 18, 0.88);
  --glass-row: rgba(5, 8, 13, 0.58);
  --glass-line: rgba(200, 170, 110, 0.30);
  --bevel: rgba(200, 170, 110, 0.22);
  --veil-a: rgba(7, 11, 18, 0.10);
  --veil-b: rgba(11, 17, 27, 0.55);
  --dmg-phys: #d29a52;
  --dmg-mag: #4fb8e8;
  --dmg-true: #eef0f5;
  --tap: 44px;
  --r: 6px;
  --r-sm: 4px;
  --dock-h: 0px;
  --font-ui: "Overpass", system-ui, sans-serif;
  --font-display: "Barlow Condensed", "Overpass", sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, monospace;
}

[data-theme="light"] {
  --shell: #e4e1d5;
  --ground: #ede9dd;
  --backdrop: #d9d5c8;
  --panel: #f9f7ef;
  --raised: #e6e1d3;
  --rule: #c9c1ad;
  --rule-strong: #99855a;
  --text: #14171f;
  --muted: #525968;
  --plate: #14171f;
  --on-plate: #faf8f2;
  --signal: #b87300;
  --signal-soft: rgba(184, 115, 0, 0.14);
  --signal-text: #8a5600;
  --gold: #8a6d38;
  --gold-bright: #7a5c24;
  --accent: #087c73;
  --accent-soft: rgba(8, 124, 115, 0.12);
  --green: #1e7f48;
  --on-green: #faf8f2;
  --green-soft: rgba(30, 127, 72, 0.12);
  --danger: #c9342e;
  --danger-soft: rgba(201, 52, 46, 0.12);
  --blue: #1f62c9;
  --blue-soft: rgba(31, 98, 201, 0.12);
  --red: #c9342e;
  --red-soft: rgba(201, 52, 46, 0.12);
  --lane-top: #9e6b06;
  --lane-jgl: #217a47;
  --lane-mid: #7842c2;
  --lane-bot: #bf3b75;
  --glass: rgba(249, 247, 239, 0.84);
  --glass-strong: rgba(237, 233, 221, 0.92);
  --glass-row: rgba(249, 247, 239, 0.70);
  --glass-line: rgba(122, 92, 36, 0.32);
  --bevel: rgba(122, 92, 36, 0.18);
  --veil-a: rgba(237, 233, 221, 0.05);
  --veil-b: rgba(237, 233, 221, 0.62);
  --dmg-phys: #9a5f14;
  --dmg-mag: #1f6fa8;
  --dmg-true: #4c5364;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ground);
  color: var(--text);
  font: 400 15px/1.4 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.icon { width: 20px; height: 20px; flex-shrink: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---- Scene: the player's own splash behind every phase ------------------------------------ */
.scene {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 78vh;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--accent-soft), transparent 70%),
    var(--ground);
}
.scene img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 16%;
  opacity: 0;
  transition: opacity 400ms ease;
}
.scene img.in { opacity: 1; }
.scene.ambient img.in { opacity: 0.7; }
.scene .veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, var(--veil-a) 0%, var(--veil-b) 34%, var(--ground) 92%);
  transition: background-color 400ms ease;
}
.scene.dead .veil { background-color: rgba(120, 14, 18, 0.42); }
.scene.defeat .veil { background-color: rgba(40, 52, 70, 0.55); }
.scene.defeat img { filter: saturate(0.35); }

/* ---- Top bar + 5-step Hextech phase rail ---------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top);
  background: var(--glass-strong);
  border-bottom: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
}
.topbar-inner {
  max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 5px 8px 5px 14px;
  min-height: 52px;
}
.phase-rail {
  max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px;
  padding: 0 14px 4px;
}
.phase-rail[hidden] { display: none; }
.phase-rail i {
  display: block; height: 3px; border-radius: 2px;
  background: var(--rule);
  transition: background-color 240ms ease;
}
.phase-rail i.done { background: var(--gold-bright); }
.phase-rail i.now { background: var(--signal); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.avatar { position: relative; width: 34px; height: 34px; flex-shrink: 0; }
.avatar .pt { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--gold-bright); }
.conn-dot {
  position: absolute; right: -1px; bottom: -1px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--muted); border: 2px solid var(--shell);
  transition: background-color 240ms ease;
}
.conn-dot.live { background: var(--green); }
.brand { min-width: 0; }
.brand-title {
  margin: 0;
  font: 800 17px/1 var(--font-display);
  letter-spacing: 0.16em;
  color: var(--gold-bright);
}
.brand-sub {
  margin-top: 2px;
  font-size: 12px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-actions { display: flex; align-items: center; gap: 2px; }
.icon-btn {
  width: var(--tap); height: var(--tap);
  display: inline-grid; place-items: center;
  border-radius: var(--r);
  color: var(--muted);
}
.icon-btn:active { background: var(--raised); }
.icon-btn.on { color: var(--accent); }

.menu {
  position: absolute; right: 8px; top: calc(100% + 6px);
  width: 236px;
  padding: 6px;
  background: var(--glass-strong);
  border: 1px solid var(--glass-line);
  border-radius: var(--r);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu-wrap { position: relative; }
.menu-item {
  width: 100%; min-height: var(--tap);
  display: flex; align-items: center; gap: 12px;
  padding: 0 10px;
  border-radius: var(--r-sm);
  text-align: left; font-weight: 600; font-size: 14px;
}
.menu-item:active { background: var(--raised); }
.menu-item .icon { color: var(--muted); }
.menu-item .menu-val { margin-left: auto; font: 700 12px var(--font-mono); color: var(--muted); }
.menu-item.on .menu-val { color: var(--accent); }

.demo-strip {
  position: relative; z-index: 15;
  display: flex; align-items: center; gap: 6px;
  max-width: 560px; margin: 0 auto;
  padding: 6px 14px 0;
  overflow-x: auto; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent);
  mask-image: linear-gradient(90deg, #000 92%, transparent);
}
.demo-strip::-webkit-scrollbar { display: none; }
.demo-label { font: 700 11px var(--font-mono); letter-spacing: 0.1em; color: var(--gold-bright); flex-shrink: 0; }
.demo-chip {
  flex-shrink: 0;
  height: 30px; padding: 0 11px;
  border-radius: 15px;
  border: 1px solid var(--rule);
  background: var(--glass);
  font-size: 12px; font-weight: 600; color: var(--muted);
}
.demo-chip.active { color: var(--text); border-color: var(--text); background: var(--raised); }

/* ---- Shell ---------------------------------------------------------------------------------- */
.shell {
  position: relative; z-index: 1;
  max-width: 560px; margin: 0 auto;
  padding: 10px 14px calc(var(--dock-h) + 20px);
  display: flex; flex-direction: column; gap: 10px;
}
#view-root { display: flex; flex-direction: column; gap: 10px; }
#view-root.enter { animation: enter 240ms ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.panel {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 12px 14px;
  box-shadow: inset 0 1px 0 var(--bevel);
}
.panel.flush { padding: 0; overflow: hidden; }
.eyebrow {
  font: 700 12px/1.2 var(--font-display);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold-bright);
}
.title {
  margin: 0;
  font: 800 25px/1.05 var(--font-display);
  letter-spacing: 0.02em; text-transform: uppercase;
}
.title.sm { font-size: 20px; }
.meta { font-size: 12px; color: var(--muted); }
.sub-meta { margin-top: 3px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.center { text-align: center; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.rule { height: 1px; background: var(--rule); margin: 12px 0; }

/* Spotlight: the player's turn or a ready check. The ring fades out twice, then holds still. */
.spot { border-color: var(--signal); background: linear-gradient(180deg, var(--signal-soft), transparent 72%), var(--glass); }
.spot::after {
  content: ""; position: absolute; inset: -4px;
  border: 2px solid var(--signal); border-radius: 9px;
  opacity: 0; pointer-events: none;
}
.spot.turn-start::after { animation: ring 650ms ease-out 2; }
@keyframes ring { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.025); } }

/* ---- Buttons -------------------------------------------------------------------------------- */
.btn {
  min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 14px;
  border-radius: var(--r-sm);
  font-weight: 800; font-size: 14px;
  letter-spacing: 0.02em;
  transition: transform 110ms ease, opacity 160ms ease, border-color 140ms ease;
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; }
.btn-plate { background: var(--plate); color: var(--on-plate); }
.btn-ghost { border: 1px solid var(--rule-strong); background: var(--glass-row); }
.btn-dirty { border-color: var(--gold-bright); color: var(--gold-bright); background: var(--raised); }
.btn-danger { border: 1px solid var(--danger); color: var(--danger); background: var(--danger-soft); }
.btn-sm { min-height: 44px; font-size: 12px; padding: 0 10px; }
.btn-block { width: 100%; }
.btn-signal {
  width: 100%; min-height: 48px;
  background: var(--signal); color: var(--on-signal);
  font: 800 17px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase;
  justify-content: flex-start; padding: 0 12px;
}
.btn-signal .pt { width: 32px; height: 32px; border: 1px solid rgba(0, 0, 0, 0.35); }
.btn-signal .lock-name { margin-left: auto; font-size: 18px; }
.btn-accept {
  width: 100%; min-height: 58px;
  background: var(--green); color: var(--on-green);
  font: 800 22px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
}
.btn-quiet {
  width: 100%; min-height: var(--tap);
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--glass-row);
  color: var(--text); font-weight: 600; font-size: 14px;
}
.dock-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }

/* ---- Bottom dock ---------------------------------------------------------------------------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 18;
  background: var(--glass-strong);
  border-top: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
  padding-bottom: env(safe-area-inset-bottom);
}
.dock[hidden] { display: none; }
.demo-strip[hidden] { display: none; }
.dock-inner { max-width: 560px; margin: 0 auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.tab {
  min-height: 46px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 4px 2px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  font: 700 11px/1.1 var(--font-display); letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--muted);
  position: relative;
  min-width: 0;
}
.tab svg { width: 17px; height: 17px; flex-shrink: 0; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.active { background: var(--plate); color: var(--on-plate); }
.tab .tab-dot {
  position: absolute; top: 5px; right: 8px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--signal);
}

.toast {
  position: fixed; left: 50%; z-index: 30;
  bottom: calc(var(--dock-h) + 14px);
  transform: translate(-50%, 10px);
  max-width: calc(100% - 32px);
  padding: 10px 14px;
  background: var(--plate); color: var(--on-plate);
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }

.alert-card { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; }
.alert-card .icon { color: var(--accent); width: 18px; height: 18px; }
.alert-card[hidden] { display: none; }
.alert-close { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: var(--r-sm); color: var(--muted); flex-shrink: 0; }
.alert-close:active { background: var(--raised); }

/* ---- Portraits and client art ---------------------------------------------------------------- */
.pt {
  position: relative; flex-shrink: 0;
  display: inline-grid; place-items: center;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: var(--raised);
  border: 1px solid var(--gold);
  color: var(--muted);
  font: 800 12px var(--font-display);
}
.pt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 200ms ease; }
.pt.is-loaded img { opacity: 1; }
.pt.is-fallback img { display: none; }
.pt.is-loaded > span { visibility: hidden; }
.pt.round { border-radius: 50%; }
.pt.self { border: 2px solid var(--gold-bright); }
.pt.enemy { border-color: var(--red); }
.pt.empty { border-style: dashed; border-color: var(--rule-strong); background: transparent; }
.pt.dead img { filter: grayscale(1); opacity: 0.45; }
.pt.struck::after {
  content: ""; position: absolute; left: -10%; right: -10%; top: 50%;
  height: 2px; background: var(--red); transform: rotate(-45deg);
}
.pt.struck img { filter: grayscale(1) brightness(0.7); }
.pt.no-rim { border: 0; background: transparent; }

.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 260ms ease; }
.art.is-loaded { opacity: 1; }

.roundel {
  width: 26px; height: 26px; flex-shrink: 0;
  display: inline-grid; place-items: center;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  background: var(--glass-strong);
}
.roundel.lg { width: 38px; height: 38px; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px;
  border-radius: 10px;
  font: 700 11px var(--font-mono); letter-spacing: 0.04em;
  border: 1px solid var(--rule-strong); color: var(--muted);
  white-space: nowrap;
}
.tag.gold { border-color: var(--gold-bright); color: var(--gold-bright); }
.tag.signal { border-color: var(--signal); color: var(--signal-text); background: var(--signal-soft); }
.tag.accent { border-color: var(--accent); color: var(--accent); }
.tag.red { border-color: var(--red); color: var(--red); }

/* ---- Clocks ------------------------------------------------------------------------------------ */
.js-clock-wrap { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.clock { font: 800 40px/0.9 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.5px; transition: color 240ms ease; }
.clock.specimen { font-size: 56px; letter-spacing: -1px; }
.clock.inline { font-size: 22px; }
.u1 .js-clock { color: var(--signal-text); }
.u2 .js-clock { color: var(--danger); }
.drain { width: 72px; height: 3px; background: var(--rule); overflow: hidden; border-radius: 2px; }
.drain i { display: block; height: 100%; background: var(--text); transform-origin: left center; transition: background-color 240ms ease; }
.u1 .drain i { background: var(--signal); }
.u2 .drain i { background: var(--danger); }

/* ---- Lobby ------------------------------------------------------------------------------------- */
.role-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 8px; }
.role-slot {
  display: flex; align-items: center; gap: 10px;
  min-height: 62px; padding: 10px;
  border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--glass-row); text-align: left;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.role-slot.focus { border-color: var(--gold-bright); box-shadow: inset 0 0 0 1px var(--gold-bright); background: var(--raised); }
.role-slot.optional { opacity: 0.55; }
.role-slot .slot-k { font: 700 11px var(--font-mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.role-slot .slot-v { font: 800 20px/1.1 var(--font-display); text-transform: uppercase; }
.lane-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.lane-btn {
  position: relative;
  min-height: 60px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--glass-row);
  font-size: 13px; font-weight: 600;
}
.lane-btn.chosen { border-color: var(--text); background: var(--raised); }
.lane-btn .rank {
  position: absolute; top: 5px; right: 7px;
  font: 800 12px var(--font-display); color: var(--gold-bright);
}

/* ---- Queue and ready check medallion -------------------------------------------------------- */
.hero-center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 18px 14px; }
.dial { position: relative; width: 204px; height: 204px; margin: 8px 0 4px; display: grid; place-items: center; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dial-track { fill: none; stroke: var(--rule); stroke-width: 2; }
.dial-ticks { fill: none; stroke: var(--gold); stroke-width: 6; stroke-dasharray: 0.6 3.566; }
.dial-prog {
  fill: none; stroke: var(--gold-bright); stroke-width: 3;
  stroke-dasharray: 100; transform-origin: 60px 60px; transform: rotate(-90deg);
  transition: stroke-dashoffset 250ms linear;
}
.dial-inner { fill: none; stroke: var(--gold-bright); stroke-width: 1; opacity: 0.45; }
.dial .js-clock-wrap { align-items: center; }
.queue-roles { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 5px 10px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--glass-row); font-size: 12px; font-weight: 700; }

.medal { position: relative; width: 228px; height: 228px; margin: 6px auto 4px; display: grid; place-items: center; }
.medal .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.medal .ring-outer { fill: none; stroke: var(--gold-bright); stroke-width: 2; opacity: 0.72; }
.medal .ring-track { fill: none; stroke: #223047; stroke-width: 7; }
.medal .ring-fill {
  fill: none; stroke: #f5b400; stroke-width: 7;
  stroke-dasharray: 100; stroke-linecap: butt;
  transition: stroke-dashoffset 250ms linear, stroke 240ms ease;
}
.medal .ring-notch { fill: none; stroke: #070b12; stroke-width: 9; stroke-dasharray: 0.65 7.683; }
.u2 .ring-fill { stroke: #f0605a; }
.medal.accepted .ring-fill { stroke: #0ac8b9; stroke-dashoffset: 0 !important; }
.medal.declined .ring-fill { stroke: #f0605a; stroke-dashoffset: 0 !important; }
.medal-core {
  position: relative;
  width: 176px; height: 176px; border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 38%, #1c3346, #070b12 72%);
  border: 2px solid var(--gold-bright);
  display: grid; place-items: center;
}
.medal-core::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(5, 8, 13, 0.14), rgba(5, 8, 13, 0.62)); }
.medal-num { position: relative; z-index: 1; font: 800 66px/0.92 var(--font-display); color: #eef0f5; font-variant-numeric: tabular-nums; margin-top: -12px; }
.medal-sec { position: relative; z-index: 1; font: 700 11px/1 var(--font-mono); letter-spacing: 0.14em; color: #9aa7bd; margin-top: 56px; }
.medal .js-clock-wrap { position: absolute; inset: 0; display: grid; place-items: center; }
.medal .js-clock-wrap > * { grid-area: 1 / 1; }
.medal-mark { position: relative; z-index: 1; width: 68px; height: 68px; }
.medal.accepted .medal-mark { color: #0ac8b9; }
.medal.declined .medal-mark { color: #f0605a; }
.ready-stage { padding: 24px 16px 20px; gap: 8px; }
.ready-stage .title { font-size: 30px; letter-spacing: 0.04em; margin-top: 4px; }

/* ---- Champion select: splash turn header, 1-line 5v5 mirror strip & full board -------------- */
.plate-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cs-turn-plate { display: flex; flex-direction: column; gap: 8px; }
.cs-turn-plate .clock { font-size: 46px; line-height: 0.88; }
.cs-turn-bar { width: 100%; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.cs-turn-bar i { display: block; height: 100%; background: var(--gold-bright); transform-origin: left center; transition: background-color 240ms ease; }
.spot .cs-turn-bar i, .u1 .cs-turn-bar i { background: var(--signal); }
.u2 .cs-turn-bar i { background: var(--danger); }

.draft-hud { padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; }
.draft-mirror {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px;
}
.draft-side { display: flex; align-items: center; gap: 4px; min-width: 0; }
.draft-side.enemy { justify-content: flex-end; }
.draft-vs { font: 800 12px/1 var(--font-display); letter-spacing: 0.08em; color: var(--gold-bright); padding: 0 2px; }
.mirror-pt {
  position: relative;
  width: 28px; height: 28px; flex-shrink: 0;
}
.mirror-pt .pt { width: 28px; height: 28px; border-color: var(--blue); }
.mirror-pt.self .pt { border: 2px solid var(--gold-bright); }
.mirror-pt.acting .pt { border: 2px solid var(--signal); }
.mirror-pt.enemy .pt { border-color: var(--red); }
.mirror-pt.enemy .pt.empty { border-color: var(--rule-strong); border-style: dashed; }
.mirror-pt .lock-pip {
  position: absolute; right: -2px; bottom: -2px; z-index: 2;
  width: 11px; height: 11px; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: var(--gold-bright); color: var(--on-plate);
}
.draft-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding-top: 6px; border-top: 1px solid var(--rule);
  min-width: 0;
}
.draft-mini-group { display: flex; align-items: center; gap: 4px; min-width: 0; flex-wrap: wrap; }
.draft-mini-k { font: 700 11px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.draft-mini-k.blue { color: var(--blue); }
.draft-mini-k.red { color: var(--red); }
.draft-div { width: 1px; height: 14px; background: var(--rule-strong); flex-shrink: 0; margin: 0 2px; }
.draft-toggle {
  min-height: 44px; min-width: 44px;
  margin: -10px -6px -10px 0;
  padding: 0 8px;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  font: 700 11px var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--gold-bright); flex-shrink: 0;
}
.draft-toggle svg { width: 15px; height: 15px; transition: transform 180ms ease; }
.draft-toggle.open svg { transform: rotate(180deg); }

.swap-inline { padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.swap-inline-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 150px; }
.swap-inline-btns { display: flex; gap: 6px; flex-shrink: 0; margin-left: auto; }
.swap-inline-btns .btn { min-height: 44px; padding: 0 12px; font-size: 13px; }

.board { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.ally {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  min-height: 52px; padding: 6px 10px 6px 8px;
  border-radius: var(--r-sm);
  background: var(--glass-row);
  border: 1px solid transparent;
  transition: border-color 180ms ease, background-color 180ms ease, opacity 240ms ease;
}
.ally .banner {
  position: absolute; top: 0; right: 0; bottom: 0; width: 72%;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 55%);
  mask-image: linear-gradient(90deg, transparent, #000 55%);
  overflow: hidden;
  opacity: 0; transition: opacity 300ms ease;
}
.ally .banner img { width: 100%; height: 100%; object-fit: cover; }
.ally.hover .banner { opacity: 0.4; }
.ally.locked .banner { opacity: 1; }
.ally.dead .banner { opacity: 0.1; }
.ally.dead { opacity: 0.58; }
.ally > :not(.banner):not(.glint) { position: relative; }
.ally.self { border-color: var(--gold-bright); }
.ally.acting { border-color: var(--signal); background: var(--signal-soft); }
.ally-name { font: 800 17px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.ally-sub { font-size: 12px; color: var(--muted); }
.ally.locked .ally-sub, .ally.hover .ally-sub { color: #d8dce6; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
[data-theme="light"] .ally.locked .ally-sub, [data-theme="light"] .ally.hover .ally-sub { color: var(--muted); text-shadow: none; }
[data-theme="light"] .ally-name { text-shadow: none; }
.ally .side { margin-left: auto; display: flex; gap: 3px; align-items: center; }
.glint {
  position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
  background: linear-gradient(100deg, transparent, rgba(255, 236, 190, 0.38), transparent);
  opacity: 0; pointer-events: none;
}
.ally.locked .glint { animation: glint 700ms ease-out 1; }
@keyframes glint { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(520%); } }

.board-foot { display: flex; flex-direction: column; gap: 6px; padding: 8px 6px 4px; }
.strip { display: flex; align-items: center; gap: 5px; min-width: 0; flex-wrap: wrap; }
.strip-lbl { width: 54px; flex-shrink: 0; font: 700 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.strip-lbl.blue { color: var(--blue); }
.strip-lbl.red { color: var(--red); }
.strip .gap { width: 6px; }

/* Champion grid */
.search-wrap { position: relative; display: flex; align-items: center; }
.search {
  width: 100%; height: var(--tap);
  padding: 0 42px 0 38px;
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--backdrop) url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%239aa7bd' stroke-width='2' xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-4-4'/%3E%3C/svg%3E") no-repeat 12px center / 17px;
  font-size: 15px;
}
.search:focus { outline: none; border-color: var(--gold-bright); }
.search-clear {
  position: absolute; right: 0; top: 0;
  width: var(--tap); height: var(--tap);
  display: inline-grid; place-items: center;
  color: var(--muted);
}
.search-clear[hidden] { display: none; }
.field { width: 100%; height: var(--tap); padding: 0 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--backdrop); }
.field:focus { outline: none; border-color: var(--gold-bright); }
.pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 8px -14px 10px; padding: 0 14px; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0;
  min-height: var(--tap); padding: 0 12px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--glass-row);
  font-size: 13px; font-weight: 700; color: var(--muted);
}
.pill.active { border-color: var(--text); color: var(--text); background: var(--raised); }
.draft-status {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px; margin-bottom: 10px;
  border-radius: var(--r-sm); border: 1px solid var(--rule-strong); background: var(--glass-row);
}
.draft-status-links { display: flex; gap: 6px; }
.champ-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px 6px; }
.champ {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 0; content-visibility: auto; contain-intrinsic-size: 72px 86px;
}
.champ .pt { width: 100%; height: auto; aspect-ratio: 1; border-color: var(--rule); }
.champ.sel .pt { border: 2px solid var(--gold-bright); box-shadow: 0 0 0 2px rgba(200, 170, 110, 0.25); }
.champ.sel.ban-sel .pt { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(240, 96, 90, 0.28); }
.champ-name { width: 100%; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.champ.sel .champ-name { color: var(--text); font-weight: 700; }
.champ:disabled { opacity: 0.34; }
.empty-note { padding: 18px 4px; text-align: center; color: var(--muted); font-size: 13px; }

/* Skin carousel (86% wide peeking showcase) */
.carousel {
  display: flex; gap: 10px;
  overflow-x: auto; scroll-snap-type: x mandatory;
  margin: 0 -14px; padding: 2px 14px 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.carousel::-webkit-scrollbar { display: none; }
.skin {
  position: relative; flex: 0 0 86%;
  aspect-ratio: 16 / 10;
  scroll-snap-align: center;
  border-radius: var(--r);
  overflow: hidden;
  border: 1px solid var(--rule);
  background: linear-gradient(155deg, var(--raised), var(--backdrop));
  text-align: left;
}
.skin-crest {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--gold); opacity: 0.28;
  pointer-events: none;
}
.skin-crest svg { width: 76px; height: 76px; }
.skin .art { object-position: 50% 18%; z-index: 1; }
.skin::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, transparent 42%, rgba(5, 8, 13, 0.90)); }
.skin-label { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 3; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.skin-name { font: 800 22px/1.02 var(--font-display); text-transform: uppercase; color: #eef0f5; letter-spacing: 0.02em; }
.skin.sel { border: 2px solid var(--gold-bright); }
.skin .tag { background: rgba(5, 8, 13, 0.72); }
.carousel-foot { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
.carousel-foot i { width: 6px; height: 6px; border-radius: 50%; background: var(--rule-strong); }
.carousel-foot i.on { background: var(--gold-bright); }

/* Unified 1-Tap Prep & Loadout */
.prep-sec { padding: 12px 0; border-top: 1px solid var(--rule); }
.prep-sec:first-child { padding-top: 0; border-top: 0; }
.prep-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.prep-sec-head .eyebrow { display: flex; align-items: center; gap: 8px; flex: 1; }
.prep-sec-head .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.spell-duel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
}
.spell-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  min-height: 76px; padding: 8px 6px;
  border-radius: var(--r); border: 1px solid transparent;
  background: transparent; text-align: center;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.spell-btn.focus { border-color: var(--gold-bright); background: var(--raised); }
.spell-btn .pt { width: 48px; height: 48px; border-color: var(--gold); }
.spell-btn-lbl { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; max-width: 100%; }
.spell-swap-orb {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--rule-strong); background: var(--glass-row);
  display: inline-grid; place-items: center; color: var(--text);
  transition: transform 140ms ease, border-color 140ms ease;
}
.spell-swap-orb:active { transform: scale(0.94); border-color: var(--gold-bright); }
.keycap {
  display: inline-grid; place-items: center;
  min-width: 19px; height: 18px; padding: 0 4px;
  border-radius: 3px; border: 1px solid var(--rule-strong); background: var(--backdrop);
  font: 700 11px/1 var(--font-mono); color: var(--gold-bright);
}
.slot-k { font: 700 11px var(--font-mono); letter-spacing: 0.08em; color: var(--muted); }
.rune-strip {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px; margin-bottom: 10px;
  border: 1px solid var(--rule-strong); border-radius: var(--r-sm);
  background: var(--glass-row);
}
.rune-strip .rdiv { width: 1px; height: 22px; background: var(--rule-strong); margin: 0 2px; }
/* ---- Champ-select helper (Guide tab): build, lane, comps, tips ------------------------------- */
.hl-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.hl-champ { font: 800 22px/1.05 var(--font-display); letter-spacing: 0.02em; }
.hl-row { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 0; border-top: 1px solid var(--rule); }
.hl-head + .hl-row { border-top: 0; }
.hl-k { width: 64px; flex-shrink: 0; font: 700 11px var(--font-mono); letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.hl-items { display: flex; gap: 8px; flex: 1; min-width: 0; }
.hl-item { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.hl-item .meta { font-size: 11px; width: 100%; text-align: center; }
.tag.online { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tag.green { border-color: var(--green); color: var(--green); background: var(--green-soft); }
.hl-link { font: 700 12px var(--font-ui); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; min-height: var(--tap); display: inline-flex; align-items: center; }
.hl-apply { display: flex; justify-content: flex-end; padding: 0 0 8px; }
.dmg { margin-top: 10px; }
.dmg-top { display: flex; justify-content: space-between; gap: 8px; font: 700 11px var(--font-mono); }
.dmg-top .blue { color: var(--blue); } .dmg-top .red { color: var(--red); }
.dmg-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--raised); margin-top: 5px; }
.dmg-bar i { display: block; height: 100%; }
.dmg-bar .p { background: var(--dmg-phys); } .dmg-bar .m { background: var(--dmg-mag); } .dmg-bar .t { background: var(--dmg-true); }
.dmg-bar.none { border: 1px solid var(--rule); background: transparent; }
.traits { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.trait { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--r-sm); border: 1px solid var(--rule); background: var(--glass-row); font-size: 12px; font-weight: 700; }
.trait.gap { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.dmg-key { display: flex; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--muted); }
.dmg-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.tips { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tips li { position: relative; padding-left: 14px; font-size: 13px; line-height: 1.4; }
.tips li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold-bright); }
.hl-hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
.chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 10px; }
.chip-grid.three { grid-template-columns: repeat(3, 1fr); }
.chip {
  min-height: var(--tap);
  display: flex; align-items: center; gap: 7px;
  padding: 5px 8px;
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--glass-row);
  font-size: 12px; font-weight: 600; text-align: left;
  min-width: 0;
}
.chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
.chip.active { border-color: var(--text); background: var(--raised); }
.chip.sub-active { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.seg button { min-height: 36px; padding: 0 12px; border-radius: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
.seg button.active { background: var(--plate); color: var(--on-plate); }
.page-row {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  min-height: 58px; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--glass-row); text-align: left;
}
.page-row.current { border-color: var(--gold-bright); background: var(--raised); }
.page-apply {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 32px; padding: 0 11px; border-radius: var(--r-sm);
  background: var(--plate); color: var(--on-plate);
  font-size: 12px; font-weight: 800; flex-shrink: 0;
}
.sub-k { margin: 12px 0 6px; font: 700 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Team tab */
.mate { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r); background: var(--glass-row); border: 1px solid var(--rule); }
.mate.self { border-color: var(--gold); }
.swap-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

/* ---- Live game ---------------------------------------------------------------------------------- */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; border-radius: var(--r); overflow: hidden; border: 1px solid var(--rule); }
.hud-side { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.hud-side.blue { background: linear-gradient(90deg, rgba(59, 158, 255, 0.34), rgba(59, 158, 255, 0.12)); }
.hud-side.red { background: linear-gradient(270deg, rgba(240, 96, 90, 0.34), rgba(240, 96, 90, 0.12)); justify-content: flex-end; }
.score { font: 800 46px/0.9 var(--font-display); font-variant-numeric: tabular-nums; }
.hud-side.blue .score { color: var(--blue); }
.hud-side.red .score { color: var(--red); }
[data-theme="light"] .hud-side.blue .score, [data-theme="light"] .hud-side.red .score { filter: none; }
.towers { display: inline-flex; align-items: center; gap: 3px; font: 700 13px var(--font-mono); color: var(--muted); }
.hud-clock {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 8px 14px;
  background: var(--glass-strong);
  border-left: 1px solid var(--gold); border-right: 1px solid var(--gold);
}
.hud-clock .js-clock-wrap { align-items: center; }
.hud-mode { font: 700 11px var(--font-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

/* Live Objective Timer Strip (from LiveBoard::pits) */
.pit-bar {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  border-radius: var(--r); border: 1px solid var(--rule);
  background: var(--glass); overflow: hidden;
}
.pit-cell {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 9px 6px; border-left: 1px solid var(--rule); min-width: 0;
}

  // ---- Running clocks -------------------------------------------------------------------------
  // A clock is rendered with the seconds it had at the last state push; this ticker moves it in
  // between so it never freezes. Countdowns escalate at 10 s and 5 s (Urgency Ramp Rule).
  function urgency(now) { return now <= 5 ? 2 : (now <= 10 ? 1 : 0); }
  function fmtClock(sec, fmt) {
    const n = Math.max(0, Math.round(sec));
    if (fmt === "s") return String(n);
    return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  }
  function fmtSec(sec) {
    const n = Math.max(0, Math.floor(sec || 0));
    return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  }
  function clockHtml(sec, o = {}) {
    const dir = o.down ? -1 : 1;
    const total = o.total || 0;
    const fmt = o.fmt || "mmss";
    const base = Math.max(0, Number(sec) || 0);
    const u = dir < 0 && !o.calm ? urgency(base) : 0;
    const bar = o.bar && dir < 0 && total > 0
      ? `<div class="drain js-bar" aria-hidden="true"><i style="transform:scaleX(${Math.min(1, base / total).toFixed(3)})"></i></div>` : "";
    return `<div class="js-clock-wrap${u ? " u" + u : ""}" data-base="${base}" data-dir="${dir}" data-total="${total}" data-fmt="${fmt}"${o.calm ? ' data-calm="1"' : ""}>`
      + `<span class="clock ${o.cls || ""} js-clock" role="timer">${fmtClock(base, fmt)}</span>${bar}${o.extra || ""}</div>`;
  }
  function tickClocks() {
    const elapsed = (performance.now() - (ui.stateAt || performance.now())) / 1000;
    document.querySelectorAll(".js-clock-wrap").forEach(w => {
      const dir = Number(w.dataset.dir);
      const base = Number(w.dataset.base);
      const total = Number(w.dataset.total);
      const now = dir < 0 ? Math.max(0, Math.ceil(base - elapsed)) : Math.floor(base + elapsed);
      const label = w.querySelector(".js-clock");
      const text = (now === 0 && w.dataset.zeroLabel) ? w.dataset.zeroLabel : fmtClock(now, w.dataset.fmt);
      if (label && label.textContent !== text) label.textContent = text;
      const u = dir < 0 && !w.dataset.calm ? urgency(now) : 0;
      w.classList.toggle("u1", u === 1);
      w.classList.toggle("u2", u === 2);
      const frac = Math.min(1, now / Math.max(1, total));
      const bar = w.querySelector(".js-bar i") || (w.closest(".cs-turn-plate") && w.closest(".cs-turn-plate").querySelector(".js-bar i"));
      if (bar) bar.style.transform = `scaleX(${frac.toFixed(3)})`;
      const ring = w.querySelector(".js-ring");
      if (ring) ring.style.strokeDashoffset = String(100 - 100 * frac);
      const prog = w.parentElement && w.parentElement.querySelector(".js-dial-prog");
      if (prog && total > 0) prog.style.strokeDashoffset = String((100 - 100 * frac).toFixed(2));
    });
  }
  setInterval(() => { if (!document.hidden) tickClocks(); }, 250);
  function parseClock(str) {

  // ---- Client assets --------------------------------------------------------------------------
  // Every image comes from the desktop's own asset cache on the LAN. Loads and misses are
  // remembered so a re-render shows the same state instead of flashing the fallback.
  const imgOk = Object.create(null);

  function assetUrl(category, id) {
    const n = Number(id);

  // ---- Scene: the player's own splash full-bleed behind the phase ----------------------------
  function sceneFor(s) {
    if (s.phase === "ChampSelect" && s.champ_select) {
      const cs = s.champ_select;
      const me = (cs.my_team || []).find(a => a.is_self);
      const act = cs.active_action;
      let champ = me && me.champion_id > 0 ? me.champion_id : 0;
      if (!champ && act && act.is_my_turn && act.action_type !== "ban") champ = act.champion_id || 0;
      if (!champ && cs.intent_action && cs.intent_action.champion_id > 0) champ = cs.intent_action.champion_id;
      const activeSkin = (cs.available_skins || []).find(sk => sk.selected);
      const sceneSkinId = activeSkin ? activeSkin.id : cs.selected_skin_id;

    }
    if (s.phase === "InProgress" && s.live_game) {
      const lg = s.live_game;
      const me = (lg.allies || []).find(p => p.is_self);
      const champ = (me && me.champion_id) || lg.active_champion_id;

    }

  }
  /**
   * Shows the scene's splash, or the client's valley backdrop when that splash is not cached.
   * One image per scene: a state push for the same scene does nothing.
   */
  function setScene(sc) {
    const el = $("scene");
    const usable = c => assetUrl(c.cat, c.id) && !missed(`${c.cat}/${c.id}`);
    const target = sc.cat !== "art" && !usable(sc) ? { cat: "art", id: ART.backdrop } : sc;
    el.classList.toggle("dead", sc.mode === "dead");
    el.classList.toggle("defeat", sc.mode === "defeat");

    const key = `${target.cat}/${target.id}`;
    if (key === ui.sceneKey) return;
    ui.sceneKey = key;
    const img = new Image();
    const dropOthers = () => el.querySelectorAll("img").forEach(o => {
      if (o === img) return;
      o.classList.remove("in");

    if (!usable(target)) { dropOthers(); return; }
    img.alt = "";
    img.decoding = "async";

      if (ui.sceneKey !== key) { img.remove(); return; }
      requestAnimationFrame(() => img.classList.add("in"));
      dropOthers();
    };
    img.onerror = () => {
      imgMiss[key] = Date.now() + 30000;
      img.remove();
      if (ui.sceneKey === key) { ui.sceneKey = ""; setScene(sc); }
    };
    img.src = assetUrl(target.cat, target.id);

  }

  // ---- Alerts ---------------------------------------------------------------------------------
  function initAudio() {
    if (!ui.audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;

  function playChime() {
    if (!ui.alertsArmed) return;
    try {
      initAudio();

      const now = ui.audioCtx.currentTime;
      [660, 880].forEach((freq, idx) => {
        const osc = ui.audioCtx.createOscillator();
        const gain = ui.audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.001, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(ui.audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.26);
      });
    } catch (_) {}
  }

  // ---- Transport ------------------------------------------------------------------------------
  async function sendCmd(payload) {

      const res = await fetch("/api/action", { method: "POST", headers, body: JSON.stringify(payload) });

  // ---- DOM morph ------------------------------------------------------------------------------
  // State pushes arrive every second in a draft. Rebuilding the view would reload images, replay

  const tpl = document.createElement("template");

  function sameNode(a, b) {
