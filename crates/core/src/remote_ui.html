  }

  /** The dock: strictly the active phase's primary CTA and tabs. */
  function renderDock(html) {
    const dock = $("bottom-dock");
    if (!html) {
      dock.hidden = true;
      $("dock-content").innerHTML = "";
    } else {
      dock.hidden = false;
      morphInto($("dock-content"), html);
    }
    syncDockHeight();
  }
  function syncDockHeight() {
    const dock = $("bottom-dock");
    const h = dock.hidden ? 0 : dock.offsetHeight;
    document.documentElement.style.setProperty("--dock-h", h + "px");
  }
  if ("ResizeObserver" in window) new ResizeObserver(syncDockHeight).observe($("bottom-dock"));

  function tabsHtml(tabs, current, action) {
    return `<div class="tabs" role="tablist">${tabs.map(tb =>
      `<button class="tab ${current === tb.id ? "active" : ""}" role="tab" aria-selected="${current === tb.id}" data-action="${action}" data-tab="${tb.id}">${TAB_ICONS[tb.icon || tb.id] || ""}<span>${esc(tb.label)}</span>${tb.dot ? '<i class="tab-dot"></i>' : ""}</button>`
    ).join("")}</div>`;
  }

  // ---- Lobby & Queue Selector -----------------------------------------------------------------
  const MINI_CHECK_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const CHEV_RIGHT_SVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;

  function queueGridHtml(queues, activeId) {
    if (!queues || !queues.length) return "";
    return `<div class="queue-grid">${queues.map(q => `
      <button class="queue-card ${q.queue_id === activeId ? "active" : ""}" data-action="create-lobby" data-queue="${q.queue_id}">
        <span class="ellipsis">${esc(q.name)}</span>
        ${CHEV_RIGHT_SVG}
      </button>`).join("")}</div>`;
  }

  function normalizeSwiftSlot(src, fallbackPos, defPage) {
    const cid = Number(src && src.champion_id) || 0;
    return {
      champion_id: cid,
      champion_name: (src && src.champion_name) || "",
      position: (src && src.position) || fallbackPos,
      skin_id: Number(src && src.skin_id) || (cid > 0 ? cid * 1000 : 0),
      spell1_id: Number(src && src.spell1_id) || 4,
      spell2_id: Number(src && src.spell2_id) || 14,
      perk_page_id: Number(src && src.perk_page_id) || defPage
    };
  }

  function syncSwiftplaySlots(l) {
    const raw = l.swiftplay_slots || [];
    const defPage = ((l.rune_pages || []).find(p => p.current) || (l.rune_pages || [])[0] || {}).id || 0;
    const serverPair = [normalizeSwiftSlot(raw[0], "MIDDLE", defPage), normalizeSwiftSlot(raw[1], "TOP", defPage)];
    const key = `${l.queue_id}:${JSON.stringify(serverPair)}`;
    if (key !== ui.swiftSyncedKey || ui.swiftSlots.length !== 2) {
      ui.swiftSyncedKey = key;
      ui.swiftSlots = serverPair.map(sl => ({ ...sl }));
      if (ui.swiftSlot > 1) ui.swiftSlot = 0;
    }
    return serverPair;
  }

  function renderSwiftplayBody(l) {
    const serverPair = syncSwiftplaySlots(l);
    const dirty = JSON.stringify(ui.swiftSlots) !== JSON.stringify(serverPair);
    const canSave = ui.swiftSlots.every(sl => sl.champion_id > 0);
    renderDock(`<div class="dock-row">
        <button class="btn btn-ghost ${dirty ? "btn-dirty" : ""}" data-action="save-swift-slots" ${canSave ? "" : "disabled"}>${dirty ? esc(t("saveSlots")) : `${MINI_CHECK_SVG}${esc(t("savedSlots"))}`}</button>
        <button class="btn btn-plate" data-action="start-queue">${esc(t("findMatch"))}</button>
      </div>`);
    const cur = ui.swiftSlots[ui.swiftSlot] || ui.swiftSlots[0];
    const spells = l.available_spells || [];
    const s1Raw = spells.find(sp => sp.id === cur.spell1_id) || { id: cur.spell1_id || 4, name: "Flash" };
    const s2Raw = spells.find(sp => sp.id === cur.spell2_id) || { id: cur.spell2_id || 14, name: "Ignite" };
    const s1Name = spellName(s1Raw.id, s1Raw.name);
    const s2Name = spellName(s2Raw.id, s2Raw.name);
    const q = ui.swiftQuery.trim().toLowerCase();
    const champs = (l.champions || []).filter(c => !q || c.name.toLowerCase().includes(q));
    const slotSkins = ((l.slot_skins || [])[ui.swiftSlot] || []).filter(sk => Math.floor(sk.id / 1000) === cur.champion_id);
    const pages = l.rune_pages || [];

    return `
      <section class="panel" data-key="swift-panel">
        <div class="swift-slots">
          ${ui.swiftSlots.map((sl, idx) => {
            const cName = sl.champion_name || ((l.champions || []).find(c => c.id === sl.champion_id) || {}).name || "";
            return `<button class="swift-slot ${ui.swiftSlot === idx ? "focus" : ""}" data-action="swift-focus" data-idx="${idx}">
              ${champPt(sl.champion_id, cName, 40, ui.swiftSlot === idx ? "self" : "")}
              <span class="grow">
                <span class="slot-k">${esc(t("slotLabel", idx + 1))} · ${esc(laneInfo(sl.position).label)}</span><br>
                <b class="ellipsis" style="display:block;font-size:14px">${esc(cName || t("chooseChampSlot"))}</b>
              </span>
              ${roundel(sl.position)}
            </button>`;
          }).join("")}
        </div>
        <div class="prep-sec">
          <div class="between">
            <span class="eyebrow">${esc(t("chooseChampSlot"))}</span>
            <button class="btn btn-ghost btn-sm" data-action="swift-toggle-champs">${esc(ui.swiftChampOpen ? t("close") : t("chooseChampSlot"))}</button>
          </div>
          ${ui.swiftChampOpen || !(cur.champion_id > 0) ? `
            <div class="search-wrap" style="margin-top:8px">
              <input id="swift-search" class="search" type="search" autocomplete="off" placeholder="${esc(t("filterPick"))}" value="${esc(ui.swiftQuery)}">
            </div>
            <div class="champ-grid" style="margin-top:8px;max-height:220px;overflow-y:auto">
              ${champs.map(c => `<button class="champ ${c.id === cur.champion_id ? "sel" : ""}" data-action="swift-champ" data-id="${c.id}" data-name="${esc(c.name)}">
                ${pt("champion", c.id, esc(initials(c.name)), 0)}
                <span class="champ-name">${esc(c.name)}</span>
              </button>`).join("")}
            </div>` : ""}
        </div>
        <div class="prep-sec">
          <div class="eyebrow" style="margin-bottom:8px">${esc(t("roles"))}</div>
          <div class="lane-grid">
            ${LANE_META_BASE.map(item => `<button class="lane-btn ${cur.position === item.key ? "chosen" : ""}" data-action="swift-lane" data-lane="${item.key}">
              ${roundel(item.key)}
              <span>${esc(laneInfo(item.key).label)}</span>
            </button>`).join("")}
          </div>
        </div>
        <div class="prep-sec">
          <div class="prep-sec-head"><span class="eyebrow">${esc(t("hlSpells"))}</span><span class="meta">${esc(t("changeSpellHint"))}</span></div>
          <div class="spell-duel">
            <button class="spell-btn ${ui.swiftSpellOpen && ui.swiftSpellSlot === 1 ? "focus" : ""}" data-action="swift-spell-slot" data-slot="1">
              ${pt("spell", s1Raw.id, spellFallbackGlyph(s1Raw.id, s1Name), 44)}
              <span class="spell-btn-lbl"><span class="keycap">${esc(t("slotD"))}</span><span class="ellipsis">${esc(s1Name)}</span></span>
            </button>
            <button class="spell-swap-orb" data-action="swift-swap-spells" aria-label="${esc(t("swapDF"))}">
              <svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/></svg>
            </button>
            <button class="spell-btn ${ui.swiftSpellOpen && ui.swiftSpellSlot === 2 ? "focus" : ""}" data-action="swift-spell-slot" data-slot="2">
              ${pt("spell", s2Raw.id, spellFallbackGlyph(s2Raw.id, s2Name), 44)}
              <span class="spell-btn-lbl"><span class="keycap">${esc(t("slotF"))}</span><span class="ellipsis">${esc(s2Name)}</span></span>
            </button>
          </div>
          ${ui.swiftSpellOpen ? `<div class="chip-grid">
            ${spells.map(sp => {
              const nm = spellName(sp.id, sp.name);
              const on = (ui.swiftSpellSlot === 1 ? cur.spell1_id : cur.spell2_id) === sp.id;
              return `<button class="chip ${on ? "active" : ""}" data-action="swift-pick-spell" data-id="${sp.id}">${pt("spell", sp.id, spellFallbackGlyph(sp.id, nm), 24, "no-rim")}<span>${esc(nm)}</span></button>`;
            }).join("")}
          </div>` : ""}
        </div>
        ${pages.length ? `<div class="prep-sec">
          <div class="eyebrow" style="margin-bottom:8px">${esc(t("runes"))}</div>
          <div class="chip-grid">${pages.map(pg => `<button class="chip ${cur.perk_page_id === pg.id ? "active" : ""}" data-action="swift-rune" data-id="${pg.id}">${pt("style", pg.primary_style_id, "", 20, "round no-rim")}<span>${esc(pg.name)}</span></button>`).join("")}</div>
        </div>` : ""}
        ${slotSkins.length ? `<div class="prep-sec">
          <div class="eyebrow" style="margin-bottom:8px">${esc(t("tabSkins"))}</div>
          <div class="chip-grid">${slotSkins.map(sk => `<button class="chip ${cur.skin_id === sk.id ? "active" : ""}" data-action="swift-skin" data-id="${sk.id}"><span>${esc(sk.name)}</span></button>`).join("")}</div>
        </div>` : ""}
      </section>`;
  }

  function renderLobby(s) {
    const l = s.lobby;
    const qid = l ? l.queue_id : 0;
    if ((!ui.lobbySynced || ui.lobbyQueueId !== qid) && l) {
      ui.lobbyFirst = l.first_position || "MIDDLE";
      ui.lobbySecond = l.second_position || "TOP";
      ui.lobbyQueueId = qid;
      ui.lobbySynced = true;
    }
    const canSwitchMode = (!l || l.is_leader) && (s.available_queues || []).length > 0;
    const headPanel = `
      <section class="panel" data-key="lobby-head">
        <div class="between">
          <div class="grow">
            <h2 class="title">${esc((l && queueLabel(l.queue_name)) || t("leagueLobby"))}</h2>
            <div class="sub-meta">${esc(t("lobby"))}${l && l.member_count ? " · " + esc(t("playersCount", l.member_count)) : ""}</div>
          </div>
          ${canSwitchMode ? `<button class="btn btn-ghost btn-sm" data-action="toggle-lobby-queues">${esc(ui.lobbyQueueOpen ? t("close") : t("changeMode"))}</button>`
            : (l && l.member_count ? `<span class="tag gold">${esc(t("playersCount", l.member_count))}</span>` : "")}
        </div>
        ${canSwitchMode && ui.lobbyQueueOpen ? queueGridHtml(s.available_queues, qid) : ""}
      </section>`;

    if (l && l.is_swiftplay) {
      return headPanel + renderSwiftplayBody(l);
    }
    if (l && l.is_roleless) {
      renderDock(`<button class="btn btn-plate btn-block" data-action="start-queue">${esc(t("findMatch"))}</button>`);
      return headPanel + `<section class="panel" data-key="lobby-roleless"><div class="meta">${esc(t("rolelessReady"))}</div></section>`;
    }

    const dirty = !l || ui.lobbyFirst !== (l.first_position || "MIDDLE") || (ui.lobbyFirst !== "FILL" && ui.lobbySecond !== (l.second_position || "TOP"));
    renderDock(`<div class="dock-row">
        <button class="btn btn-ghost ${dirty ? "btn-dirty" : ""}" data-action="save-roles">${dirty ? esc(t("saveRoles")) : `${MINI_CHECK_SVG}${esc(t("savedRoles"))}`}</button>
        <button class="btn btn-plate" data-action="start-queue">${esc(t("findMatch"))}</button>
      </div>`);
    const fillPrimary = ui.lobbyFirst === "FILL";
    const slot = (n, key) => {
      const optional = n === 2 && fillPrimary;
      const l2 = laneInfo(key);
      const focus = !optional && (n === 1) === ui.selectingFirstRole;
      return `<button class="role-slot ${focus ? "focus" : ""} ${optional ? "optional" : ""}" data-action="focus-slot" data-slot="${n}" ${optional ? "disabled" : ""}>
        ${roundel(optional ? "FILL" : key, "lg")}
        <span class="grow"><span class="slot-k">${esc(n === 1 ? t("primary") : t("secondary"))}</span><br><span class="slot-v">${esc(optional ? t("optionalRole") : l2.label)}</span></span>
      </button>`;
    };
    return headPanel + `
      <section class="panel">
        <div class="section-head"><span class="eyebrow">${esc(t("roles"))}</span><span class="meta">${esc(t("lobbyHint"))}</span></div>
        <div class="role-pair">${slot(1, ui.lobbyFirst)}${slot(2, ui.lobbySecond)}</div>
        <div class="lane-grid">
          ${LANE_META_BASE.map(item => {
            const rank = item.key === ui.lobbyFirst ? "1" : (!fillPrimary && item.key === ui.lobbySecond ? "2" : "");
            return `<button class="lane-btn ${rank ? "chosen" : ""}" data-action="pick-lane" data-lane="${item.key}">
              ${rank ? `<span class="rank">${rank}</span>` : ""}
              ${roundel(item.key)}
              <span>${esc(laneInfo(item.key).label)}</span>
            </button>`;
          }).join("")}
        </div>
      </section>`;
  }

  // ---- Queue ----------------------------------------------------------------------------------
  function renderQueue(s) {
    const mm = s.matchmaking || {};
    const est = Math.max(10, Number(mm.estimated_queue_time_sec) || 60);
    const cur = Math.max(0, Number(mm.time_in_queue_sec) || 0);
    const off = (100 - 100 * Math.min(1, cur / est)).toFixed(2);
    const l = s.lobby;
    const p1 = (l && l.first_position) || ui.lobbyFirst;
    const p2 = (l && l.second_position) || ui.lobbySecond;
    renderDock(`<button class="btn btn-danger btn-block" data-action="stop-queue">${esc(t("cancelQueue"))}</button>`);
    return `
      <section class="panel hero-center">
        <h2 class="title">${esc(t("inQueue"))}</h2>
        <div class="meta">${esc(queueLabel(mm.queue_name) || "Matchmaking")}</div>
        <div class="dial">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dial-track" cx="60" cy="60" r="57"/>
            <circle class="dial-prog js-dial-prog" cx="60" cy="60" r="57" pathLength="100" style="stroke-dashoffset:${off}"/>
            <circle class="dial-ticks" cx="60" cy="60" r="51"/>
            <circle class="dial-inner" cx="60" cy="60" r="45"/>
          </svg>
          ${clockHtml(cur, { cls: "specimen", total: est })}
        </div>
        <div class="meta">${esc(t("estWait", fmtSec(est)))}</div>
        ${p1 ? `<div class="queue-roles">
          ${laneSvg(p1, 15, laneInfo(p1).color)}<span>${esc(laneInfo(p1).label)}</span>
          ${p1 !== "FILL" && p2 ? `<span class="meta">·</span>${laneSvg(p2, 15, laneInfo(p2).color)}<span>${esc(laneInfo(p2).label)}</span>` : ""}
        </div>` : ""}
      </section>`;
  }

  // ---- Ready check ----------------------------------------------------------------------------
  const CHECK_SVG = `<svg class="medal-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const CROSS_SVG = `<svg class="medal-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  function renderReady(s) {
    const mm = s.matchmaking || {};
    const resp = mm.player_response || "None";
    const accepted = resp === "Accepted";
    const declined = resp === "Declined";
    const left = mm.ready_check_timer_sec != null ? mm.ready_check_timer_sec : 10;
    const total = Math.max(10, left);
    renderDock(accepted || declined ? "" : `
      <button class="btn btn-accept" data-action="accept-ready">${esc(t("acceptMatch"))}</button>
      <button class="btn-quiet" data-action="decline-ready">${esc(t("decline"))}</button>`);
    const state = accepted ? "accepted" : (declined ? "declined" : "");
    const ring = `<svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-outer" cx="60" cy="60" r="58.5"/>
        <circle class="ring-track" cx="60" cy="60" r="53"/>
        <circle class="ring-fill js-ring" cx="60" cy="60" r="53" pathLength="100" style="stroke-dashoffset:${(100 - 100 * Math.min(1, left / total)).toFixed(2)}"/>
        <circle class="ring-notch" cx="60" cy="60" r="53" pathLength="100"/>
      </svg>`;
    const core = `<div class="medal-core">${imgTag("art", ART.readyCheck, "art")}${accepted ? CHECK_SVG : declined ? CROSS_SVG : ""}</div>`;
    const medal = state
      ? `<div class="medal ${state}">${ring}${core}</div>`
      : `<div class="medal">${clockHtml(left, { down: true, total, fmt: "s", cls: "medal-num", extra: `<span class="medal-sec">${esc(t("secShort"))}</span>` }).replace('<span class="clock medal-num', `${ring}${core}<span class="clock medal-num`)}</div>`;
    const lob = s.lobby || {};
    const p1 = lob.first_position && lob.first_position !== "UNSELECTED" ? laneInfo(lob.first_position).label : "";
    const subParts = [queueLabel(mm.queue_name), p1, accepted ? t("waitingOthers") : (declined ? "" : t("acceptBefore"))].filter(Boolean);
    return `
      <section class="panel hero-center ready-stage ${state ? "" : "spot" + (Date.now() < ui.turnFlashUntil ? " turn-start" : "")}">
        ${medal}
        <h2 class="title">${esc(accepted ? t("matchAccepted") : declined ? t("matchDeclined") : t("matchFound"))}</h2>
        <div class="meta">${esc(subParts.join(" · "))}</div>
      </section>`;
  }

  // ---- Champion select ------------------------------------------------------------------------
  function loadPerksIntoBuilder(cs, priId, subId, perks, name) {
    if (!cs || !Array.isArray(perks) || perks.length !== 9) return;
    ui.customPrimary = Number(priId) || ui.customPrimary;
    ui.customSub = Number(subId) || ui.customSub;
    ui.customPerks = perks.slice(0, 9).map(Number);
    const sTree = (cs.rune_trees || []).find(x => x.id === ui.customSub);
    const meta = [];
    if (sTree) {
      for (const pid of [ui.customPerks[4], ui.customPerks[5]]) {
        for (const rk of ["slot1", "slot2", "slot3"]) {
          if ((sTree[rk] || []).some(o => o.id === pid)) {
            meta.push({ row: rk, id: pid });
            break;
          }
        }
      }
    }
    if (meta.length === 2) ui.customSubMeta = meta;
    if (name && !ui.customNameEdited) ui.customName = name;
    syncCustomRunesDefaults(cs);
  }

  function syncBuilderFromActivePage(cs) {
    if (!cs) return;
    const allPages = [...(cs.rune_pages || []), ...(cs.recommended_rune_pages || [])];
    const active = allPages.find(p => p.current);
    if (!active || !Array.isArray(active.selected_perk_ids) || active.selected_perk_ids.length !== 9) return;
    const sig = `${active.id}:${active.primary_style_id}:${active.sub_style_id}:${active.selected_perk_ids.join(",")}`;
    if (sig !== ui.activePageSig && !ui.builderDirty) {
      ui.activePageSig = sig;
      loadPerksIntoBuilder(cs, active.primary_style_id, active.sub_style_id, active.selected_perk_ids, active.name);
    }
  }

  function syncCustomRunesDefaults(cs) {
    if (!cs || !cs.rune_trees || !cs.rune_trees.length) return;
    const pTree = cs.rune_trees.find(x => x.id === ui.customPrimary) || cs.rune_trees[0];
    if (ui.customSub === pTree.id) {
      const alt = cs.rune_trees.find(x => x.id !== pTree.id) || cs.rune_trees[0];
      ui.customSub = alt.id;
    }
    const sTree = cs.rune_trees.find(x => x.id === ui.customSub) || cs.rune_trees[1] || pTree;
    const ensureIn = (arr, cur) => (arr && arr.some(x => x.id === cur)) ? cur : (arr && arr[0] ? arr[0].id : 0);
    ui.customPrimary = pTree.id;
    ui.customSub = sTree.id;
    ui.customPerks[0] = ensureIn(pTree.keystones, ui.customPerks[0]);
    ui.customPerks[1] = ensureIn(pTree.slot1, ui.customPerks[1]);
    ui.customPerks[2] = ensureIn(pTree.slot2, ui.customPerks[2]);
    ui.customPerks[3] = ensureIn(pTree.slot3, ui.customPerks[3]);
    const validSubIds = [
      ...(sTree.slot1 || []).map(x => ({ row: "slot1", id: x.id })),
      ...(sTree.slot2 || []).map(x => ({ row: "slot2", id: x.id })),
      ...(sTree.slot3 || []).map(x => ({ row: "slot3", id: x.id }))
    ];
    let pair = ui.customSubMeta.filter(m => validSubIds.some(v => v.id === m.id));
    if (pair.length < 2) {
      const pick1 = sTree.slot1 && sTree.slot1[0] ? { row: "slot1", id: sTree.slot1[0].id } : validSubIds[0];
      const pick2 = sTree.slot2 && sTree.slot2[0] ? { row: "slot2", id: sTree.slot2[0].id } : (validSubIds[1] || pick1);
      pair = [pick1, pick2].filter(Boolean);
    }
    if (pair[0] && pair[1]) {
      ui.customSubMeta = pair;
      ui.customPerks[4] = pair[0].id;
      ui.customPerks[5] = pair[1].id;
    }
  }

  function hoverTarget(cs) {
    if (!cs) return null;
    const act = cs.active_action;
    if (act && act.is_my_turn && !act.completed) return act;
    const me = (cs.my_team || []).find(a => a.is_self);
    if (me && me.pick_locked) return null;
    if (cs.intent_action && !cs.intent_action.completed) return cs.intent_action;
    return null;
  }

  const CHEV_DOWN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
  const LOCK_MINI_SVG = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const STAR_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>`;
  const STAR_MINI_SVG = `<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>`;
  const WARD_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>`;
  const DICE_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></svg>`;
  const WARN_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 20h20L12 3z"/><path d="M12 9v5M12 17.5v.01"/></svg>`;

  function draftBansMini(cs) {
    const myIds = (cs.my_team_ban_ids && cs.my_team_ban_ids.length) ? cs.my_team_ban_ids : (cs.my_team_bans || []).map(() => 0);
    const theirIds = (cs.their_team_ban_ids && cs.their_team_ban_ids.length) ? cs.their_team_ban_ids : (cs.their_team_bans || []).map(() => 0);
    const myChips = myIds.map((id, i) => pt("champion", id, esc(initials((cs.my_team_bans || [])[i] || "")), 22, "struck"));
    const theirChips = theirIds.map((id, i) => pt("champion", id, esc(initials((cs.their_team_bans || [])[i] || "")), 22, "struck enemy"));
    if (!myChips.length && !theirChips.length) return `<span class="meta">—</span>`;
    return `${myChips.join("")}${myChips.length && theirChips.length ? '<i class="draft-div"></i>' : ""}${theirChips.join("")}`;
  }

  function draftHud(cs) {
    const guideBtn = `<button class="guide-pill" data-action="toggle-guide" aria-expanded="${ui.guideOpen}">${TAB_ICONS.guide}<span>${esc(t("tabGuide"))}</span></button>`;
    if (ui.draftExpanded) {
      return `<section class="panel draft-hud" aria-label="${esc(t("champSelect"))}" data-key="draft-hud">
          <div class="draft-bar" style="padding-top:0;border-top:0">
            <span class="eyebrow">${esc(t("allies"))}</span>
            <div class="draft-actions">
              ${guideBtn}
              <button class="draft-toggle open" data-action="toggle-draft" aria-expanded="true">
                <span>${esc(t("draftCompact"))}</span>${CHEV_DOWN_SVG}
              </button>
            </div>
          </div>
          ${draftBoard(cs)}
        </section>`;
    }
    const allySlots = (cs.my_team || []).slice(0, 5).map(a => {
      const acting = Boolean(a.acting_type && !a.is_self);
      return `<span class="mirror-pt ${a.is_self ? "self" : ""} ${acting ? "acting" : ""}" data-key="ds-${a.cell_id}" title="${esc(a.champion_name || laneInfo(a.assigned_position).label)}">
        ${champPt(a.champion_id, a.champion_name, 28, a.is_self ? "self" : "")}
        ${a.pick_locked ? `<span class="lock-pip">${LOCK_MINI_SVG}</span>` : ""}
      </span>`;
    }).join("");
    const enemyRaw = (cs.their_team || []).slice(0, 5);
    const enemySlots = Array.from({ length: Math.max(enemyRaw.length, Math.min(5, (cs.my_team || []).length)) }, (_, i) => {
      const e = enemyRaw[i];
      return `<span class="mirror-pt enemy" data-key="de-${i}">${e ? champPt(e.champion_id, e.champion_name, 28, "enemy") : `<span class="pt empty" style="width:28px;height:28px"></span>`}</span>`;
    }).join("");
    return `<section class="panel draft-hud" aria-label="${esc(t("champSelect"))}" data-key="draft-hud">
        <div class="draft-mirror">
          <div class="draft-side">${allySlots}</div>
          <span class="draft-vs">VS</span>
          <div class="draft-side enemy">${enemySlots}</div>
        </div>
        <div class="draft-bar">
          <div class="draft-mini-group">
            ${cs.is_roleless ? "" : `<span class="draft-mini-k blue">${esc(t("bans"))}</span>${draftBansMini(cs)}`}
          </div>
          <div class="draft-actions">
            ${guideBtn}
            <button class="draft-toggle" data-action="toggle-draft" aria-expanded="false">
              <span>${esc(t("draftDetails"))}</span>${CHEV_DOWN_SVG}
            </button>
          </div>
        </div>
      </section>`;
  }

  function draftBoard(cs) {
    const spells = cs.available_spells || [];
    const allies = (cs.my_team || []).map(a => {
      const has = a.champion_id > 0;
      const state = !has ? "" : (a.pick_locked ? "locked" : "hover");
      const acting = a.acting_type && !a.is_self;
      const actLabel = a.acting_type === "ban" ? t("actingBan") : t("actingPick");
      const sub = [
        a.is_self ? t("youTag") : (a.summoner_name || ""),
        cs.is_roleless ? "" : laneInfo(a.assigned_position).label
      ].filter(Boolean).join(" · ");
      const spellIcons = (a.spell1_id > 0 || a.spell2_id > 0)
        ? [a.spell1_id, a.spell2_id].filter(x => x > 0).map(id => pt("spell", id, spellFallbackGlyph(id, spellName(id, (spells.find(sp => sp.id === id) || {}).name)), 20, "no-rim")).join("")
        : "";
      return `<div class="ally ${state} ${a.is_self ? "self" : ""} ${acting ? "acting" : ""}" data-key="ally-${a.cell_id}">
        ${bannerHtml(a.selected_skin_id, a.champion_id)}
        ${cs.is_roleless ? "" : roundel(a.assigned_position)}
        ${champPt(a.champion_id, a.champion_name, 38, a.is_self ? "self" : "")}
        <div class="grow">
          <div class="ally-name ellipsis">${esc(has ? a.champion_name : t("pending"))}</div>
          <div class="ally-sub ellipsis">${esc(sub)}</div>
        </div>
        <span class="side">${acting ? `<span class="tag signal">${esc(actLabel)}</span>` : spellIcons}</span>
        <i class="glint"></i>
      </div>`;
    }).join("");
    const enemies = (cs.their_team || []).map(e => champPt(e.champion_id, e.champion_name, 30, "enemy")).join("");
    return `<div class="board" style="padding:6px 0 0;border-top:1px solid var(--rule)" data-key="draft-expanded">
        ${allies}
        <div class="board-foot">
          ${cs.is_roleless ? "" : `<div class="strip"><span class="strip-lbl blue">${esc(t("bans"))}</span>${draftBansMini(cs)}</div>`}
          ${enemies ? `<div class="strip"><span class="strip-lbl red">${esc(t("enemies"))}</span>${enemies}</div>` : ""}
        </div>
      </div>`;
  }

  function inlineSwapsHtml(cs) {
    const incoming = cs.incoming_swaps || [];
    if (!incoming.length || ui.csTab === "team") return "";
    const pos = laneInfo(cs.assigned_position);
    return incoming.map(sw => `<section class="panel spot swap-inline" data-key="isw-${esc(sw.kind)}-${sw.id}">
        <div class="swap-inline-info">
          ${cs.is_roleless ? "" : laneSvg(pos.key, 18, pos.color)}
          <div class="grow"><b class="ellipsis" style="display:block;font-size:13px">${esc(sw.caller_name)} · ${esc(swapKindLabel(sw.kind))}</b>${sw.detail ? `<span class="meta ellipsis" style="display:block">${esc(sw.detail)}</span>` : ""}</div>
        </div>
        <div class="swap-inline-btns">
          <button class="btn btn-ghost" data-action="resp-swap" data-kind="${esc(sw.kind)}" data-id="${sw.id}" data-accept="0">${esc(t("decline"))}</button>
          <button class="btn btn-plate" data-action="resp-swap" data-kind="${esc(sw.kind)}" data-id="${sw.id}" data-accept="1">${esc(t("accept"))}</button>
        </div>
      </section>`).join("");
  }

  function pickTab(cs, act, isBan) {
    const isTurn = Boolean(act && act.is_my_turn && !act.completed);
    const isMyBanTurn = Boolean(isTurn && isBan);
    const target = hoverTarget(cs);
    const canHover = Boolean(target);
    const me = (cs.my_team || []).find(a => a.is_self);
    const selectedId = target ? target.champion_id : (me ? me.champion_id : 0);
    const selectedChamp = (cs.champions || []).find(c => c.id === selectedId);
    const selectedName = (target && target.champion_name) || (selectedChamp && selectedChamp.name) || (me && me.champion_name) || "";
    const favSet = new Set(ui.favChamps);
    const allyHoveredIds = new Set((cs.my_team || []).filter(a => !a.is_self && a.champion_id > 0).map(a => a.champion_id));

    const q = ui.champQuery.trim().toLowerCase();
    const filtered = (cs.champions || []).filter(c => {
      if (q && !c.name.toLowerCase().includes(q)) return false;
      if (!cs.is_roleless && ui.champRole !== "ALL" && !(c.roles || []).includes(ui.champRole)) return false;
      return true;
    });

    const comfortIds = [];
    for (const id of [...ui.favChamps, ...(cs.comfort_champion_ids || [])]) {
      if (id > 0 && !comfortIds.includes(id)) comfortIds.push(id);
    }
    const byId = new Map((cs.champions || []).map(c => [c.id, c]));
    const comfortChamps = (!q && !isMyBanTurn)
      ? comfortIds.map(id => byId.get(id)).filter(c => c && c.pickable !== false)
      : [];

    const statusText = me && me.pick_locked && me.champion_id > 0
      ? t("lockedIn", me.champion_name)
      : (target && selectedId > 0 && selectedName)
        ? t("pickIntent", selectedName)
        : target
          ? t("declareIntent")
          : t("waitingTurn");

    const statusBar = !isTurn ? `<div class="draft-status">
        <div class="grow">
          <b style="display:block;font-size:14px">${esc(statusText)}</b>
        </div>
        <div class="draft-status-links">
          <button class="btn btn-ghost btn-sm" data-action="cs-tab" data-tab="prep">${esc(t("tabPrep"))}</button>
          <button class="btn btn-ghost btn-sm" data-action="cs-tab" data-tab="skins">${esc(t("tabSkins"))}</button>
        </div>
      </div>` : "";

    const starBtn = (selectedId > 0 && !isMyBanTurn)
      ? `<button class="star-btn ${favSet.has(selectedId) ? "on" : ""}" type="button" data-action="toggle-fav" data-id="${selectedId}" aria-pressed="${favSet.has(selectedId)}" title="${esc(favSet.has(selectedId) ? t("starredChamp") : t("starChamp"))}">
          ${STAR_SVG}<span>${esc(favSet.has(selectedId) ? t("starredChamp") : t("starChamp"))}</span>
        </button>` : "";

    const comfortHtml = comfortChamps.length ? `<div class="comfort-wrap">
        <div class="comfort-head"><span class="eyebrow">${esc(t("comfortTitle"))}</span></div>
        <div class="comfort-strip">
          ${comfortChamps.map(c => `<button class="comfort-btn ${c.id === selectedId ? "sel" : ""}" data-key="cf${c.id}" data-action="hover-champ" data-id="${c.id}" ${canHover ? "" : "disabled"} aria-label="${esc(c.name)}">
            ${favSet.has(c.id) ? `<span class="fav-pip" aria-hidden="true">${STAR_MINI_SVG}</span>` : ""}
            ${pt("champion", c.id, esc(initials(c.name)), 46)}
            <span class="champ-name">${esc(c.name)}</span>
          </button>`).join("")}
        </div>
      </div>` : "";

    return `<section class="panel" data-key="pick-panel">
        ${statusBar}
        ${comfortHtml}
        <div class="row" style="gap:8px;margin-bottom:10px">
          <div class="search-wrap grow" style="margin-bottom:0">
            <input id="champ-search" class="search" type="search" autocomplete="off" enterkeyhint="search" placeholder="${esc(isMyBanTurn ? t("filterBan") : t("filterPick"))}" value="${esc(ui.champQuery)}">
            <button class="search-clear" type="button" data-action="clear-champ-search" aria-label="${esc(t("clearSearch"))}" ${ui.champQuery ? "" : "hidden"}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          ${starBtn}
        </div>
        ${cs.is_roleless ? "" : `<div class="pills">
          ${["ALL", "TOP", "JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"].map(rk => `
            <button class="pill ${ui.champRole === rk ? "active" : ""}" data-action="champ-role" data-role="${rk}">
              ${rk === "ALL" ? esc(t("all")) : `${laneSvg(rk, 14, laneInfo(rk).color)}<span>${esc(laneInfo(rk).label)}</span>`}
            </button>`).join("")}
        </div>`}
        ${filtered.length ? `<div class="champ-grid">
          ${filtered.map(c => {
            const allowed = isMyBanTurn ? c.bannable !== false : c.pickable !== false;
            const allyHover = isMyBanTurn && allyHoveredIds.has(c.id);
            return `<button class="champ ${c.id === selectedId ? "sel" + (isMyBanTurn ? " ban-sel" : "") : ""}" data-key="c${c.id}" data-action="hover-champ" data-id="${c.id}" data-name="${esc(c.name)}" ${canHover && allowed ? "" : "disabled"} aria-label="${esc(c.name)}">
              ${allyHover ? `<span class="ally-pip">${esc(t("allyHoverTag"))}</span>` : ""}
              ${favSet.has(c.id) && !isMyBanTurn ? `<span class="fav-pip" aria-hidden="true">${STAR_MINI_SVG}</span>` : ""}
              ${pt("champion", c.id, esc(initials(c.name)), 0)}
              <span class="champ-name">${esc(c.name)}</span>
            </button>`;
          }).join("")}
        </div>` : `<div class="empty-note">${esc(t("noMatch"))}</div>`}
      </section>`;
  }

  function skinsCarouselHtml(cs) {
    const skins = cs.available_skins || [];
    if (!skins.length) return `<div class="empty-note">${esc(t("selectChampSkins"))}</div>`;
    const champ = Math.floor((skins[0].id || 0) / 1000);
    return `<div class="carousel" id="skin-carousel" data-key="skins-${champ}">
          ${skins.map(sk => `
            <button class="skin ${sk.selected ? "sel" : ""}" data-key="sk${sk.id}" data-action="set-skin" data-id="${sk.id}">
              <span class="skin-crest" aria-hidden="true">${CREST_SVG}</span>
              ${imgTag("splash", sk.id, "art")}
              <span class="skin-label">
                <span class="skin-name">${esc(sk.name)}</span>
                ${sk.selected ? `<span class="tag gold">${esc(t("equipped"))}</span>` : ""}
              </span>
            </button>`).join("")}
        </div>
        ${skins.length <= 24 ? `<div class="carousel-foot" aria-hidden="true">${skins.map(sk => `<i class="${sk.selected ? "on" : ""}"></i>`).join("")}</div>` : ""}`;
  }

  function skinsTab(cs) {
    const skins = cs.available_skins || [];
    const activeSkin = skins.find(sk => sk.selected);
    const chromas = (activeSkin && activeSkin.chromas) || [];
    const wards = cs.available_wards || [];
    const baseSelected = Boolean(activeSkin && !chromas.some(ch => ch.selected));
    const chromaSec = chromas.length ? `
      <div class="chroma-sec" data-key="chromas-${activeSkin.id}">
        <div class="eyebrow">${esc(t("chromas"))} · ${esc(activeSkin.name)}</div>
        <div class="chroma-swatches">
          <button class="chroma-btn ${baseSelected ? "sel" : ""}" data-action="set-skin" data-id="${activeSkin.id}" title="${esc(t("baseSkin"))}" aria-label="${esc(t("baseSkin"))}">
            <span class="chroma-dot" style="background:linear-gradient(135deg, var(--gold-bright), var(--raised))"></span>
          </button>
          ${chromas.map(ch => {
            const cols = ch.colors || [];
            const bg = cols.length >= 2
              ? `linear-gradient(135deg, ${esc(cols[0])} 50%, ${esc(cols[1])} 50%)`
              : (cols[0] ? esc(cols[0]) : "var(--gold)");
            return `<button class="chroma-btn ${ch.selected ? "sel" : ""}" data-action="set-skin" data-id="${ch.id}" title="${esc(ch.name)}" aria-label="${esc(ch.name)}">
              <span class="chroma-dot" style="background:${bg}"></span>
            </button>`;
          }).join("")}
        </div>
      </div>` : "";

    const wardSec = wards.length ? `
      <div class="chroma-sec" data-key="ward-skins">
        <div class="eyebrow">${esc(t("wardSkins"))}</div>
        <div class="chip-grid">
          ${wards.map(w => `<button class="chip ${w.selected ? "active" : ""}" data-action="set-ward-skin" data-id="${w.id}">
            ${WARD_SVG}<span>${esc(w.name)}</span>
          </button>`).join("")}
        </div>
      </div>` : "";

    return `<section class="panel" data-key="skins-only-panel">
        ${skinsCarouselHtml(cs)}
        ${chromaSec}
        ${wardSec}
      </section>`;
  }

  function prepTab(cs) {
    const spells = cs.available_spells || [];
    const s1Raw = spells.find(sp => sp.id === cs.spell1_id) || { id: cs.spell1_id || 4, name: "Flash", cooldown: "" };
    const s2Raw = spells.find(sp => sp.id === cs.spell2_id) || { id: cs.spell2_id || 14, name: "Ignite", cooldown: "" };
    const s1Name = spellName(s1Raw.id, s1Raw.name);
    const s2Name = spellName(s2Raw.id, s2Raw.name);
    const savedPages = (cs.rune_pages && cs.rune_pages.length) ? cs.rune_pages : (cs.recommended_rune_pages || []);
    const recCards = cs.recommended_cards || [];
    const pTree = (cs.rune_trees || []).find(tr => tr.id === ui.customPrimary);
    const sTree = (cs.rune_trees || []).find(tr => tr.id === ui.customSub);
    const spellBtn = (n, raw, name) => `<button class="spell-btn ${ui.spellPickerOpen && ui.spellSlot === n ? "focus" : ""}" data-action="focus-spell-slot" data-slot="${n}">
        ${pt("spell", raw.id, spellFallbackGlyph(raw.id, name), 48)}
        <span class="spell-btn-lbl"><span class="keycap">${esc(n === 1 ? t("slotD") : t("slotF"))}</span><span class="ellipsis">${esc(name)}</span></span>
      </button>`;
    const chip = (cls, action, attrs, icon, label) =>
      `<button class="chip ${cls}" data-action="${action}" ${attrs}>${icon}<span>${esc(label)}</span></button>`;

    const findPerkName = (id) => {
      for (const tr of (cs.rune_trees || [])) {
        for (const list of [tr.keystones, tr.slot1, tr.slot2, tr.slot3]) {
          const hit = (list || []).find(x => x.id === id);
          if (hit) return hit.name;
        }
      }
      return "";
    };
    const renderPerkStrip = (perks) => `<div class="rune-strip" style="margin-bottom:0" aria-hidden="true">
        ${pt("perk", perks[0], esc(initials(findPerkName(perks[0]))), 30, "round self")}
        ${[1, 2, 3].map(i => pt("perk", perks[i], esc(initials(findPerkName(perks[i]))), 21, "round")).join("")}
        <i class="rdiv"></i>
        ${[4, 5].map(i => pt("perk", perks[i], esc(initials(findPerkName(perks[i]))), 21, "round")).join("")}
        <i class="rdiv"></i>
        ${[6, 7, 8].map(i => pt("perk", perks[i], shardFallbackGlyph(perks[i]), 19, "round")).join("")}
      </div>`;

    const isJungle = !cs.is_roleless && laneInfo(cs.assigned_position).key === "JUNGLE";
    const hasSmite = cs.spell1_id === 11 || cs.spell2_id === 11;
    const smiteAvail = spells.some(sp => sp.id === 11);
    const smiteWarnHtml = (cs.spells_editable !== false && isJungle && !hasSmite && smiteAvail)
      ? `<div class="smite-warn">
          <span class="row" style="gap:8px">${WARN_SVG}<span>${esc(t("missingSmite"))}</span></span>
          <button class="btn btn-ghost btn-sm" data-action="equip-smite">${esc(t("equipSmite"))}</button>
        </div>` : "";

    const spellsSec = cs.spells_editable === false
      ? `<div class="prep-sec">
          <div class="prep-sec-head"><span class="eyebrow">${esc(t("hlSpells"))}</span></div>
          <div class="empty-note" style="padding:8px 4px">${esc(t("arenaFixedSpells"))}</div>
        </div>`
      : `<div class="prep-sec">
          <div class="prep-sec-head">
            <span class="eyebrow">${esc(t("hlSpells"))}</span>
            <span class="meta">${esc(t("changeSpellHint"))}</span>
          </div>
          ${smiteWarnHtml}
          <div class="spell-duel">
            ${spellBtn(1, s1Raw, s1Name)}
            <button class="spell-swap-orb" data-action="swap-spells" aria-label="${esc(t("swapDF"))}">
              <svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/></svg>
            </button>
            ${spellBtn(2, s2Raw, s2Name)}
          </div>
          ${ui.spellPickerOpen ? `<div class="chip-grid">
            ${spells.map(sp => {
              const active = (ui.spellSlot === 1 ? cs.spell1_id : cs.spell2_id) === sp.id;
              const nm = spellName(sp.id, sp.name);
              return chip(active ? "active" : "", "pick-spell", `data-id="${sp.id}"`, pt("spell", sp.id, spellFallbackGlyph(sp.id, nm), 26, "no-rim"), nm);
            }).join("")}
          </div>` : ""}
        </div>`;

    let runeBody;
    if (ui.runeSubView === "recommended") {
      runeBody = recCards.length ? `<div class="stack">${recCards.map((card, idx) => {
        const perks = (card.selected_perk_ids || []).join(",");
        const pStyle = styleName(card.primary_style_id, card.primary_style_name);
        const sStyle = styleName(card.sub_style_id, card.sub_style_name);
        const hasRecSpells = cs.spells_editable !== false && card.spell1_id > 0 && card.spell2_id > 0;
        const sp1Nm = spellName(card.spell1_id, "");
        const sp2Nm = spellName(card.spell2_id, "");
        return `<div class="rec-card ${card.current ? "current" : ""}" data-key="rc-${idx}">

                ${pt("style", card.primary_style_id, "", 15, "round no-rim")}
                <span class="ellipsis">${esc(pStyle)} + ${esc(sStyle)} · ${esc(card.name)}</span>
              </span>
            </div>
            ${hasRecSpells ? `<span class="row" style="gap:4px">${pt("spell", card.spell1_id, spellFallbackGlyph(card.spell1_id, sp1Nm), 22)}${pt("spell", card.spell2_id, spellFallbackGlyph(card.spell2_id, sp2Nm), 22)}</span>` : ""}
            ${card.current ? `<span class="tag green">${esc(t("activeTag"))}</span>` : ""}
          </div>
          ${(card.selected_perk_ids || []).length === 9 ? renderPerkStrip(card.selected_perk_ids) : ""}
          <div class="rec-actions">
            <button class="btn btn-plate btn-sm" data-action="select-rune-page" data-is-preset="1" data-name="${esc(card.name)}" data-pri="${card.primary_style_id}" data-sub="${card.sub_style_id}" data-perks="${esc(perks)}">${esc(t("applyShort"))}</button>
            ${hasRecSpells ? `<button class="btn btn-ghost btn-sm" data-action="apply-rec-both" data-name="${esc(card.name)}" data-pri="${card.primary_style_id}" data-sub="${card.sub_style_id}" data-perks="${esc(perks)}" data-s1="${card.spell1_id}" data-s2="${card.spell2_id}">${esc(t("applyBoth"))}</button>` : ""}
            <button class="btn btn-ghost btn-sm" data-action="edit-rune-page" data-name="${esc(card.name)}" data-pri="${card.primary_style_id}" data-sub="${card.sub_style_id}" data-perks="${esc(perks)}">${esc(t("editBuilder"))}</button>
          </div>
        </div>`;
      }).join("")}</div>` : `<div class="empty-note">${esc(t("noRecRunes"))}</div>`;
    } else if (ui.runeSubView === "saved") {
      runeBody = `<div class="stack">${savedPages.map(pg => {
        const keystoneId = (pg.selected_perk_ids || [])[0] || 0;
        const pStyle = styleName(pg.primary_style_id, pg.primary_style_name);
        const sStyle = styleName(pg.sub_style_id, pg.sub_style_name);
        const perks = (pg.selected_perk_ids || []).join(",");
        const canEdit = (pg.selected_perk_ids || []).length === 9;
        return `<div class="page-row ${pg.current ? "current" : ""}" data-key="pg${pg.id}">
            <button class="grow row" style="gap:10px;text-align:left;min-height:44px" data-action="select-rune-page" data-id="${pg.id}" data-is-preset="${pg.is_preset ? "1" : "0"}" data-name="${esc(pg.name)}" data-pri="${pg.primary_style_id}" data-sub="${pg.sub_style_id}" data-perks="${esc(perks)}">
              ${pt("perk", keystoneId, esc(initials(pg.keystone_name)), 36, "round no-rim")}
              <span class="grow">
                <b class="ellipsis" style="display:block">${esc(pg.name)}</b>
                <span class="meta row" style="gap:5px;margin-top:2px">
                  ${pt("style", pg.primary_style_id, "", 15, "round no-rim")}<span class="ellipsis">${esc(pStyle)} · ${esc(sStyle)}</span>
                  ${pg.is_preset ? `<span class="tag">${esc(t("presetTag"))}</span>` : ""}
                </span>
              </span>
              ${pg.current ? `<span class="tag green">${esc(t("activeTag"))}</span>` : `<span class="page-apply">${esc(t("applyShort"))}</span>`}
            </button>
            ${canEdit ? `<button class="btn btn-ghost btn-sm" data-action="edit-rune-page" data-name="${esc(pg.name)}" data-pri="${pg.primary_style_id}" data-sub="${pg.sub_style_id}" data-perks="${esc(perks)}">${esc(t("editBuilder"))}</button>` : ""}
          </div>`;
      }).join("")}</div>`;
    } else {
      runeBody = `<div>
          <div style="margin-bottom:10px">${renderPerkStrip(ui.customPerks)}</div>
          <input id="custom-rune-name" class="field" type="text" value="${esc(ui.customName)}" placeholder="${esc(t("runeNamePh"))}">
          <div class="sub-k">${esc(t("priPath"))}</div>
          <div class="chip-grid">${(cs.rune_trees || []).map(tr => chip(tr.id === ui.customPrimary ? "active" : "", "rune-pri", `data-id="${tr.id}"`, pt("style", tr.id, "", 22, "round no-rim"), styleName(tr.id, tr.name))).join("")}</div>
          ${pTree ? `
            <div class="sub-k">${esc(t("keystone"))}</div>
            <div class="chip-grid ${pTree.keystones.length === 3 ? "three" : ""}">${pTree.keystones.map(k => chip(ui.customPerks[0] === k.id ? "active" : "", "rune-p", `data-slot="0" data-id="${k.id}"`, pt("perk", k.id, esc(initials(k.name)), 28, "round no-rim"), k.name)).join("")}</div>
            ${[pTree.slot1, pTree.slot2, pTree.slot3].map((rowOpts, idx) => `<div class="chip-grid three">${rowOpts.map(o => chip(ui.customPerks[idx + 1] === o.id ? "active" : "", "rune-p", `data-slot="${idx + 1}" data-id="${o.id}"`, pt("perk", o.id, esc(initials(o.name)), 22, "round no-rim"), o.name)).join("")}</div>`).join("")}
          ` : ""}
          <div class="sub-k">${esc(t("secPath"))}</div>
          <div class="chip-grid">${(cs.rune_trees || []).filter(tr => tr.id !== ui.customPrimary).map(tr => chip(tr.id === ui.customSub ? "sub-active" : "", "rune-sub-tree", `data-id="${tr.id}"`, pt("style", tr.id, "", 22, "round no-rim"), styleName(tr.id, tr.name))).join("")}</div>
          ${sTree ? ["slot1", "slot2", "slot3"].map(rowKey => `<div class="chip-grid three">${(sTree[rowKey] || []).map(o => chip(ui.customSubMeta.some(m => m.id === o.id) ? "sub-active" : "", "rune-sub-perk", `data-row="${rowKey}" data-id="${o.id}"`, pt("perk", o.id, esc(initials(o.name)), 22, "round no-rim"), o.name)).join("")}</div>`).join("") : ""}
          <div class="sub-k">${esc(t("statShards"))}</div>
          ${STAT_SHARD_ROWS.map(sr => `<div class="chip-grid three">${sr.options.map(id => chip(ui.customPerks[sr.slot] === id ? "active" : "", "rune-shard", `data-slot="${sr.slot}" data-id="${id}"`, pt("perk", id, shardFallbackGlyph(id), 20, "round no-rim"), shardName(id))).join("")}</div>`).join("")}
          <button class="btn btn-plate btn-block" style="margin-top:14px" data-action="save-custom-runes">${esc(t("save9Runes"))}</button>
        </div>`;
    }

    return `
      <section class="panel" data-key="loadout-unified">
        ${spellsSec}
        <div class="prep-sec">
          <div class="prep-sec-head">
            <span class="eyebrow">${esc(t("runes"))}</span>
          </div>
          <div class="seg three" style="margin-bottom:10px" role="tablist">
            <button class="${ui.runeSubView === "recommended" ? "active" : ""}" role="tab" aria-selected="${ui.runeSubView === "recommended"}" data-action="rune-sub" data-mode="recommended">${esc(t("recRunes"))}</button>
            <button class="${ui.runeSubView === "saved" ? "active" : ""}" role="tab" aria-selected="${ui.runeSubView === "saved"}" data-action="rune-sub" data-mode="saved">${esc(t("pages"))}</button>
            <button class="${ui.runeSubView === "custom" ? "active" : ""}" role="tab" aria-selected="${ui.runeSubView === "custom"}" data-action="rune-sub" data-mode="custom">${esc(t("builder"))}</button>
          </div>
          ${runeBody}
        </div>
      </section>`;
  }

  function teamTab(cs) {
    const incoming = cs.incoming_swaps || [];
    const swapBtn = (kind, id, state, label) => {
      if (id == null || (state !== "AVAILABLE" && state !== "SENT")) return `<button class="btn btn-ghost btn-sm" disabled>${esc(label)}</button>`;
      return state === "SENT"
        ? `<button class="btn btn-danger btn-sm" data-action="cancel-swap" data-kind="${kind}" data-id="${id}">${esc(t("cancelLane"))}</button>`
        : `<button class="btn btn-ghost btn-sm" data-action="req-swap" data-kind="${kind}" data-id="${id}">${esc(label)}</button>`;
    };
    return `
      ${incoming.length ? `<section class="panel spot">
        <div class="eyebrow" style="margin-bottom:10px">${esc(t("incomingReq"))}</div>
        <div class="stack">${incoming.map(sw => `
          <div class="mate" data-key="in-${esc(sw.kind)}-${sw.id}">
            <div><b>${esc(sw.caller_name)}</b> · <span class="meta">${esc(swapKindLabel(sw.kind))}</span></div>
            ${sw.detail ? `<div class="meta">${esc(sw.detail)}</div>` : ""}
            <div class="dock-row" style="grid-template-columns:1fr 1fr">
              <button class="btn btn-ghost" data-action="resp-swap" data-kind="${esc(sw.kind)}" data-id="${sw.id}" data-accept="0">${esc(t("decline"))}</button>
              <button class="btn btn-plate" data-action="resp-swap" data-kind="${esc(sw.kind)}" data-id="${sw.id}" data-accept="1">${esc(t("accept"))}</button>
            </div>
          </div>`).join("")}
        </div>
      </section>` : ""}
      <section class="panel">
        <div class="eyebrow" style="margin-bottom:10px">${esc(t("allies"))}</div>
        <div class="stack">
          ${(cs.my_team || []).map(a => `
            <div class="mate ${a.is_self ? "self" : ""}" data-key="m${a.cell_id}">
              <div class="row">
                ${cs.is_roleless ? "" : roundel(a.assigned_position)}
                ${champPt(a.champion_id, a.champion_name, 36, a.is_self ? "self" : "")}
                <div class="grow">
                  <b class="ellipsis" style="display:block">${esc(a.champion_name || t("pending"))}</b>
                  <span class="meta ellipsis" style="display:block">${esc(a.is_self ? t("youTag") : a.summoner_name)}</span>
                </div>
              </div>
              ${a.is_self ? "" : `<div class="swap-row" style="${cs.is_roleless ? "grid-template-columns:repeat(2,1fr)" : ""}">
                ${cs.is_roleless ? "" : swapBtn("position", a.position_swap_id, a.position_swap_state, t("swapLane"))}
                ${swapBtn("pick", a.pick_swap_id, a.pick_swap_state, t("swapOrder"))}
                ${swapBtn("trade", a.trade_id, a.trade_state, t("tradeChamp"))}
              </div>`}
            </div>`).join("")}
        </div>
      </section>`;
  }

  // ---- Champ-select helper: secondary Guide bottom sheet --------------------------------------
  function fmtPct(rate) {
    const n = (Number(rate) * 100).toLocaleString(activeLang() === "fr" ? "fr-FR" : "en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    return activeLang() === "fr" ? `${n} %` : `${n}%`;
  }
  function originTag(origin) {
    if (!origin) return "";
    const key = "origin" + origin;
    return `<span class="tag ${origin === "Online" ? "online" : ""}">${esc(t(key))}</span>`;
  }
  // Families of I18N keys named <prefix><variant> (trait_, stPage_, stage_, q_): every variant
  // has its own entry in EN and FR, so the lookup is built here rather than spelled out.
  function tk(prefix, kind) { return t(prefix + kind); }

  function dmgHtml(label, side, comp) {
    const known = (comp && comp.champions) > 0;
    const pct = v => Math.round(Number(v || 0) * 100);
    const bar = known
      ? `<div class="dmg-bar"><i class="p" style="width:${pct(comp.physical)}%"></i><i class="m" style="width:${pct(comp.magic)}%"></i><i class="t" style="width:${pct(comp.true_damage)}%"></i></div>`
      : `<div class="dmg-bar none"></div>`;
    const traits = known && comp.traits.length
      ? `<div class="traits">${comp.traits.map(tr => `<span class="trait ${tr.gap ? "gap" : ""}">${esc(tk("trait_", tr.kind))}</span>`).join("")}</div>` : "";
    return `<div class="dmg">
        <div class="dmg-top"><span class="${side}">${esc(label)}</span>${known ? `<span class="meta mono">${esc(t("dmgSplit", pct(comp.physical), pct(comp.magic)))}</span>` : ""}</div>
        ${bar}${traits}
      </div>`;
  }
  function helperTab(cs) {
    const h = cs.helper || {};
    const has = Number(h.champion_id) > 0;
    const online = h.online || { state: "Off" };
    const shownOnline = [h.runes, h.spells, h.items].some(v => v && v.origin === "Online") || (h.lane && h.lane.origin === "Online");
    const demo = [h.runes, h.items].some(v => v && v.origin === "Demo");
    const r = h.runes, sp = h.spells, it = h.items, lane = h.lane;
    const rows = [];
    if (r) {
      const perks = (r.selected_perk_ids || []).join(",");
      const canApply = (r.selected_perk_ids || []).length === 9;
      rows.push(`<div class="hl-row">
          <span class="hl-k">${esc(t("runes"))}</span>
          ${pt("perk", r.keystone.id, esc(initials(r.keystone.name)), 40, "round")}
          <span class="grow"><b class="ellipsis" style="display:block">${esc(r.keystone.name)}</b>
            <span class="meta row" style="gap:5px">${pt("style", r.sub_style.id, "", 16, "round no-rim")}<span class="ellipsis">${esc(styleName(r.primary_style.id, r.primary_style.name))} + ${esc(styleName(r.sub_style.id, r.sub_style.name))}</span></span></span>
          ${originTag(r.origin)}
        </div>`);
      if (canApply) {
        rows.push(`<div class="hl-apply"><button class="btn btn-ghost" data-action="select-rune-page" data-is-preset="1" data-name="${esc(t("helperPage", h.champion_name))}" data-pri="${r.primary_style.id}" data-sub="${r.sub_style.id}" data-perks="${esc(perks)}">${esc(t("applyRunes"))}</button></div>`);
      }
    }
    if (sp) {
      rows.push(`<div class="hl-row">
          <span class="hl-k">${esc(t("hlSpells"))}</span>
          ${pt("spell", sp.first.id, spellFallbackGlyph(sp.first.id, spellName(sp.first.id, sp.first.name)), 34)}
          ${pt("spell", sp.second.id, spellFallbackGlyph(sp.second.id, spellName(sp.second.id, sp.second.name)), 34)}
          <span class="grow ellipsis">${esc(spellName(sp.first.id, sp.first.name))} + ${esc(spellName(sp.second.id, sp.second.name))}</span>
          ${originTag(sp.origin)}
        </div>`);
      if (cs.spells_editable !== false && sp.first.id > 0 && sp.second.id > 0) {
        rows.push(`<div class="hl-apply"><button class="btn btn-ghost" data-action="apply-guide-spells" data-s1="${sp.first.id}" data-s2="${sp.second.id}">${esc(t("applySpells"))}</button></div>`);
      }
    }
    if (it && it.items.length) {
      rows.push(`<div class="hl-row">
          <span class="hl-k">${esc(t("coreItems"))}</span>
          <span class="hl-items">${it.items.map(e => `<span class="hl-item">${pt("item", e.id, esc(initials(e.name)), 40)}<span class="meta ellipsis">${esc(e.name)}</span></span>`).join("")}</span>
          ${originTag(it.origin)}
        </div>`);
    }
    if (!rows.length) rows.push(`<div class="empty-note">${esc(has ? t("noBuild") : t("hoverForBuild"))}</div>`);
    if (lane) {
      const li = laneInfo(lane.position);
      rows.push(`<div class="hl-row">
          ${roundel(lane.position)}
          <b>${esc(li.label)} ${esc(t("laneVs"))} ${esc(lane.enemy_champion_name)}</b>
          ${champPt(lane.enemy_champion_id, lane.enemy_champion_name, 30, "round enemy")}
          <span class="grow meta ellipsis">${lane.win_rate != null ? esc(t("laneRate", fmtPct(lane.win_rate), fmtNum(lane.games))) : ""}</span>
          ${lane.win_rate != null ? originTag(lane.origin) : ""}
        </div>`);
    }
    const hint = demo ? t("hintDemo")
      : online.state === "Off" ? t("hintOff")
      : online.state === "Loading" && has ? t("hintLoading")
      : online.state === "NoData" && has ? t("hintNoData")
      : online.state === "OtherMode" && has ? t("hintOtherMode")
      : online.state === "Failed" ? (online.message || "") : "";
    const link = shownOnline && h.attribution
      ? `<a class="hl-link" href="${esc(h.attribution.url)}" target="_blank" rel="noopener noreferrer">${esc(t("dataFrom", h.attribution.provider))}</a>` : "";
    const tips = (h.tips || []).length ? `<ul class="tips">${h.tips.map(tip => `<li>${esc(tip)}</li>`).join("")}</ul>` : "";
    const canHoverSugg = Boolean(hoverTarget(cs));
    const sugg = (h.suggested_picks || []).length ? `<section class="panel">
        <div class="eyebrow" style="margin-bottom:8px">${esc(t("hlSuggestedPicks"))}</div>
        <div class="row" style="gap:8px;flex-wrap:wrap">${h.suggested_picks.map(s => {
          const inner = `${champPt(s.champion_id, s.champion_name, 28)}
            <span><b style="display:block;font-size:13px">${esc(s.champion_name)}${s.tier ? ` · ${esc(tierLabel(s.tier))}` : ""}</b>
            <span class="meta mono" style="font-size:11px">${s.personal_games > 0 ? `${s.personal_games}g${s.personal_win_rate != null ? " " + esc(fmtPct(s.personal_win_rate)) : ""}` : (s.meta_win_rate != null ? esc(fmtPct(s.meta_win_rate)) : "")}</span></span>`;
          return canHoverSugg
            ? `<button class="row" style="gap:6px;min-height:44px;padding:6px 10px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--raised);text-align:left" data-action="hover-champ" data-id="${s.champion_id}" data-name="${esc(s.champion_name)}" data-close-guide="1">${inner}</button>`
            : `<div class="row" style="gap:6px;padding:6px 8px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--raised)">${inner}</div>`;
        }).join("")}</div>
      </section>` : "";
    return `
      ${sugg}
      <section class="panel" aria-label="${esc(t("yourBuild"))}">
        <div class="hl-head">
          <span class="eyebrow">${esc(t("yourBuild"))}</span>
          ${has ? `<span class="hl-champ">${esc(h.champion_name)}${h.position ? ` · ${esc(laneInfo(h.position).label)}` : ""}</span>` : ""}
          ${h.win_rate != null ? `<span class="meta mono">${esc(t("winRate", fmtPct(h.win_rate)))}</span>` : ""}
        </div>
        ${rows.join("")}
        ${link}
      </section>
      <section class="panel">
        ${dmgHtml(t("yourTeam"), "blue", h.my_comp)}
        ${dmgHtml(t("enemyComp"), "red", h.their_comp)}
        <div class="dmg-key"><span><i style="background:var(--dmg-phys)"></i>${esc(t("physical"))}</span><span><i style="background:var(--dmg-mag)"></i>${esc(t("magic"))}</span><span><i style="background:var(--dmg-true)"></i>${esc(t("trueDmg"))}</span></div>
        ${tips}
        ${hint ? `<div class="hl-hint">${esc(hint)}</div>` : ""}
      </section>`;
  }

  function renderGuideSheet(s) {
    const sheetEl = $("guide-sheet");
    const cs = s && s.phase === "ChampSelect" ? s.champ_select : null;
    if (!ui.guideOpen || !cs || ui.mode === "stats") {
      sheetEl.hidden = true;
      sheetEl.innerHTML = "";
      return;
    }
    sheetEl.hidden = false;
    const html = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t("tabGuide"))}" data-key="guide-dialog">
        <div class="sheet-head">
          <span class="eyebrow">${esc(t("tabGuide"))}</span>
          <button class="btn btn-ghost btn-sm" type="button" data-action="close-guide">${esc(t("close"))}</button>
        </div>
        <div class="sheet-body">${helperTab(cs)}</div>
      </div>`;
    morphInto(sheetEl, html);
  }

  function renderChampSelect(s) {
    const cs = s.champ_select;
    if (!cs) {
      renderDock("");
      return `<section class="panel"><h2 class="title sm">${esc(t("champSelect"))}</h2><div class="meta" style="margin-top:4px">${esc(t("syncDraft"))}</div></section>`;
    }
    syncBuilderFromActivePage(cs);
    syncCustomRunesDefaults(cs);
    if (!["pick", "prep", "skins", "team"].includes(ui.csTab)) ui.csTab = "pick";
    const act = cs.active_action;
    const isTurn = Boolean(act && act.is_my_turn && !act.completed);
    const isBan = Boolean(act && act.action_type === "ban");
    const incoming = (cs.incoming_swaps || []).length > 0;
    const tabs = tabsHtml([
      { id: "pick", label: t("tabPick") },
      { id: "prep", label: t("tabPrep") },
      { id: "skins", label: t("tabSkins") },
      { id: "team", label: t("tabTeam"), dot: incoming && ui.csTab !== "team" }
    ], ui.csTab, "cs-tab");
    if (isTurn) {
      const has = act.champion_id > 0;
      renderDock(`<button class="btn btn-signal" data-action="lock-action" data-action-id="${act.action_id}" ${has ? "" : "disabled"}>
          ${has ? champPt(act.champion_id, act.champion_name, 32) : ""}
          <span>${esc(isBan ? t("actBan") : t("actPick"))}</span>
          <span class="lock-name ellipsis">${esc(has ? act.champion_name : (isBan ? t("chooseBan") : t("choosePick")))}</span>
        </button>${tabs}`);
    } else {
      renderDock(tabs);
    }
    const body = ui.csTab === "pick" ? pickTab(cs, act, isBan)
      : ui.csTab === "prep" ? prepTab(cs)
      : ui.csTab === "skins" ? skinsTab(cs)
      : teamTab(cs);
    const showAramBar = Boolean(cs.bench_enabled || (cs.rerolls_remaining || 0) > 0);
    const benchList = cs.bench_champions || [];
    const bench = showAramBar ? `
      <section class="panel" data-key="aram-bench">
        <div class="between" style="margin-bottom:${benchList.length ? "8px" : "0"}">
          <span class="eyebrow">${esc(t("csBench"))}</span>
          <button class="btn btn-plate btn-sm" data-action="reroll-champ" ${(cs.rerolls_remaining || 0) > 0 ? "" : "disabled"}>
            ${DICE_SVG}<span>${esc(t("reroll", cs.rerolls_remaining || 0))}</span>
          </button>
        </div>
        ${benchList.length ? `<div class="row" style="gap:8px;flex-wrap:wrap">${benchList.map(b => `
          <button class="btn btn-ghost" style="min-height:44px;padding:4px 10px;gap:6px" data-action="bench-swap" data-id="${b.champion_id}" aria-label="${esc(t("csBenchSwap", b.champion_name))}">
            ${champPt(b.champion_id, b.champion_name, 30)}
            <span>${esc(b.champion_name)}</span>
          </button>`).join("")}
        </div>` : ""}
      </section>` : "";
    const flash = isTurn && Date.now() < ui.turnFlashUntil;
    const pos = laneInfo(cs.assigned_position);
    const totalSec = Math.max(1, cs.total_time_sec || cs.time_left_sec || 30);
    const frac = Math.min(1, Math.max(0, (cs.time_left_sec || 0) / totalSec));
    const subMetaInner = cs.is_roleless
      ? `<span class="ellipsis">${esc(queueLabel(cs.queue_type) || subPhaseLabel(cs.sub_phase))}</span>`
      : `${laneSvg(pos.key, 13, pos.color)}<span class="ellipsis">${esc(pos.label)} · ${esc(queueLabel(cs.queue_type) || subPhaseLabel(cs.sub_phase))}</span>`;
    return `
      <section class="panel cs-turn-plate ${isTurn ? "spot" : ""}${flash ? " turn-start" : ""}" data-key="cs-turn">
        <div class="plate-head">
          <div class="grow">
            <h2 class="title">${esc(isTurn ? (isBan ? t("turnBan") : t("turnPick")) : subPhaseLabel(cs.sub_phase))}</h2>
            <div class="sub-meta">${subMetaInner}</div>
          </div>
          ${clockHtml(cs.time_left_sec, { down: true, total: totalSec, fmt: "s" })}
        </div>
        <div class="cs-turn-bar js-bar" aria-hidden="true"><i style="transform:scaleX(${frac.toFixed(3)})"></i></div>
      </section>
      ${draftHud(cs)}
      ${inlineSwapsHtml(cs)}
      ${bench}
      ${body}`;
  }

  // ---- Live game ------------------------------------------------------------------------------
  function liveRow(p, mine) {
    const csRate = p.cs_per_min > 0 ? ` · ${fmtDec(p.cs_per_min)} CS/m` : "";
    const csDiff = p.cs_diff_vs_lane != null
      ? ` <span style="color:${p.cs_diff_vs_lane > 0 ? "var(--green)" : (p.cs_diff_vs_lane < 0 ? "var(--red)" : "var(--muted)")}">(${p.cs_diff_vs_lane > 0 ? "+" : p.cs_diff_vs_lane < 0 ? "−" : "±"}${Math.abs(p.cs_diff_vs_lane)})</span>`
      : "";
    return `<div class="ally ${p.champion_id > 0 ? "locked" : ""} ${p.dead ? "dead" : ""} ${p.is_self ? "self" : ""}" data-key="lp-${mine ? "a" : "e"}-${p.champion_id}">
        ${bannerHtml(p.skin_id, p.champion_id)}
        ${roundel(p.lane)}
        ${champPt(p.champion_id, p.champion, 38, (p.is_self ? "self " : "") + (mine ? "" : "enemy ") + (p.dead ? "dead" : ""))}

          <div class="ally-name ellipsis">${esc(p.champion)}</div>
          <div class="ally-sub">${esc(t("lvl", p.level))} · ${p.cs} ${esc(t("cs"))}${esc(csRate)}${csDiff}</div>
        </div>
        <span class="side">${p.dead ? `<span class="respawn-chip">${p.respawn_sec}s</span>` : `<span class="kda-txt">${esc(p.kda)}</span>`}</span>

  function livePitsHtml(lg) {

    if (!pits.length) return "";

        ${pits.map(p => {

            ? `<span class="pit-cell-val">${esc(t("pitUp"))}</span>`
            : `<span class="js-clock-wrap" data-base="${p.in_sec}" data-dir="-1" data-total="0" data-fmt="mmss" data-calm="1" data-zero-label="${esc(t("pitUp"))}"><span class="pit-cell-val js-clock" role="timer">${fmtClock(p.in_sec, "mmss")}</span></span>`;
          return `<div class="pit-cell ${isUp ? "up" : ""}">
              <span class="pit-cell-top">${objectiveSvg(p.label, 14)}<span class="pit-cell-lbl">${esc(p.label)}</span></span>

            </div>`;

  function renderLive(s) {
    const lg = s.live_game;
    renderDock(lg ? tabsHtml([{ id: "allies", label: t("allies") }, { id: "enemies", label: t("enemies") }], ui.liveTab, "live-tab") : "");

      return `<section class="panel"><h2 class="title sm">${esc(t("liveMatch"))}</h2><div class="meta" style="margin-top:4px">${esc(t("waitingLive"))}</div></section>`;
    }
    const me = (lg.allies || []).find(p => p.is_self);
    const dead = Boolean(me && me.dead);
    const clockSec = parseClock(lg.clock);
    const list = ui.liveTab === "allies" ? (lg.allies || []) : (lg.enemies || []);
    const selfCsMeta = lg.self_cs_per_min > 0
      ? `<span><b>${esc(fmtDec(lg.self_cs_per_min))}</b> ${esc(t("stCsMin"))}${lg.lane_cs_diff != null ? ` (${lg.lane_cs_diff > 0 ? "+" : lg.lane_cs_diff < 0 ? "−" : "±"}${Math.abs(lg.lane_cs_diff)})` : ""}${lg.personal_avg_cs_per_min > 0 ? ` · ${esc(t("stAvgScore"))} ${esc(fmtDec(lg.personal_avg_cs_per_min))}` : ""}</span>`
      : "";
    const opp = (!dead && me && me.lane && me.lane !== "FLEX")
      ? (lg.enemies || []).find(e => e.lane === me.lane)

    let heroCard;
    if (dead) {
      heroCard = `<section class="panel death">
          <div class="me">

    } else if (opp) {

      heroCard = `<section class="panel duel-card">
          <div class="duel-grid">

                <div class="duel-kda">${esc(lg.kda)}</div>

                <div class="duel-kda">${esc(opp.kda)}</div>

            <div class="grow">

              <div class="stats-line"><span>${esc(t("lvl", lg.level))}</span><span><b>${lg.cs}</b> ${esc(t("cs"))}</span>${selfCsMeta}<span><b>${fmtNum(Math.floor(lg.current_gold))}</b> ${esc(t("gold"))}</span></div>

    const buffs = (lg.active_buffs || []).map(b => {
